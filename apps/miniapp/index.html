<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0d12" />
    <title>Ломбард на последнем этаже</title>
    <!-- The app's css arrives with its js; until then only this keeps the page from flashing white and says that it is loading. -->
    <style>
      html, body { margin: 0; background: #0b0d12; color: #8d8775; font: 14px/1.4 Georgia, "Times New Roman", serif; }
      #app:empty::after { content: "Загрузка…"; position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; letter-spacing: 0.14em; text-transform: uppercase; font-size: 12px; }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js?59"></script>
    <!-- The app asks for the asset manifest right after its js runs; preloading it saves that round trip on the title. -->
    <link rel="preload" href="/assets.json" as="fetch" crossorigin />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
