# Блокнот Ника — справочник и экран прогресса. Открывается из меню в любой момент.
# Страница: text — голос Ника (как в отчёте), rule — простое объяснение механики.
# when — условие открытия страницы; пишется только по profile-качествам,
# чтобы страница не пропадала на следующую ночь. Без when страница открыта сразу.
# Правило: с самого начала открыты только «Моя жизнь», «Дело», «Белведер», «Ночь»,
# «Сигареты», «Улики». Люди и места появляются после первой встречи.

life:
  # Страница «Что я о себе знаю» собирается из пар `memories` в world.yaml.
  title: Что я о себе знаю
  intro: "Всё, что я о себе знаю. Записал, чтобы было с чем сверяться."
  # Как рисуется каждая строка, в зависимости от состояния пары:
  states:
    fake: "{label_fake}"                        # ложное ещё на месте
    empty: "~~{label_fake}~~ — пусто"           # заложено, настоящее не вернулось
    real: "~~{label_fake}~~ → {label_real}"     # вернулось настоящее, написано другим почерком
  # Подпись внизу показывается только после первого возврата.
  footer:
    when: [memories_returned >= 1]
    text: "Почерк в некоторых строках не мой. То есть мой, но другой."

# v2. Зацепки — открытые вопросы дела. Вкладка в блокноте.
# when — когда зацепка появляется (profile-качества); done — когда закрыта;
# answer — строка под зачёркнутой зацепкой; target — локация, на двери которой скрепка.
leads:
  - id: laundry_tag
    when: [met.vivian == 1]
    text: "Бирка: «Белведер, 2 эт., Хейл, 14 рубашек». Четырнадцать рубашек — не одна ночь. Кто их стирал?"
    target: tenant_02
    done: [knows.room == 1]
    answer: "Хейл жил в доме, в комнате 3-В на третьем."
  - id: matchbook
    when: [met.vivian == 1]
    text: "Коробок «Синего фонаря», на обороте цифры. Похоже на бухгалтерию. Чью?"
    target: tenant_04
    done: [knows.matchbook == 1]
    answer: "Строки из ревизии Слоуна. Недостача четыре тысячи, март."
  - id: note_12
    when: [met.vivian == 1]
    text: "«12 — выкупить до 15-го». Что он собирался выкупить на двенадцатом?"
    target: lobby
    done: [knows.invitation == 1]
    answer: "На двенадцатом Владелец. Наверх пускают, когда поручатся трое."
  - id: smoke
    when: [met.vivian == 1]
    text: "Он возвращался под утро и пах дымом. В доме, где никто не курит у себя."
    done: [knows.fire == 1]
    answer: "Одиннадцать лет назад у товарной станции горел корпус. Погибших нет. Жильцы не найдены."
  - id: room
    when: [knows.room == 1]
    text: "Что осталось в 3-В?"
    target: service_03
    done: [found.ring == 1]
    answer: "Кольцо в коробке «Забыто». «В. и У. Навсегда»."
  - id: money
    when: [knows.shortage == 1]
    text: "Куда делись четыре тысячи? И где книга, в которой они пропали?"
    target: tenant_04
    done: [found.ledger_true == 1]
    answer: "Настоящая книга: недостача погашена в ночь на 15 марта."
  - id: denver
    when: [knows.denver == 1]
    text: "Эдди хочет в Денвер, смотреть на горы. Билет стоит денег. У меня в кармане аванс Вивиан."
    target: tenant_02
    done: [vouch.eddie == 1]
    answer: "Отдал. Эдди не помнит, что рассказывал мне про Денвер."
  - id: ruby_u
    when: [knows.ruby_u == 1]
    text: "На пластинке Руби: «Для У., третий столик слева». Кто такой «У.»?"
    target: tenant_07
    done: [knows.ruby_coffee == 1]
    answer: "Он пил кофе, две ложки сахара, без молока. Как я."
  - id: tomorrow
    when: [knows.fire == 1]
    text: "Пожар, которого никто не помнит. Дождь одиннадцать лет. Что здесь заложено первым?"
    target: service_12
    done: [knows.tomorrow == 1]
    answer: "№ 1. Завтрашний день Белведера. Залогодатель: Владелец."
  - id: vouchers
    when: [knows.invitation == 1]
    text: "Кто за меня поручится? Нужны трое."
    done: [vouches >= 3]
    answer: "Трое поручились. Мисс Шоу на одиннадцатом даст пропуск."

# v2. Страница поручительств: три строки, заполняются по порядку поручительств.
vouchers:
  title: Кто за меня поручился
  when: [knows.invitation == 1]
  slots: 3
  empty: "—"
  names:
    vouch.eddie: "Эдди Мэлоун, курьер со второго"
    vouch.pool: "Миссис Пул с третьего"
    vouch.sloan: "Огден Слоун, аудитор с четвёртого"
    vouch.mei: "Мэй Тан, фотограф с пятого"
    vouch.ruby: "Руби Вэнс, певица с седьмого"
    vouch.auerbach: "Доктор Ауэрбах с восьмого"
    vouch.fenn: "Ирвинг Фенн, часовщик с десятого"
  footer: "Когда строк станет три — к мисс Шоу на одиннадцатый."

pages:
  - id: case
    title: Дело
    text: "Клиентка — Вивиан Хейл. Муж, Уолтер Хейл, три недели назад ушёл в Белведер-билдинг и не вернулся. Аванс двести. Остальное — когда найду."
    rule: "Каждая ночь начинается в конторе с Вивиан и заканчивается залогом у Долли. Из ночей складывается дело."

  - id: belvedere
    title: Белведер
    text: "Двенадцать этажей у товарной станции. Днём конторы и меблированные комнаты. Ночью на последнем этаже работает ломбард, где закладывают воспоминания."
    rule: "На каждом этаже дверь жильца, служебная дверь и лестница. Скрепка на двери значит, что туда ведёт открытая зацепка."

  - id: night
    title: Ночь
    text: "С десяти вечера до шести утра. В шесть приезжает Горман с нарядом, и меня выставляют вниз, к Долли, где бы я ни был."
    rule: "Ночь — 16 ходов, каждый по полчаса: ход 4 — полночь, ход 6 — час ночи. Войти в дверь или задать вопрос — 1 ход, долгий разговор — 2. Лестница — 1 ход на каждые два этажа. Выйти на лестницу и вернуться на площадку ничего не стоит."

  - id: pledge
    title: Залог
    when: [met.dolly == 1]
    text: "Из Белведера не уходят с пустыми руками. На выходе Долли протягивает пустой конверт, и я кладу туда кусок своей жизни."
    rule: "Уходя, ты отдаёшь одно воспоминание Ника. Если этой ночью ты нашёл то, что с ним связано, на его место встаёт настоящее. Можно заложить саму ночь: биография не тронута, но ночь не попадёт в дело."

  - id: suspicion
    title: Подозрение
    when: [met.dolly == 1]
    text: "Дом слышит, как я хожу. Чем громче я веду себя, тем быстрее закрываются двери."
    rule: "Растёт от грубых поступков: отобрать, вскрыть, надавить. С 5 жильцы не открывают. На 10 тебя выведут силой."

  - id: cigarettes
    title: Сигареты
    text: "Три штуки в пачке на ночь. Здесь это вместо мелочи."
    rule: "Сигаретой можно угостить, задобрить или откупиться. Каждую ночь их снова три."

  - id: clues
    title: Улики
    text: "Всё, что можно положить на стол. И кое-что, чего лучше бы не находить."
    rule: "Находки ночи. Они не переходят на следующую ночь, но нужны, чтобы при залоге вернуть настоящее воспоминание."

  - id: rumors
    title: Слухи
    when: [nights >= 1]
    text: "Долли каждую ночь говорит одну фразу о доме. Не сплетни — прогноз погоды."
    rule: "Слух дня меняет что-то на эту ночь: открытую дверь, встречу на лестнице, цену пути."

  - id: debts
    title: Должки
    when: [nights >= 1]
    text: "В этом доме услуга за услугу. Кто мне обязан, тот говорит чуть больше."
    rule: "Помоги жильцу, промолчи за него или угости, и он откроет то, что прячет. Должки живут одну ночь."

  - id: report
    title: Отчёт
    when: [nights >= 1]
    text: "Каждое утро я пишу, что видел. Часть этого потом окажется враньём. Пусть, я и вранью веду учёт."
    rule: "После ночи собирается страница отчёта из того, что ты сделал. Из страниц складывается твоё дело Хейла, у каждого игрока оно своё."

  - id: dolly
    title: Долли
    when: [met.dolly == 1]
    text: "Долорес Финч, лифтёрша. Сидит у лифта, который не ходит. Говорит, что помнит всех, кто входил в эту дверь. Не похоже, что шутит."
    rule: "Её доверие не сгорает между ночами. С доверием 2 она достаёт ключи, с 3 запускает грузовой лифт. Каждую ночь у неё новый слух о доме."

  - id: gorman
    title: Сержант Горман
    when: [met.gorman == 1]
    text: "Полиция Харроу. Ищет Хейла не за жалованье. Смотрит так, будто ему нечего бояться, и, кажется, так и есть."
    rule: "Встречается на лестнице, когда Подозрение уже высокое. Сигарета его немного успокаивает."

  - id: eddie
    title: Эдди Мэлоун
    when: [met.eddie == 1]
    text: "Пятнадцать лет, курьер пневмопочты, второй этаж. Читает все записки в доме и не стыдится. Хочет уехать туда, где не дождь."
    rule: "Знает, куда идёт почта. Если ему помочь, покажет короткий путь вниз."

  - id: pool
    title: Миссис Пул
    when: [met.pool == 1]
    text: "Хозяйка меблированных комнат, третий этаж. Накрывает стол на двоих и ждёт сына с флота. Фотография сына стоит лицом к стене."
    rule: "Долгий разговор за столом стоит 2 хода. При повторных визитах рассказывает больше."

  - id: sloan
    title: Огден Слоун
    when: [met.sloan == 1]
    text: "Аудитор, четвёртый этаж. Хочет, чтобы его оставили в покое. Цифры у него сходятся всегда, и именно это подозрительно."
    rule: "Давление даёт быстрый результат. Должки дают правильный."

  - id: new_tenants
    title: Комната 3-В
    when: [knows.room == 1]
    text: "Служебная дверь на третьем. Комната для новых жильцов. Хейл жил здесь месяц. Или одну ночь много раз."
    rule: "Ключ на косяке, если знаешь, куда смотреть. Обыщи как следует."

  - id: freight_lift
    title: Грузовой лифт
    when: [paths.freight_lift == 1]
    text: "Лифт, который не работает, работает. Если Долли этого хочет."
    rule: "Из вестибюля сразу на любой этаж за 1 ход. Нужно доверие Долли 3 — или один раз, если она сама предложила."

  - id: mei
    title: Мэй Тан
    when: [met.mei == 1]
    text: "Фотограф, пятый этаж. Продала цвета и видит город чёрно-белым. Снимает Харроу так, будто его скоро не станет."
    rule: "Её лаборатория открыта для тех, кто ей помог. Или для тех, у кого есть ключ."

  - id: tony
    title: Тони Риццо
    when: [met.tony == 1]
    text: "Боксёр, шестой этаж. Выбивает долги для Владельца. Бьёт мешок так, будто мешок ему должен."
    rule: "Драка с Тони стоит лишний ход и Подозрение, но открывает пожарную лестницу. Сигаретой можно откупиться."

  - id: ruby
    title: Руби Вэнс
    when: [met.ruby == 1]
    text: "Певица, седьмой этаж. Голоса нет, пишет на салфетках. Пела в «Синем фонаре»."
    rule: "Дома только после часа ночи. Из гримёрной пластинку можно взять по-хорошему или украсть."

  - id: auerbach
    title: Доктор Ауэрбах
    when: [met.auerbach == 1]
    text: "Хирург, восьмой этаж. Моет руки дольше, чем нужно. Говорит, что не помнит Вивиан Хейл."
    rule: "Принимает до полуночи. Пешком к нему не успеть — нужен грузовой лифт. После полуночи его процедурная пустует."

  - id: fire_escape
    title: Пожарная лестница
    when: [paths.fire_escape == 1]
    text: "Мокрый чугун с шестого на восьмой, мимо седьмого. Попадают на неё обычно через окно и не по своей воле."
    rule: "С шестого этажа сразу на восьмой за 1 ход. Только вверх. На ней бывает Горман."

  - id: thirteen
    title: Тринадцать
    when: [paths.thirteen == 1]
    text: "На снимке фасада тринадцать рядов окон. В лифте двенадцать кнопок. Я пересчитывал трижды."
    rule: "Где-то в доме есть этаж, на который не ведёт ни одна лестница."

  - id: bennett
    title: Клод Беннет
    when: [met.bennett == 1]
    text: "Диктор WHRW, девятый этаж. Голос, который слышит весь дом, и лицо, которое никто не помнит. Продал своё лицо."
    rule: "Дома только до полуночи. С 00:00 до 02:00 в эфире, в студии. Если договориться, в час ночи даст микрофон — и тебя услышат все, включая Владельца."

  - id: fenn
    title: Ирвинг Фенн
    when: [met.fenn == 1]
    text: "Часовщик, десятый этаж. Считает мои ночи и говорит, что я каждый раз вхожу в 22:01."
    rule: "Помоги ему или поговори — и он отдаст часовой ключ. Ключ открывает решётку на двенадцатый."

  - id: cordelia
    title: Мисс Шоу
    when: [met.cordelia == 1]
    text: "Секретарь Владельца, одиннадцатый этаж. Ничего не хочет и боится этого."
    rule: "Даёт пропуск на двенадцатый. Можно попросить по-хорошему, можно взять самому. Её архив посещений помнит, кто приходил к Владельцу."

  - id: owner
    title: Владелец
    when: [met.owner == 1]
    text: "Человек в шляпе за чёрной стойкой на двенадцатом. Ни разу не обернулся. Не лжёт, но и не отвечает."
    rule: "Здесь дело можно закончить — по-разному, в зависимости от того, что ты знаешь и кем стал. Концовка завершает игру."

  - id: silas
    title: Сайлас
    when: [met.silas == 1]
    text: "Кочегар в подвале. Продал всё своё прошлое одним конвертом. Охраняет огонь."
    rule: "В подвал попадают через бельевой желоб на втором, выходят пешком в вестибюль. У Сайласа есть спички, которыми можно зажечь то, что не горит."

  - id: vault
    title: Тринадцатый
    when: [paths.vault == 1]
    text: "Хранилище конвертов. Полка на мою фамилию, подписанная моей рукой."
    rule: "Туда возит только Долли — когда доверяет тебе полностью. Там лежит всё, что заложено в Белведере."
