# Блокнот Ника — справочник и экран прогресса. Открывается из меню в любой момент.
# Страница: text — голос Ника (как в отчёте), rule — простое объяснение механики.
# when — условие открытия страницы; пишется только по profile-качествам,
# чтобы страница не пропадала на следующую ночь. Без when страница открыта сразу.

life:
  # Страница «Что я о себе знаю» собирается из пар `memories` в world.yaml.
  title: Что я о себе знаю
  intro: "Я записал это в первую ночь, чтобы было с чем сверяться. Теперь сверяюсь каждое утро."
  # Как рисуется каждая строка, в зависимости от состояния пары:
  states:
    fake: "{label_fake}"                        # ложное ещё на месте
    empty: "~~{label_fake}~~ — пусто"           # заложено, настоящее не вернулось
    real: "~~{label_fake}~~ → {label_real}"     # вернулось настоящее, написано другим почерком
  footer: "Почерк в некоторых строках не мой. То есть мой, но другой."

pages:
  - id: case
    title: Дело
    text: "Клиентка — Вивиан Хейл. Муж, Уолтер Хейл, три недели назад ушёл в Белведер-билдинг и не вернулся. Аванс двести. Остальное — когда найду."
    rule: "Каждая ночь начинается в конторе с Вивиан и заканчивается залогом у Долли. Из ночей складывается дело."

  - id: belvedere
    title: Белведер
    text: "Двенадцать этажей у товарной станции. Днём конторы и меблированные комнаты. Ночью на последнем этаже работает ломбард, где закладывают воспоминания."
    rule: "На каждом этаже три двери: дверь жильца, служебная дверь и лестница. Служебные двери ведут коротким путём, но не всегда открыты."

  - id: night
    title: Ночь
    text: "С десяти вечера до шести утра. В шесть приезжает Горман с нарядом, и меня выставляют вниз, к Долли, где бы я ни был."
    rule: "Ночь — 16 ходов. Войти в дверь, подняться на пролёт или задать вопрос — 1 ход. Долгий разговор — 2. Выйти на лестницу и вернуться на площадку ничего не стоит."

  - id: pledge
    title: Залог
    text: "Из Белведера не уходят с пустыми руками. На выходе Долли протягивает пустой конверт, и я кладу туда кусок своей жизни."
    rule: "Уходя, ты отдаёшь одно воспоминание Ника. Если этой ночью ты нашёл то, что с ним связано, на его место встаёт настоящее. Можно заложить саму ночь: биография не тронута, но ночь не попадёт в дело."

  - id: suspicion
    title: Подозрение
    text: "Дом слышит, как я хожу. Чем громче я веду себя, тем быстрее закрываются двери."
    rule: "Растёт от грубых поступков: отобрать, вскрыть, надавить. С 5 жильцы не открывают. На 10 тебя выведут силой."

  - id: cigarettes
    title: Сигареты
    text: "Три штуки в пачке на ночь. Здесь это вместо мелочи."
    rule: "Сигаретой можно угостить, задобрить или откупиться. Каждую ночь их снова три."

  - id: clues
    title: Улики
    text: "Всё, что можно положить на стол. И кое-что, чего лучше бы не находить."
    rule: "Находки ночи. Они не переходят на следующую ночь, но нужны, чтобы при залоге вернуть настоящее воспоминание."

  - id: debts
    title: Должки
    text: "В этом доме услуга за услугу. Кто мне обязан, тот говорит чуть больше."
    rule: "Помоги жильцу, промолчи за него или угости, и он откроет то, что прячет. Должки живут одну ночь."

  - id: report
    title: Отчёт
    text: "Каждое утро я пишу, что видел. Часть этого потом окажется враньём. Пусть, я и вранью веду учёт."
    rule: "После ночи собирается страница отчёта из того, что ты сделал. Из страниц складывается твоё дело Хейла, у каждого игрока оно своё."

  - id: dolly
    title: Долли
    text: "Долорес Финч, лифтёрша. Сидит у лифта, который не ходит. Говорит, что помнит всех, кто входил в эту дверь. Не похоже, что шутит."
    rule: "Её доверие не сгорает между ночами. С доверием 2 она достаёт ключи, с 3 запускает грузовой лифт."

  - id: gorman
    title: Сержант Горман
    text: "Полиция Харроу. Ищет Хейла не за жалованье. Смотрит так, будто ему нечего бояться, и, кажется, так и есть."
    rule: "Встречается на лестнице, когда Подозрение уже высокое. Сигарета его немного успокаивает."

  - id: eddie
    title: Эдди Мэлоун
    when: [visited.floor2.tenant >= 1]
    text: "Пятнадцать лет, курьер пневмопочты, второй этаж. Читает все записки в доме и не стыдится. Хочет уехать туда, где не дождь."
    rule: "Знает, куда идёт почта. Если ему помочь, покажет короткий путь вниз."

  - id: pool
    title: Миссис Пул
    when: [visited.floor3.tenant >= 1]
    text: "Хозяйка меблированных комнат, третий этаж. Накрывает стол на двоих и ждёт сына с флота. Фотография сына стоит лицом к стене."
    rule: "Долгий разговор за столом стоит 2 хода. При повторных визитах рассказывает больше."

  - id: sloan
    title: Огден Слоун
    when: [visited.floor4.tenant >= 1]
    text: "Аудитор, четвёртый этаж. Хочет, чтобы его оставили в покое. Цифры у него сходятся всегда, и именно это подозрительно."
    rule: "Давление даёт быстрый результат. Должки дают правильный."

  - id: new_tenants
    title: Комната для новых жильцов
    when: [visited.floor3.service >= 1]
    text: "За служебной дверью на третьем. Железная кровать, шкаф, моя визитка на тумбочке. Я не помню, как она туда попала."
    rule: "Здесь, говорят, просыпаются новые жильцы. Обыщи как следует."

  - id: freight_lift
    title: Грузовой лифт
    when: [paths.freight_lift == 1]
    text: "Лифт, который не работает, работает. Если Долли этого хочет."
    rule: "Из вестибюля сразу на любой этаж за 1 ход. Нужно доверие Долли 3."
