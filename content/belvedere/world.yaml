rules:
  start: office
  onChoice: [turn += 1]
  # Часы в HUD: 22:00 + ход × 30 минут (ход 4 — полночь, ход 6 — час ночи). Цена хода по-прежнему из onChoice.
  clock: { quality: turn, start: "22:00", step: 30 }
  # Ночь, заложенная целиком, не попадает в итоговое «Дело Хейла» (проверяется по состоянию отчёта).
  pledgedNightWhen: [night_pledged == 1]
  # Вещи Хейла, которые Вивиан кладёт на стол каждую ночь (они же первые карточки в папке улик).
  onNightStart: [has.laundry_tag = 1, has.matchbook = 1, has.note_12 = 1]
  # Слух первой ночи фиксирован; дальше — случайный из rumors.yaml, без повтора две ночи подряд.
  firstNightRumor: pool_pie
  # Сохранения до v2: Вивиан уже приходила, а знаний и зацепок в профиле нет. Условия всех строк
  # проверяются по профилю, с которым началась ночь, потом применяются эффекты подошедших.
  migrations:
    - { when: [nights >= 1, met.vivian == 0], effects: [met.vivian = 1, knows.club = 1, knows.invitation = 1] }
    - { when: [nights >= 1, met.vivian == 0, found.ring == 1], effects: [knows.room = 1] }
    - { when: [nights >= 1, met.vivian == 0, found.pawn_ticket == 1], effects: [knows.shortage = 1, knows.matchbook = 1] }
    - { when: [nights >= 1, met.vivian == 0, found.ledger_true == 1], effects: [knows.shortage = 1, knows.matchbook = 1] }
  # Ночь кончается только выбором на экране залога (endNight).
  # Перехваты проверяются после каждого выбора, срабатывает первый подходящий.
  interrupts:
    - { when: [suspicion >= 10], goto: pledge }
    - { when: [turn >= 16], goto: pledge }
  onNightEnd: [nights += 1]

# Восемь пар из библии: ложная жизнь Ника против настоящей жизни Уолтера.
# Ложное (fake) закладывается у Долли; если returnWhen выполнено этой ночью,
# на его место встаёт настоящее (real). Ключи fake/real, а не false/true:
# по YAML 1.2 `false:`/`true:` — булевы значения, не строки.
# Все восемь пар достижимы: name через негатив у Мэй, secret через конверт на тринадцатом.
memories:
  - id: ring
    fake: mem.false.marines
    real: mem.true.ring
    label_fake: Морская пехота, Тихий океан
    label_real: "Кольцо: свадьба на Канал-стрит"
    returnWhen: [has.ring == 1]
  - id: lantern
    fake: mem.false.mcginnis
    real: mem.true.lantern
    label_fake: Бар «Макгиннис», где меня все знают
    label_real: "«Синий фонарь»: бухгалтерия, Руби на сцене"
    returnWhen: [has.ruby_record == 1]
  - id: ledger
    fake: mem.false.senator_dog
    real: mem.true.ledger
    label_fake: Первое дело — собака сенатора
    label_real: "Цифры: недостача в 4 000"
    returnWhen: [has.ledger_true == 1]
  - id: hospital
    fake: mem.false.lorraine
    real: mem.true.hospital
    label_fake: Лорейн, ушедшая к трубачу
    label_real: "Больничный коридор: ночь операции"
    returnWhen: [has.medical_file == 1]
  - id: voice
    fake: mem.false.father
    real: mem.true.voice
    label_fake: Отец-патрульный, погибший на посту
    label_real: Голос Вивиан, зовущий по имени
    # По библии ещё «или запись эфира Беннета» — нужен OR, пока только Руби.
    returnWhen: [debt.ruby >= 2]
  - id: cashbox
    fake: mem.false.sheriff
    real: mem.true.cashbox
    label_fake: Пёс по кличке Шериф
    label_real: "Касса клуба: ночь, когда я взял деньги"
    returnWhen: [has.pawn_ticket == 1, seen.sloan_cashbox == 1]
  - id: name
    fake: mem.false.license
    real: mem.true.name
    label_fake: Лицензия частного детектива № 2214
    label_real: Имя
    returnWhen: [has.signature_photo == 1, memories_returned >= 4]
  - id: secret
    fake: mem.false.scar
    real: mem.true.secret
    label_fake: Шрам от ножа в Бруклине
    label_real: "Тайное: что заложила Вивиан"
    returnWhen: [seen.vault13 == 1, mem.true.name == 1]

report:
  slots:
    - { id: client, label: Клиентка }
    - { id: entry, label: Вход }
    - { id: witnesses, label: Свидетели }
    - { id: finding, label: Находка }
    - { id: twist, label: Поворот }
    - { id: price, label: Цена }
  # Строки прогресса под отчётом. {vouches} — качество; {leads_done} и {leads_total} считает движок
  # по notebook.yaml → leads (total — появившиеся зацепки, done — закрытые из них).
  progress:
    - { when: [], text: "Зацепок закрыто: {leads_done} из {leads_total}." }
    - { when: [knows.invitation == 1], text: "Поручились: {vouches} из 3." }
  # Пояснение над страницей отчёта; показываются все подходящие строки.
  notes:
    - when: [seen.client_first == 1]
      text: "Это отчёт Ника за ночь. Из таких страниц сложится дело Хейла, и у каждого игрока оно своё."
    - when: [night_pledged == 1]
      text: "Эта ночь заложена: в итоговое дело она не попадёт."

# Строка-итог под заголовком «Утро»; условия проверяются по состоянию отчёта, пока run-флаги стоят.
morning:
  notes:
    - when: [night_pledged == 1]
      text: "Вчерашней ночи нет. Список тот же. Почему-то от этого не легче."
    - when: [night_pledged == 0, returned_tonight == 0]
      text: "Одна строка зачёркнута. На её месте пусто, и пустота ноет, как зуб."
    - when: [returned_tonight == 1]
      text: "Одна строка переписана. Ты не помнишь, когда успел."

# Кто говорит в ленте реплик. narrator — без подписи, приглушённо; gut — внутренний голос Ника (курсив).
speakers:
  narrator: { label: "", style: narrator }
  gut: { label: ЧУТЬЁ, style: inner }
  nick: { label: НИК, color: "#c9b37e" }
  vivian: { label: ВИВИАН, color: "#b48fb0" }
  dolly: { label: ДОЛЛИ, color: "#d9925f" }
  eddie: { label: ЭДДИ, color: "#7fb0c9" }
  pool: { label: МИССИС ПУЛ, color: "#c9a77f" }
  sloan: { label: СЛОУН, color: "#8fbf8f" }
  gorman: { label: ГОРМАН, color: "#c96f6f" }
  tony: { label: ТОНИ, color: "#b0a07f" }

# Лестница — один экран (сторилет с layout: stairs задаёт только текст). Кнопки этажей рисует движок.
stairs:
  location: stairwell
  # Качество «на каком я этаже»: его ставят двери площадок и переход по лестнице.
  quality: floor
  floors:
    1: floor_01
    2: floor_02
    3: floor_03
    4: floor_04
    5: floor_05
    6: floor_06
    7: floor_07
    8: floor_08
    9: floor_09
    10: floor_10
    11: floor_11
    12: floor_12
  # Цена = ceil(|куда − откуда| / 2) ходов, не меньше 1, плюс модификаторы. Заменяет обычный ход за выбор.
  cost: half
  costMods:
    - { when: [rumor.lights == 1], add: 1 }
  # Закрытый этаж виден серой кнопкой с подписью. Открывает любая группа условий из open_any.
  locks:
    - floor: 12
      open_any: [[has.cordelia_pass == 1], [has.clock_key == 1]]
      text: "Решётка: «Только по приглашению»"
  # Встречи по пути: сторилеты этой локации; floors: [от, до] должен пересечься с путём
  # (этажи после текущего до целевого включительно). Выбор без goto продолжает путь на целевой этаж.
  events: stairs_event
  # Эффекты каждого перехода по лестнице.
  onTravel: [seen.went_up = 1]
