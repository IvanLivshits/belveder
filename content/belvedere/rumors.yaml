# Слух дня. Долли говорит его при входе. Движок выбирает один в начале ночи:
#   ночь 0 — rules.firstNightRumor;
#   дальше — случайный (seed ночи) из тех, у кого выполнено when, кроме слуха прошлой ночи.
# Выбранный слух ставит run-качество rumor.<id> = 1. Что он меняет — в сторилетах.
rumors:
  - id: pool_pie
    when: []
    text: "Миссис Пул с третьего опять печёт пирог. Весь дом пахнет корицей."
  - id: sloan_lamp
    when: [met.sloan == 1]
    text: "У Слоуна на четвёртом перегорела лампа. Ушёл за новой, а архив оставил открытым."
  - id: gorman_inside
    when: [met.gorman == 1]
    text: "Горман сегодня не в машине. Он внутри, на лестнице. Ходи тихо."
  - id: eddie_blue
    when: [met.eddie == 1]
    text: "Эдди сегодня не в духе. Сидит в прачечной и никуда не бегает."
  - id: lights
    when: []
    text: "Опять мигает свет. На лестнице темно, ноги переломаешь. Зато никто ничего не видит."
