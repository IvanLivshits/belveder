# Папка с уликами. Открывается из меню рядом с блокнотом.
# Каждая запись — «карточка улики»: картинка (если есть), название, заметка Ника.
#
# flag    — run-качество, которое означает «улика найдена этой ночью».
# Движок, когда flag впервые становится 1, ставит profile-качество found.<id> = 1,
# поэтому папка помнит все находки за всю игру, а не только за эту ночь.
# Найденное этой ночью помечается в списке («сегодня»), остальное — «в деле».
# image   — id из assets.json, необязательно.
# order   — порядок в папке (по нему, а не по времени находки).

items:
  - id: owner_note
    order: 10
    flag: has.owner_note
    image: ev_owner_note
    title: Записка Владельца
    text: |
      Листок из цилиндра пневмопочты, почерк ровный, как по линейке: «Детектив поднимется. Не мешать. Ему нужно дойти самому. — В.»

      Обо мне здесь пишут в третьем лице. И, похоже, давно.

  - id: mailbox_note
    order: 15
    flag: seen.mailbox_paid
    image: ev_owner_note
    title: Записка из ящика 3-В
    text: |
      «Аренда комнаты 3-В оплачена до конца дела. — В.»

      Тот же почерк, что в записке из цилиндра. Какого дела — не сказано.

  - id: ring
    order: 20
    flag: has.ring
    image: ev_ring
    title: Обручальное кольцо
    text: |
      Тонкое золото, внутри гравировка: «В. и У. Навсегда». Лежало в коробке с забытыми вещами в комнате для новых жильцов, среди очков, часов без стрелок и фотографий с вырезанными лицами.

      Вивиан и Уолтер. Хейл был здесь и ушёл без кольца.

  - id: tenant_register
    order: 30
    flag: has.tenant_register
    title: Книга жильцов
    text: |
      Клеёнчатая книга миссис Пул. «Кэллоуэй Н., комната 3-В, с 15 марта». Прежний адрес — прочерк. Прежнее имя — прочерк.

      Почерк миссис Пул. Прочерки — чьи-то ещё.

  - id: contract
    order: 35
    flag: has.contract
    title: Договор найма на 3-В
    text: |
      Бессрочный. Арендатор: Н. Кэллоуэй. Подпись внизу — моя, один в один с гонорарной распиской.

      Я не помню, чтобы что-то подписывал в этом доме.

  - id: ledger_fake
    order: 40
    flag: has.ledger_fake
    image: ev_ledgers
    title: Копия книги «Синего фонаря» (чистая)
    text: |
      Март сходится до цента. Недостачи нет. Слоун отдал её без спора и слишком быстро.

      Цифры у таких людей всегда сходятся.

  - id: ledger_true
    order: 45
    flag: has.ledger_true
    image: ev_ledgers
    title: Копия книги «Синего фонаря» (с бечёвкой)
    text: |
      Март, сорок первая строка: «Недостача 4 000. Погашена наличными в ночь на 15-е».

      Первое честное, что я увидел в этом доме. Цифры наконец не сходятся.

  - id: pawn_ticket
    order: 50
    flag: has.pawn_ticket
    image: ev_pawn_ticket
    title: Квитанция ломбарда
    text: |
      Лежала в кассе клуба утром пятнадцатого марта, поверх вернувшихся четырёх тысяч. «Предмет залога: имя». Подпись смазана дождём.

      Кто-то заплатил долг Хейла. Чем — написано прямо здесь.

  - id: archive_key
    order: 60
    flag: has.archive_key
    title: Ключ «4 — архив»
    text: |
      Ключ с бумажной биркой, снят Долли с гвоздя за стойкой. Слоун поменял замок и думает, что второго ключа нет.

      У Долли есть второй ключ от всего.

  - id: darkroom_key
    order: 65
    flag: has.darkroom_key
    image: ev_darkroom_key
    title: Ключ от фотолаборатории
    text: |
      Ключ с красной биркой. Мэй забывает его в карманах, Эдди находит при стирке.

      В этом доме все ключи рано или поздно оказываются в прачечной.

  - id: facade_photo
    order: 70
    flag: has.facade_photo
    image: ev_facade_photo
    title: Снимок фасада
    text: |
      Отпечаток из лаборатории Мэй Тан: Белведер под дождём, снятый с крыши депо. Двенадцать рядов светлых окон и над ними ещё один, тёмный.

      Тринадцать. В лифте двенадцать кнопок.

  - id: ruby_record
    order: 80
    flag: has.ruby_record
    image: ev_ruby_record
    title: Пластинка Руби Вэнс
    text: |
      «Руби Вэнс. Синий фонарь, 1941». На конверте карандашом: «Для У., третий столик слева».

      Голос на ней живой. У хозяйки голоса нет.

  - id: medical_file
    order: 90
    flag: has.medical_file
    image: ev_medical_file
    title: Медкарта Вивиан Хейл
    text: |
      «Хейл, Вивиан, 33 г. Перелом таза, внутреннее кровотечение. Операция: 4 000, оплачено наличными. Плательщик: У. Хейл».

      Те же четыре тысячи. Тот же март. Хейл не сбежал с деньгами. Он с ними пришёл в больницу.

  - id: visitor_log
    order: 92
    flag: has.visitor_log
    title: Журнал посещений, 15 марта
    text: |
      Страница вклеена обратно, криво, свежим клеем. «Миссис В. Хейл — к Владельцу, 23:40». «Миссис В. Хейл — к Владельцу. Повторно, 02:10».

      Дважды за одну ночь. Клиентка об этом не говорила.

  - id: clock_key
    order: 94
    flag: has.clock_key
    image: ev_clock_key
    title: Часовой ключ Фенна
    text: |
      Латунный ключ на красной ленте. Открывает всё, что заводится. Решётка на одиннадцатом заводится.

  - id: cordelia_pass
    order: 95
    flag: has.cordelia_pass
    image: ev_cordelia_pass
    title: Пропуск на двенадцатый
    text: |
      Картон, печать, ни имени, ни даты. Пропускают не человека, а его решение подняться.

  - id: signature_photo
    order: 96
    flag: has.signature_photo
    title: Негатив без подписи
    text: |
      Вестибюль Белведера ночью. Стойка Долли. Женщина в мокром пальто подписывает книгу, трость прислонена к стойке. Лица не видно, видно кольцо. Часы над лифтом: без двадцати двенадцать.

  - id: matches
    order: 97
    flag: has.matches
    image: ev_silas_matches
    title: Спички Сайласа
    text: |
      Обычный коробок, только тяжелее. «Ими можно зажечь то, что не горит. Бумагу, которая всё помнит».

  - id: book_41
    order: 98
    flag: seen.book_41
    title: Книга залогов, строка 41
    text: |
      «№ 41. 15 марта. Предмет залога: имя „Уолтер Хейл“». Строка залогодателя залита чернилами, под кляксой женский почерк.

  - id: vivian_envelope
    order: 99
    flag: has.vivian_envelope
    image: env_sealed
    title: Конверт Вивиан Хейл
    text: |
      С тринадцатого. «Залогодатель: Вивиан Хейл. Предмет: память о залоге № 41». Тёплый, будто его только что держали в руках.
