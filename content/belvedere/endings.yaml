# Концовки и итоговый рассказ «Дело Хейла».
#
# Выбор с полем `ending: <id>` завершает игру: показывается outcome выбора,
# затем экран концовки (image + title + text), затем «Дело Хейла» (см. story).
# Движок ставит profile-качество endings.<id> = 1. После концовки — «Новое дело»:
# профиль сбрасывается, кроме endings.* (эпилоги следующих концовок могут на них смотреть).
#
# Текст концовки — голос отчёта (первое лицо, прошедшее время).
# epilogues — короткие абзацы «что стало потом», показываются все подходящие по when.

endings:
  - id: case_closed
    title: Дело закрыто
    image: ending_case_closed
    text: |
      Я спустился с двенадцатого с конвертом во внутреннем кармане. Долли не взяла с меня залога. Сказала, что хватит.

      Утром я отдал вдове отчёт и конверт. Она вскрыла его при мне. На ладонь выпало обручальное кольцо, тонкое, с гравировкой. Она держала его и не плакала, только руки дрожали так, что кольцо звенело о ноготь.

      Я взял остаток гонорара и ушёл под дождь. Дело Уолтера Хейла было закрыто: умер, тело не найдено, имущество отсутствует.

      Я так и не понял, почему у неё дрожали руки. Я много чего так и не понял. Это, наверное, и называется закрытым делом.
    epilogues:
      - when: []
        text: "Вивиан Хейл носила два кольца на одной цепочке. Одно своё, другое ничьё."
      - when: [memories_returned >= 3]
        text: "Я написал в отчёте «не понял». Это была неправда. Я понял на третьей ночи, в коробке с забытыми вещами. Закрыть дело оказалось проще, чем открыть себя."
      - when: [endings.redemption == 1]
        text: "Иногда на Канал-стрит Вивиан оборачивалась на мужчин в шляпах с узкими полями. Ни один не оборачивался в ответ."

  - id: redemption
    title: Выкуп
    image: ending_redemption
    text: |
      Цена была втрое, и не деньгами. Владелец взял всё, что я узнал в Белведере: каждую ночь, каждую лестницу, каждое лицо. Долли. Эдди. Миссис Пул с её второй тарелкой. Руби и её салфетки.

      Взамен он вычеркнул сорок первую строку.

      Я проснулся на кухне, которую узнал по трещине на потолке. Пахло кофе: две ложки сахара, без молока. Женщина у плиты обернулась и сказала: «Уолтер, остынет».

      Я не помнил ни этой ночи, ни расследования, ни детектива по фамилии Кэллоуэй. Вивиан помнила всё. И молчала. Этот отчёт я, выходит, не писал. Его написал кто-то, кого больше нет.
    epilogues:
      - when: []
        text: "Уолтер Хейл устроился счетоводом в зерновую контору на другом конце города. В «Синий фонарь» он больше не заходил. Он не знал, почему не хочет."
      - when: [endings.case_closed == 1]
        text: "В ящике кухонного стола Вивиан хранила отчёт частного детектива о смерти её мужа. Иногда перечитывала. Детектив писал хорошо."

  - id: new_proprietor
    title: Новый Владелец
    image: ending_new_proprietor
    text: |
      Кресло было тёплым, как будто его только что оставили. Прежний Владелец снял шляпу, и под шляпой никого не оказалось. Шляпа осталась на стойке. Я надел её, не думая. Она пришлась впору, как всё в этом доме.

      Мисс Шоу принесла чай и спросила, будут ли распоряжения. Я сказал, что подумаю. Это была первая ложь новой должности, и книга её записала.

      Внизу Долли закончила вязать то бесконечно серое. Говорят, это был шарф. Говорят, длиной ровно в двенадцать этажей.

      Мою контору на Портовой сдали через месяц. Табличку с именем сняли. Имя было чужое, но мне всё равно было жаль.
    epilogues:
      - when: []
        text: "В «Харроу Курьер» вышло объявление: «Ищу пропавшего частного детектива. Высокий, шляпа с узкими полями. Звать — Кэллоуэй. Плачу сколько скажете». Объявление дал Владелец."
      - when: [endings.ashes == 1]
        text: "Новый Владелец распорядился держать в подвале ведро с песком. Сайлас решил, что это шутка, и впервые за годы засмеялся."

  - id: ashes
    title: Пепел
    image: ending_ashes
    text: |
      Тринадцатый горел медленно, как горят письма. Конверты раскрывались сами, и из каждого выходило то, что в нём держали.

      Руби запела в первый раз за шесть лет, и её услышал весь дом без всякого радио. Миссис Пул плакала над сыном, которого наконец похоронила. Эдди вспомнил лицо отца и долго сидел на лестнице. Горман впервые за годы испугался, и поэтому выжил.

      Моё имя вернулось ко мне последним, из маленького конверта на самой верхней полке. Уолтер Хейл. Я вышел с ним на улицу, а за спиной сгорал единственный дом, где это имя что-то значило.

      Наутро над Харроу не было дождя. Впервые за одиннадцать лет. Люди выходили на улицы и смотрели вверх, как на чудо. Я тоже смотрел. Я не знал, куда идти.
    epilogues:
      - when: []
        text: "Долли устроилась кассиршей в кинотеатр на Портовой. Она забывает лица зрителей через минуту после сеанса и, говорят, очень этим довольна."
      - when: [endings.redemption == 1]
        text: "Однажды на Канал-стрит Вивиан узнала мужа в толпе. Он её — нет. Она пошла следом, держась на расстоянии, как умеют ходить жёны детективов."

  - id: signature_forgive
    title: Подпись. Прощение
    image: ending_signature
    text: |
      Я ничего ей не сказал. Взял её руку, ту, что подписывала книгу в ту ночь, и подержал. Рука была холодная. У стойки всегда холодно.

      — Я нашёл его, — сказал я. — Он жив. Он не придёт, но он жив, и он на вас не сердится.

      Вивиан кивнула, как кивают на хорошие новости, которым не верят. Долли отвернулась к лифту.

      Есть вещи, которые человек отдал, чтобы спасти другого. Возвращать их — значит заставлять платить второй раз. Я не стал.
    epilogues:
      - when: []
        text: "Вивиан Хейл каждую субботу оставляла у Долли кофе для детектива: две ложки сахара, без молока. Детектив каждую субботу его выпивал. Они почти не разговаривали."

  - id: signature_truth
    title: Подпись. Правда
    image: ending_signature
    text: |
      Я положил перед ней снимок Мэй Тан. Окно двенадцатого этажа, чёрная стойка, женщина в мокром пальто, трость, кольцо.

      — Это вы, — сказал я. — Пятнадцатого марта, без двадцати двенадцать. Вы заложили имя мужа, чтобы его не посадили. Потом заложили память об этом, потому что не смогли с ней жить.

      Она смотрела на снимок долго. Потом сказала: «Уолтер». Не вопросом.

      Правда не вернула ей ни ночь, ни меня. Но мы оба теперь знали, за что платим. Говорят, с этого начинают браки. Наш начался заново на табурете у мёртвого лифта.
    epilogues:
      - when: []
        text: "Они уехали из Харроу на ночном поезде. Долли проводила их до двери и впервые за сорок лет вышла из Белведера на улицу. Постояла под дождём и вернулась."

  - id: signature_letter
    title: Подпись. Письмо
    image: ending_signature
    text: |
      Я написал письмо за стойкой у Долли, пока Вивиан ждала на табурете. Написал всё: про снимок, про книгу, про сорок первую строку и про то, что не сержусь.

      Отдал письмо Долли и сказал: «Отдай, когда она будет готова». Долли спросила, как она поймёт. Я сказал, что она поймёт.

      Потом я вышел из Белведера, не оставив залога. Долли не остановила. Впервые кто-то вышел отсюда целым, и она этого очень хотела.

      Я не знаю, прочла ли Вивиан письмо. Я уехал из Харроу. Там, куда я уехал, есть солнце, и я до сих пор к нему не привык.
    epilogues:
      - when: []
        text: "Письмо пролежало у Долли под вязанием одиннадцать дней. На двенадцатый Вивиан спросила: «Он мне ничего не оставлял?»"

# Итоговый рассказ «Дело Хейла», собирается после концовки.
story:
  title: Дело Хейла
  # Порядок частей. Движок берёт сохранённые страницы ночей (кроме заложенных),
  # в том порядке, в каком игрок их прожил.
  parts:
    - opening       # «Клиентка» самой первой ночи
    - nights        # страницы отчётов всех ночей (без заложенных); у каждой подпись «Ночь N»
    - pledged_note  # если были заложенные ночи
    - litany        # «Цена» за всё время: тексты price_* всех заложенных воспоминаний, одним абзацем
    - ending        # текст концовки
    - epilogues     # подходящие эпилоги
  pledged_note: "Об одной или нескольких ночах я ничего не помню. Я сам так решил. Их нет в этом деле, и это тоже часть дела."
  litany_intro: "Вот что я отдал за это дело, по порядку:"
  closing: "Дело закрыто. Или нет. В Белведере это одно и то же."
