- id: witnesses_silas_fire
  slot: witnesses
  priority: 3
  when: [seen.silas_fire == 1]
  text: "Кочегар Сайлас сказал, что держит огонь «с той ночи» и что огню некуда будет вернуться, если он погаснет. Кочегары все немного заговариваются. Я записываю за всеми."
- id: finding_book_one
  slot: finding
  priority: 10
  when: [seen.book_one == 1]
  text: "На первой странице книги залогов одна строка: «№ 1. Предмет залога: завтрашний день Белведера. Залогодатель: Владелец». Одиннадцать лет дождя. Часы на 05:59. Я перестал называть это совпадениями."
- id: witnesses_auerbach_judged
  slot: witnesses
