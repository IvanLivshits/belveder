  slot: witnesses
  priority: 4
  when: [seen.fenn_log_start == 1]
  text: "В журнале часовщика месяц строк «Хейл, 3-В», а с пятнадцатого марта — «Кэллоуэй». Вошёл в 22:01, ушёл до рассвета. Почерк в журнале один. Это почерк Фенна."
- id: witnesses_overheard
  slot: witnesses
  priority: 4
  when: [seen.archive_overheard == 1]
  text: "Через стену архива я слышал, как мисс Шоу спросила Владельца, позволит ли он мне подняться. «Я никому ничего не позволяю. Я только записываю». Мне стало неуютно: я ведь тоже записываю."
- id: finding_clipping
