# ── v15: верхние этажи — поручительства, следы Хейла, слои лора ─────────────
- id: twist_mei_box
  slot: twist
  priority: 3
  when: [seen.mei_saved == 1]
  text: "Я спустил коробку негативов Мэй в мёртвую шахту лифта, пока Горман до них не добрался. Внизу её приняла Долли и ничего не спросила. Мэй сказала, что я умею держать чужое. Мне бы кто-нибудь подержал моё."
