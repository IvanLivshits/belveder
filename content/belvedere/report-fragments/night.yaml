# Отчёт за ночь. Голос Ника: первое лицо, прошедшее время, усталый и циничный.
# Для каждого слота есть фолбэк с priority -100. Побеждает наибольший priority.
# Условия опираются на run-флаги (seen.*, has.*, pledged.*, returned.*),
# чтобы фрагмент описывал именно эту ночь, а не весь профиль.

# ── Клиентка ─────────────────────────────────────────────────────────────────
- { id: client_default, slot: client, priority: -100, text: "Клиентка пришла в половине десятого: трость, хромота, муж по имени Уолтер Хейл. Я взял деньги. Я всегда беру деньги." }
- id: client_first
  slot: client
  priority: 2
  when: [seen.client_first == 1]
  text: "Она вошла в контору в половине десятого, с тростью и хромотой, которую не пыталась скрыть. Сказала, что муж ушёл в Белведер три недели назад. Я назвал цену. Она не торговалась. Женщины, которые не торгуются, обычно уже потеряли больше, чем могут себе позволить."
- id: client_cashbox
  slot: client
  priority: 5
  when: [seen.client_cashbox == 1]
  text: "Она показала мне счёт из больницы: операция, оплачено полностью, четыре тысячи. Я знал сумму раньше, чем увидел. Я записал это и долго смотрел на запись."
- id: client_lantern
  slot: client
  priority: 6
  when: [seen.client_lantern == 1]
  text: "Я насвистывал при ней песню из «Синего фонаря». Она спросила, откуда я её знаю. Я не знал. Я знал только, что за третьим столиком слева её слушали стоя."
- id: client_hospital
  slot: client
  priority: 7
  when: [seen.client_hospital == 1]
  text: "Я смотрел, как она садится, и знал, где у неё шов. Детективу такое знать не положено. Мужу — положено."
- id: client_voice
  slot: client
  priority: 8
  when: [seen.client_voice == 1]
  text: "Она позвала меня по фамилии, и я не обернулся. Мне послышалось другое имя. Я записываю это, потому что утром решу, что мне показалось."
- id: client_name
  slot: client
  priority: 9
  when: [seen.client_name == 1]
  text: "Я назвал её Ви. Так её никто не называет, кроме одного человека. Она уронила трость, и я поднял её раньше, чем она успела нагнуться. Как будто делал это тысячу раз."
- id: client_secret
  slot: client
  priority: 10
  when: [seen.client_secret == 1]
  text: "Я налил ей кофе и не смог поднять глаза. Теперь я знаю, что она сделала. Она не знает. Самое страшное в этом деле — что мы оба правы."
- id: client_return
  slot: client
  when: [seen.client_return == 1]
  text: "Она опять пришла в половине десятого. Мне показалось, что я знаю, что она скажет. Я дал ей договорить. Это вежливо, и это дешевле, чем признаться, что сходишь с ума."
- id: client_lie
  slot: client
  priority: 1
  when: [seen.vivian_lie == 1]
  text: "Она сказала: «Уолтер никогда не брал чужого». Так говорят о тех, кто брал. Я записал это не как факт, а как улику против неё самой."
- id: client_coffee
  slot: client
  priority: 3
  when: [seen.client_coffee == 1]
  text: "Я налил ей кофе, две ложки сахара, без молока, раньше, чем она попросила. Она посмотрела на чашку так, будто я её ударил. Я сделал вид, что не заметил. Мы оба делали вид уже очень долго."
- id: client_ring
  slot: client
  priority: 4
  when: [seen.client_ring == 1]
  text: "У неё на пальце было тонкое кольцо, такое же, как в коробке на третьем. Я спросил про часовню на Канал-стрит раньше, чем понял, откуда о ней знаю."

# ── Вход ─────────────────────────────────────────────────────────────────────
- { id: entry_default, slot: entry, priority: -100, text: "Вошёл через парадную. Долли сделала вид, что не заметила." }
- id: entry_silent
  slot: entry
  when: [seen.lobby_silent == 1]
  text: "Я прошёл мимо Долли молча. Она запомнила. Она всё запоминает, это её ремесло."
- id: entry_hint
  slot: entry
  when: [seen.dolly_invite == 1]
  text: "Лифтёрша по имени Долли сказала, что на двенадцатый ходят только по приглашению. Хейла пригласили. За меня должны поручиться трое жильцов. Я детектив, а не жилец, но правила в этом доме пишу не я."
- id: entry_kept
  slot: entry
  priority: 3
  when: [seen.dolly_kept == 1, seen.lift_used == 1]
  text: "Я вернулся к Долли до часу ночи, как она просила. Она прокатила меня на лифте, который не ходит. Доверие тут считают не словами, а минутами."
- id: entry_waited
  slot: entry
  priority: 3
  when: [seen.dolly_waited == 1]
  text: "Долли ждала меня до часу. Я в это время ел пирог на третьем. Она спросила, вкусный ли. Я сказал правду. Она, кажется, этого и боялась."
- id: entry_cig
  slot: entry
  when: [seen.dolly_cig == 1]
  text: "Я угостил Долли сигаретой. Она не закурила, а спрятала её в фартук. Так берут задаток, а не подарок."
- id: entry_hale
  slot: entry
  priority: 1
  when: [seen.dolly_hale == 1]
  text: "Долли сказала, что Хейл спрашивал, сколько дают за имя. Странный вопрос для человека, у которого оно есть."
- id: entry_tea
  slot: entry
  priority: 2
  when: [seen.dolly_tea == 1]
  text: "Долли налила мне чаю во вторую чашку. Чашка стояла там до того, как я вошёл. Я не стал спрашивать, сколько ночей она её ставит."
- id: entry_knows
  slot: entry
  priority: 2
  when: [seen.dolly_knows == 1]
  text: "Долли сказала, что продала способность забывать. Хорошая сделка, сказала она. Я не поверил ни одному слову, кроме этого."
- id: entry_lift
  slot: entry
  priority: 3
  when: [seen.lift_used == 1]
  text: "Долли повезла меня грузовым лифтом. Лифт, который не работает с тех пор, как город перестал верить в лифты, работал. Значит, кто-то в этом городе ещё верит. Хотя бы в меня."
- id: entry_late
  slot: entry
  priority: 4
  when: [seen.dolly_late == 1]
  text: "Долли сказала, что считает меня, как Фенн считает часы. Ночей за мной {nights}. Я записал число, чтобы проверить, помню ли его утром."

# ── Свидетели ────────────────────────────────────────────────────────────────
- { id: witnesses_default, slot: witnesses, priority: -100, text: "Свидетелей нет. В этом доме их никогда нет." }
- id: witnesses_eddie
  slot: witnesses
  when: [seen.eddie == 1]
  text: "Мальчишка-курьер пневмопочты, лет пятнадцати, с карандашом за ухом. Читает чужие записки и не стыдится. Мальчишки в его возрасте всё замечают и ничего не боятся. Это пройдёт, если он здесь останется."
- id: witnesses_eddie_hale
  slot: witnesses
  priority: 1
  when: [seen.eddie_hale == 1]
  text: "Эдди, курьер со второго, сказал, что у Хейла было пальто, как у меня. Точь-в-точь. Мальчишки замечают пальто, а я предпочёл не заметить, как он на меня смотрел."
- id: witnesses_gorman
  slot: witnesses
  priority: 1
  when: [seen.gorman == 1]
  text: "На лестнице меня ждал сержант Горман. Он не боялся ни меня, ни дома, ни того, что его в нём ждёт. Люди без страха опаснее вооружённых."
- id: witnesses_pool
  slot: witnesses
  priority: 2
  when: [seen.pool == 1]
  text: "Миссис Пул накрыла стол на двоих и ждала сына с флота. Фотография сына стояла лицом к стене. Я не стал её переворачивать. Есть вещи, которые не входят в гонорар."
- id: witnesses_sloan
  slot: witnesses
  priority: 3
  when: [seen.sloan_met == 1]
  text: "Слоун ждал меня на четвёртом, хотя не должен был. Бухгалтеры не ждут детективов, если им нечего скрывать. Он выравнивал стопки бумаг всё время, пока я говорил."

- id: witnesses_mei
  slot: witnesses
  priority: 1
  when: [met.mei == 1, visited.floor5.tenant >= 1, seen.mei_hale == 1]
  text: "Мэй Тан, фотограф с пятого. Продала цвета и снимает город так, будто его скоро не станет. Показала три снимка лестницы: один и тот же мужчина в шляпе, три разных дня. Хейл здесь не ночевал. Он здесь жил."
- id: witnesses_tony
  slot: witnesses
  priority: 2
  when: [seen.tony_hale == 1]
  text: "Тони Риццо, боксёр с шестого. Сказал, что Хейл лежит на дне в порту и что он сам видел. Люди, которые сами видели, не говорят так громко."
- id: witnesses_ruby
  slot: witnesses
  priority: 4
  when: [seen.ruby_intro == 1]
  text: "Руби Вэнс, певица с седьмого. Голоса у неё нет, есть салфетки и карандаш. Она написала, что я пахну, как он. Я не спросил, как кто. Я испугался ответа."
- id: witnesses_ruby_who
  slot: witnesses
  priority: 5
  when: [seen.ruby_who == 1]
  text: "Руби Вэнс, певица с седьмого, пишет на салфетках. Написала, что я пахну, как он. Я спросил, как кто. «Как человек, который считал чужие деньги». Я сжёг салфетку в пепельнице. Почему-то."
- id: witnesses_ruby_walter
  slot: witnesses
  priority: 6
  when: [seen.ruby_said_remember == 1]
  text: "Руби написала одно слово и подчеркнула дважды. «Уолтер». Я сказал, что помню. Я соврал. Или нет."
- id: witnesses_auerbach
  slot: witnesses
  priority: 5
  when: [seen.auerbach_vivian == 1]
  text: "Доктор Ауэрбах, восьмой этаж, приём до полуночи. Моет руки так, как моют то, что не отмывается. Сказал, что не помнит Вивиан Хейл, и посмотрел на шкаф с карточками."
- id: witnesses_auerbach_shock
  slot: witnesses
  priority: 7
  when: [seen.auerbach_shocked == 1]
  text: "Доктор Ауэрбах увидел меня и побелел. Сказал, что я всю ночь операции простоял в коридоре и не садился. Я не помню коридора. Мои ноги, кажется, помнят."
- id: witnesses_bennett
  slot: witnesses
  priority: 2
  when: [met.bennett == 1, seen.bennett_who == 1]
  text: "Клод Беннет, диктор WHRW. Голос, который слушает весь дом, и лицо, которое никто не помнит. Сказал, что Владелец не спит, пока идёт эфир."
- id: witnesses_fenn
  slot: witnesses
  priority: 3
  when: [seen.fenn_minute == 1]
  text: "Ирвинг Фенн, часовщик с десятого. Сказал, что я каждый раз вхожу в этот дом в двадцать две ноль одна. Часы врут, сказал он. Я — нет."
- id: witnesses_cordelia
  slot: witnesses
  priority: 3
  when: [seen.cordelia_cig == 1]
  text: "Мисс Шоу, секретарь Владельца. Продала свои желания и теперь боится, что ничего не хочет. Я предложил ей сигарету. Она её захотела. Это было похоже на маленькое воскрешение."
- id: witnesses_owner
  slot: witnesses
  priority: 8
  when: [seen.owner_hale == 1]
  text: "Владелец не обернулся ни разу. Сказал, что Хейла нет, есть имя в книге. Сказал, что не лжёт, просто не отвечает на вопросы. Я ему поверил. Это было хуже всего."
- id: witnesses_silas
  slot: witnesses
  priority: 2
  when: [seen.silas_cig == 1]
  text: "Сайлас, кочегар в подвале. Продал своё прошлое одним конвертом и мёрзнет у самой топки. Сказал, что сверху приносят только спички, а настоящий огонь — здесь."
- id: witnesses_pool_walter
  slot: witnesses
  priority: 9
  when: [seen.pool_confess == 1]
  text: "Миссис Пул сказала, что в то утро я сам назвался Кэллоуэем. Прочитал фамилию на визитке у себя на тумбочке. Она не подсказывала. Я выбрал себе жизнь за одну секунду, спросонья."
# ── Находка ──────────────────────────────────────────────────────────────────
- { id: finding_default, slot: finding, priority: -100, text: "Ничего, что можно положить на стол." }
- id: finding_note
  slot: finding
  when: [has.owner_note == 1]
  text: "Записка Владельца из цилиндра пневмопочты: «Детектив поднимется. Не мешать. Ему нужно дойти самому». Обо мне здесь пишут в третьем лице. Мне это не понравилось."
- id: finding_fake_ledger
  slot: finding
  priority: 1
  # Не показывать, если Слоун уже рассказал про пропажу: Ник знает, что недостача была.
  when: [has.ledger_fake == 1, has.ledger_true == 0, seen.sloan_cashbox == 0]
  text: "Копия книги «Синего фонаря». Март сходится до цента. Я записал: растраты не было. Значит, Хейл ушёл не от долга, а к чему-то."
- id: finding_ring
  slot: finding
  priority: 2
  when: [has.ring == 1]
  text: "Обручальное кольцо в коробке с забытыми вещами, в комнате для новых жильцов. «В. и У. Навсегда». Вивиан и Уолтер. Хейл ночевал здесь и ушёл без кольца. Мужья не забывают кольца. Их снимают, когда не хотят, чтобы узнали."
- id: finding_ticket
  slot: finding
  priority: 3
  when: [has.pawn_ticket == 1]
  text: "Квитанция ломбарда из кассы клуба. «Предмет залога: имя». Подпись смазана. Слоун сказал, что пропавшие четыре тысячи вернулись в кассу утром шестнадцатого марта, вместе с этой бумажкой. Хейл заплатил долг собой."
- id: finding_true_ledger
  slot: finding
  priority: 4
  when: [has.ledger_true == 1]
  text: "Вторая копия книги, перевязанная бечёвкой. Март, сорок первая строка: недостача четыре тысячи, погашена наличными в ночь на шестнадцатое. Цифры, наконец, не сходились. Это было первое честное, что я увидел в этом доме."
- id: finding_compare
  slot: finding
  priority: 5
  when: [seen.ledger_compare == 1]
  text: "Две копии одной книги расходились в одной строке. Ночь на шестнадцатое марта: в одной копии недостача есть, в другой её никогда не было. Улик за ночь: {clues}."
- id: finding_compare_register
  slot: finding
  priority: 6
  when: [seen.ledger_compare == 1, has.tenant_register == 1]
  text: "Две копии одной книги расходились в одной строке: недостача погашена в ночь на шестнадцатое марта. В книге жильцов миссис Пул я заселился с пятнадцатого. Совпадения в этом доме стоят дороже улик."

- id: finding_facade_photo
  slot: finding
  priority: 3
  when: [has.facade_photo == 1]
  text: "Снимок фасада из лаборатории Мэй Тан. Я пересчитал окна трижды. Тринадцать рядов. В лифте двенадцать кнопок."
- id: finding_ruby_record
  slot: finding
  priority: 4
  when: [has.ruby_record == 1]
  text: "Пластинка «Руби Вэнс. Синий фонарь, 1941». На конверте карандашом: «Для У., третий столик слева». Почерк женский. Рука дрожала."
- id: finding_medical_file
  slot: finding
  priority: 5
  when: [has.medical_file == 1]
  text: "Медицинская карта Вивиан Хейл. Операция в марте, четыре тысячи наличными, плательщик — У. Хейл. Те же четыре тысячи, тот же март. Хейл не сбежал с деньгами. Он с ними пришёл в больницу."
- id: finding_clock_key
  slot: finding
  priority: 2
  when: [has.clock_key == 1]
  text: "Часовой ключ Фенна на красной ленте. Открывает всё, что заводится. Решётка на одиннадцатом, как выяснилось, заводится."
- id: finding_pass
  slot: finding
  priority: 2
  when: [has.cordelia_pass == 1]
  text: "Пропуск мисс Шоу на двенадцатый. Картон, печать, ни имени, ни даты. Пропускают не человека, а его решение подняться."
- id: finding_visitor_log
  slot: finding
  priority: 6
  when: [has.visitor_log == 1]
  text: "Журнал посещений, пятнадцатое марта, страница вклеена обратно. «Миссис В. Хейл — к Владельцу, 23:40». И «повторно, 02:10». Дважды за ночь. Клиентка не говорила, что бывала здесь."
- id: finding_signature_photo
  slot: finding
  priority: 7
  when: [has.signature_photo == 1]
  text: "Негатив из лаборатории Мэй Тан: камера на шнуре с крыши Белведера, в окно двенадцатого этажа. Чёрная стойка, человек в шляпе, женщина в мокром пальто подписывает книгу. Трость у стойки. Пятнадцатое марта, 23:40. Лица не видно. Кольцо видно."
- id: finding_book_41
  slot: finding
  priority: 8
  when: [seen.book_41_vivian == 1]
  text: "Книга залогов, сорок первая строка: имя «Уолтер Хейл», залогодатель — Вивиан Хейл, жена. Сорок вторая: память о сорок первой, она же. Она отдала меня, а потом отдала то, что отдала."
- id: finding_vault
  slot: finding
  priority: 7
  when: [seen.vault13 == 1]
  text: "Тринадцатый этаж существует. Целая полка конвертов на фамилию Кэллоуэй, подписанных моей рукой. В конце полки пустое место, аккуратное, как вырезанная страница."
- id: finding_vivian_envelope
  slot: finding
  priority: 9
  when: [has.vivian_envelope == 1]
  text: "Конверт Вивиан Хейл на тринадцатом: «Предмет: память о залоге № 41». Тёплый. Внутри ночь, которую она не помнит. Ночь, когда она отдала меня, чтобы спасти."
- id: finding_matches
  slot: finding
  priority: 3
  when: [has.matches == 1]
  text: "Коробок Сайласа. Им, говорит он, можно зажечь то, что не горит. Бумагу, которая всё помнит. Я положил его в тот карман, где обычно держу сигареты, и весь вечер забывал курить."
# ── Поворот ──────────────────────────────────────────────────────────────────
- { id: twist_default, slot: twist, priority: -100, text: "Поворота не было. Или я его не запомнил." }
- id: twist_suspicion
  slot: twist
  when: [suspicion >= 6]
  text: "К утру обо мне говорили на каждой площадке. Горман знает, что я здесь. Значит, знает и Владелец."
- id: twist_gorman_debt
  slot: twist
  when: [seen.gorman_debt == 1]
  text: "Горман сказал, что долг клуба лёг на него. Полицейский, который платит за чужую растрату, ищет не преступника. Он ищет, кого предъявить."
- id: twist_fake_ledger
  slot: twist
  priority: 1
  when: [has.ledger_fake == 1, has.ledger_true == 0, seen.sloan_cashbox == 0]
  text: "Я поверил книге. Чистые цифры, никакой недостачи. Если Хейл ничего не крал, ему незачем было прятаться. Значит, его спрятали."
- id: twist_fake_vs_ticket
  slot: twist
  priority: 2
  when: [has.ledger_fake == 1, has.ledger_true == 0, seen.sloan_cashbox == 1]
  text: "Слоун отдал мне книгу, где недостачи нет, и тут же рассказал, как недостачу нашёл. Один из двух Слоунов врёт. Бухгалтеры не врут по ошибке."
- id: twist_tony_lead
  slot: twist
  priority: 1
  when: [seen.tony_lead == 1]
  text: "Тони сказал, что Хейл мёртв, лежит на дне в порту, и что в «Курьере» об этом писали. Если это правда, я ищу покойника. Если нет — кому-то нужно, чтобы я так думал."
- id: twist_thirteen
  slot: twist
  priority: 3
  when: [seen.thirteen == 1]
  text: "В доме тринадцать этажей. Двенадцать — для жильцов. Один — для того, что они здесь оставили."
- id: twist_fire_escape
  slot: twist
  priority: 1
  when: [seen.tony_fight == 1]
  text: "Тони выкинул меня в окно на пожарную лестницу и сказал, что так велел Владелец. Владелец хотел, чтобы я поднялся выше. Не знаю, зачем. Знаю, что поднялся."
- id: twist_mailbox_paid
  slot: twist
  when: [seen.mailbox_paid == 1]
  text: "Кто-то оплатил комнату 3-В «до конца дела». Я не спросил, какого дела. Побоялся, что знаю."
- id: twist_mailbox
  slot: twist
  priority: 1
  when: [seen.mailbox_name == 1]
  text: "На почтовом ящике в вестибюле было моё имя. Комната 3-В, аренда оплачена до конца дела. Я никогда здесь не жил. Я начал записывать то, в чём уверен, и список вышел коротким."
- id: twist_register
  slot: twist
  priority: 2
  when: [has.tenant_register == 1]
  text: "В книге жильцов миссис Пул: «Кэллоуэй Н., с 15 марта». Прежний адрес — прочерк. Прежнее имя — прочерк. Кто-то заполнил за меня графы, которые я сам заполнить не мог."
- id: twist_contract
  slot: twist
  priority: 2
  when: [has.contract == 1]
  text: "Договор найма на комнату для новых жильцов заполнен на моё имя. Почерк тоже мой. Я сравнил с подписью на гонорарной расписке. Один в один. Я перестал сравнивать."
- id: twist_ring_returned
  slot: twist
  priority: 5
  when: [returned.ring == 1]
  text: "У Долли, на выходе, вернулась часовня на Канал-стрит. Дождь, рис на мокрых ступенях, чья-то ладонь в моей. Лица я не помню. Пока."
- id: twist_ledger_returned
  slot: twist
  priority: 5
  when: [returned.ledger == 1]
  text: "Вместо бриллиантов сенатора вернулись цифры: столбец с недостачей в четыре тысячи. Я помнил его так, как помнят собственный почерк. Детективы так не помнят цифры. Бухгалтеры помнят."
- id: twist_cashbox_returned
  slot: twist
  priority: 6
  when: [returned.cashbox == 1]
  text: "Вернулась касса клуба. Ночь, ключ, четыре тысячи в конверте, и мысль: «Я верну в понедельник». Я помнил, как брал деньги. Я не помнил, для кого."

- id: twist_lantern_returned
  slot: twist
  priority: 5
  when: [returned.lantern == 1]
  text: "Вместо бара «Макгиннис» вернулся «Синий фонарь». Третий столик слева, гроссбух на коленях, и голос со сцены, от которого сбивался счёт."
- id: twist_hospital_returned
  slot: twist
  priority: 6
  when: [returned.hospital == 1]
  text: "Вместо Лорейн вернулся больничный коридор. Кафель, часы над дверью, стул, на который я так и не сел. За дверью кого-то зашивали, и я считал минуты, как считают деньги."
- id: twist_voice_returned
  slot: twist
  priority: 6
  when: [returned.voice == 1]
  text: "Вместо отца-патрульного вернулся голос. Женский, усталый, зовущий меня из другой комнаты. Имя, которым он меня звал, я не разобрал. Но обернулся."
- id: twist_on_air
  slot: twist
  priority: 3
  when: [seen.on_air == 1]
  text: "Я сказал в эфир, что ищу Уолтера Хейла. Меня слышал весь дом. Этажом выше звякнула ложка о блюдце. Кто-то наверху пил чай под мой голос."
- id: twist_book_41
  slot: twist
  priority: 4
  when: [seen.book_41 == 1, seen.book_41_vivian == 0]
  text: "В книге залогов, в строке сорок один, имя «Уолтер Хейл». Залогодатель залит чернилами. Под кляксой женский почерк. Мне не понравилось, как быстро я подумал, чей."
- id: twist_name_returned
  slot: twist
  priority: 8
  when: [returned.name == 1]
  text: "Вместо лицензии номер 2214 вернулось имя. Уолтер Хейл. Я произнёс его вслух в вестибюле, и Долли не подняла глаз. Она знала его всё это время."
- id: twist_secret_returned
  slot: twist
  priority: 9
  when: [returned.secret == 1]
  text: "Вместо шрама из Бруклина вернулось то, чего я не должен был знать. Вивиан в мокром пальто у чёрной стойки на двенадцатом. Она отдаёт моё имя, чтобы меня не посадили. А потом возвращается и отдаёт память об этом, потому что не может с ней жить."
- id: twist_final
  slot: twist
  priority: 20
  when: [ending_night == 1]
  text: "Поворотом этой ночи была лестница, по которой я поднялся до конца. Все остальные повороты я уже прошёл."
# ── Цена ─────────────────────────────────────────────────────────────────────
# Ник пока верит в свою биографию, поэтому в «Цене» нет слов «которого не было».
# Это знание приходит позже, голосом Уолтера (backlog: memories_returned >= 4).
- { id: price_default, slot: price, priority: -100, text: "Заплатил воспоминанием. Каким — уже не помню." }
- { id: price_marines, slot: price, when: [pledged.ring == 1], text: "Я отдал Тихий океан. Два года жары и писем, которые никто не ждал. Долли взяла конверт и не посмотрела мне в глаза." }
- { id: price_mcginnis, slot: price, when: [pledged.lantern == 1], text: "Я отдал бар «Макгиннис», где меня все знают. Утром я не вспомню, где пью. Возможно, это к лучшему." }
- { id: price_senator_dog, slot: price, when: [pledged.ledger == 1], text: "Я отдал своё первое дело, бриллианты сенатора. Самая гордая история в моей жизни уместилась в конверт без марки." }
- { id: price_lorraine, slot: price, when: [pledged.hospital == 1], text: "Я отдал Лорейн, которая ушла к трубачу. Думал, будет легче. Не стало." }
- { id: price_father, slot: price, when: [pledged.voice == 1], text: "Я отдал отца-патрульного, погибшего на посту. Долли заклеила конверт, и у меня стало на одну могилу меньше." }
- { id: price_sheriff, slot: price, when: [pledged.cashbox == 1], text: "Я отдал пса по кличке Шериф. Утром дома меня никто не встретит, и я не буду знать, что кто-то должен был." }
- { id: price_license, slot: price, when: [pledged.name == 1], text: "Я отдал лицензию № 2214. Теперь я детектив только потому, что так написано на двери." }
- { id: price_scar, slot: price, when: [pledged.secret == 1], text: "Я отдал шрам из Бруклина. Рука осталась прежней. История шрама — нет." }
- id: price_night
  slot: price
  priority: 5
  when: [night_pledged == 1]
  text: "Я заложил ночь целиком. Этот отчёт в дело не пойдёт: утром его не будет. Об одной ночи я ничего не буду помнить. Я сам так решил."
- id: price_caught
  slot: price
  priority: 6
  when: [suspicion >= 10]
  text: "Из дома меня вывели за воротник. Конверт заклеивали при мне, и это был единственный раз, когда Долли не смотрела, что внутри."
- id: price_final
  slot: price
  priority: 20
  when: [ending_night == 1]
  text: "В эту ночь я ничего не оставил у Долли. Или оставил всё сразу. Это зависит от того, кто будет читать."

# ── v2: зацепки, дилемма, поручительства ────────────────────────────────────
