  priority: 6
  when: [seen.ruby_vouched == 1]
  text: "Руби поставила свою пластинку, и мы слушали её голос вдвоём. Она — с закрытыми глазами, я — с открытыми. Потом написала на салфетке, что поручится за меня. Крупно."
- id: witnesses_ruby_coffee
  slot: witnesses
  priority: 5
  when: [seen.ruby_u == 1]
  text: "Я спросил Руби, кто такой «У.» с её пластинки. Она написала: «Не твоё дело». А ниже — что он пил кофе, две ложки сахара, без молока. Я пью так же. Так пьёт половина Харроу."
