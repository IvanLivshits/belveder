# Площадки 5–8 и пожарная лестница.
# Время: ход = 30 минут от 22:00. Полночь = ход 4, час ночи = ход 6.
# Доктор принимает до полуночи (успеть можно только грузовым лифтом),
# Руби дома после часа ночи.

- id: floor_05_doors
  location: floor_05
  layout: doors
  background: landing_05
  title: Площадка 5
  text: |
    Из-под двери тянет уксусом и проявителем. На стене приколоты фотографии: улицы Харроу, все чёрно-белые, все под дождём. Служебная дверь с красной лампой над косяком.
  choices:
    - text: Студия фотографа
      when: [suspicion < 5]
      effects: [visited.floor5.tenant += 1, floor = 5]
      goto: tenant_05
    - text: Фотолаборатория
      effects: [visited.floor5.service += 1, floor = 5]
      goto: service_05
    - text: Лестница
      free: true
      effects: [floor = 5]
      goto: stairwell

- id: floor_06_doors
  location: floor_06
  layout: doors
  background: landing_06
  title: Площадка 6
  text: |
    Глухие удары за стеной, ровные, как метроном. Кто-то бьёт мешок и не устаёт. В конце коридора окно, за ним чугунные перила пожарной лестницы.
  choices:
    - text: Спортзал
      when: [suspicion < 5]
      effects: [visited.floor6.tenant += 1, floor = 6]
      goto: tenant_06
    - text: Окно на пожарную лестницу
      when: [paths.fire_escape == 1]
      effects: [visited.floor6.service += 1, floor = 6]
      goto: fire_escape
    - text: Лестница
      free: true
      effects: [floor = 6]
      goto: stairwell

- id: floor_07_doors
  location: floor_07
  layout: doors
  background: landing_07
  title: Площадка 7
  text: |
    Красная дорожка, на двери латунная семёрка и записка от руки: «Не стучать. После часа ночи — можно». За служебной дверью кто-то крутит пластинку без звука: слышно только шипение иглы.
  choices:
    - text: Квартира певицы
      when: [turn >= 6, suspicion < 5]
      effects: [visited.floor7.tenant += 1, floor = 7]
      goto: tenant_07
    - text: Гримёрная
      effects: [visited.floor7.service += 1, floor = 7]
      goto: service_07
    - text: Лестница
      free: true
      effects: [floor = 7]
      goto: stairwell

- id: floor_08_doors
  location: floor_08
  layout: doors
  background: landing_08
  title: Площадка 8
  text: |
    Пахнет карболкой. На двери табличка: «Д-р С. Ауэрбах. Приём до полуночи». Служебная дверь в конце коридора — «Процедурная». За окном кончается пожарная лестница.
  choices:
    - text: Приёмная доктора
      when: [turn < 4, suspicion < 5]
      effects: [visited.floor8.tenant += 1, floor = 8, met.auerbach = 1]
      goto: tenant_08
    - text: Процедурная
      effects: [visited.floor8.service += 1, floor = 8]
      goto: service_08
    - text: Лестница
      free: true
      effects: [floor = 8]
      goto: stairwell

# ── Пожарная лестница 6 → 8, мимо седьмого ───────────────────────────────────
# Открывается, когда Тони выкидывает Ника в окно. Только вверх.

- id: fire_escape_gorman
  location: fire_escape
  priority: 2
  when: [suspicion >= 3, seen.gorman == 0]
  background: fire_escape
  portrait: gorman_smirk
  title: Пожарная лестница
  text: |
    На площадке седьмого, под козырьком, стоит человек в плаще и курит, как будто ждал именно здесь.

    — Сержант Горман, — говорит он. — Честные люди ходят по лестнице внутри, Кэллоуэй.
  choices:
    - text: Угостить сигаретой
      when: [cigarettes >= 1]
      effects: [seen.gorman = 1, met.gorman = 1, cigarettes -= 1, suspicion -= 1]
      outcome: |
        Горман прикуривает, прикрывая огонёк ладонью от дождя. Отходит к перилам, освобождая проход.

        — Восьмой — это доктор. Передай ему, что я помню его фамилию.
    - text: Пройти мимо
      effects: [seen.gorman = 1, met.gorman = 1, suspicion += 1]
      outcome: |
        Ты проходишь так близко, что чувствуешь запах его табака. Горман не двигается. Он запоминает.

- id: fire_escape_climb
  location: fire_escape
  background: fire_escape
  title: Пожарная лестница
  text: |
    Мокрый чугун, ветер с товарной станции, внизу шесть этажей пустоты. Седьмой этаж проходит мимо тёмными окнами. В одном мелькает женщина в халате и задёргивает штору.
  choices:
    - text: Наверх, к окну восьмого
      effects: [floor = 8]
      outcome: |
        Окно восьмого не заперто. Здесь, видимо, никогда ничего не запирают со стороны дождя.
      goto: floor_08
    - text: Назад, в окно шестого
      free: true
      goto: floor_06
