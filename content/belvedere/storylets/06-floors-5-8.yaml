# Площадки 5–8 и пожарная лестница (v2, реплики).
# Время: ход = 30 минут от 22:00. Полночь = ход 4, час ночи = ход 6, два = ход 8.
# Доктор принимает до полуночи (слух doctor_late — до двух).
# Руби дома после часа ночи (слух ruby_early — с полуночи).

- id: floor_05_doors
  location: floor_05
  layout: doors
  background: landing_05
  title: Площадка 5
  lines:
    - { who: narrator, text: "Из-под двери тянет уксусом и проявителем. На стене снимки Харроу: все чёрно-белые, все под дождём." }
    - { who: narrator, text: "Над служебной дверью горит красная лампа." }
  choices:
    - text: Студия фотографа
      when: [suspicion < 5]
      effects: [visited.floor5.tenant += 1, floor = 5]
      goto: tenant_05
    - text: Фотолаборатория
      effects: [visited.floor5.service += 1, floor = 5]
      goto: service_05
    - text: Лестница
      free: true
      effects: [floor = 5]
      goto: stairwell

- id: floor_06_doors
  location: floor_06
  layout: doors
  background: landing_06
  title: Площадка 6
  lines:
    - { who: narrator, text: "Глухие удары за стеной, ровные, как метроном. Кто-то бьёт мешок и не устаёт.", when: [rumor.tony_out == 0] }
    - { who: narrator, text: "За стеной тихо. Только мешок поскрипывает на цепи.", when: [rumor.tony_out == 1] }
    - { who: narrator, text: "В конце коридора окно, за ним чугунные перила пожарной лестницы." }
  choices:
    - text: Спортзал
      when: [suspicion < 5]
      effects: [visited.floor6.tenant += 1, floor = 6]
      goto: tenant_06
    - text: Окно на пожарную лестницу
      when: [paths.fire_escape == 1]
      effects: [visited.floor6.service += 1, floor = 6]
      goto: fire_escape
    - text: Лестница
      free: true
      effects: [floor = 6]
      goto: stairwell

# Дверь Руби: после часа ночи, а в ночь ruby_early — с полуночи.
- id: floor_07_doors
  location: floor_07
  layout: doors
  background: landing_07
  title: Площадка 7
  lines:
    - { who: narrator, text: "Красная дорожка. На двери латунная семёрка и записка: «Не стучать. После часа ночи — можно»." }
    - { who: narrator, text: "Дверь приоткрыта. Пахнет духами и табаком.", when: [rumor.ruby_early == 1] }
    - { who: narrator, text: "За служебной дверью шипит игла патефона. Музыки нет." }
  choices:
    - text: Квартира певицы
      when: [turn >= 6, suspicion < 5]
      effects: [visited.floor7.tenant += 1, floor = 7]
      goto: tenant_07
    - text: Квартира певицы
      when: [rumor.ruby_early == 1, turn >= 4, turn < 6, suspicion < 5]
      effects: [visited.floor7.tenant += 1, floor = 7]
      goto: tenant_07
    - text: Гримёрная
      effects: [visited.floor7.service += 1, floor = 7]
      goto: service_07
    - text: Лестница
      free: true
      effects: [floor = 7]
      goto: stairwell

# Дверь доктора: до полуночи, а в ночь doctor_late — до двух.
- id: floor_08_doors
  location: floor_08
  layout: doors
  background: landing_08
  title: Площадка 8
  lines:
    - { who: narrator, text: "Пахнет карболкой. Табличка: «Д-р С. Ауэрбах. Приём до полуночи»." }
    - { who: narrator, text: "Под табличкой приколота бумажка: «Сегодня до двух».", when: [rumor.doctor_late == 1] }
  choices:
    - text: Приёмная доктора
      when: [turn < 4, suspicion < 5]
      effects: [visited.floor8.tenant += 1, floor = 8, met.auerbach = 1]
      goto: tenant_08
    - text: Приёмная доктора
      when: [rumor.doctor_late == 1, turn >= 4, turn < 8, suspicion < 5]
      effects: [visited.floor8.tenant += 1, floor = 8, met.auerbach = 1]
      goto: tenant_08
    - text: Процедурная
      effects: [visited.floor8.service += 1, floor = 8]
      goto: service_08
    - text: Лестница
      free: true
      effects: [floor = 8]
      goto: stairwell

# ── Пожарная лестница 6 → 8, мимо седьмого. Только вверх. ───────────────────

- id: fire_escape_gorman
  location: fire_escape
  priority: 2
  when: [suspicion >= 3, seen.gorman == 0]
  background: fire_escape
  portrait: gorman_smirk
  title: Пожарная лестница
  lines:
    - { who: narrator, text: "На площадке седьмого под козырьком курит человек в плаще. Будто ждал именно здесь." }
    - { who: gorman, text: "Сержант Горман. Честные люди ходят по лестнице внутри, Кэллоуэй." }
  choices:
    - do: Угостить сигаретой
      when: [cigarettes >= 1]
      effects: [seen.gorman = 1, met.gorman = 1, cigarettes -= 1, suspicion -= 1]
      reply:
        - { who: narrator, text: "Горман прикуривает, прикрыв огонёк ладонью, и отходит к перилам." }
        - { who: gorman, text: "Восьмой — это доктор. Передай ему, что я помню его фамилию." }
    - do: Пройти мимо
      effects: [seen.gorman = 1, met.gorman = 1, suspicion += 1]
      reply:
        - { who: narrator, text: "Ты проходишь так близко, что чувствуешь его табак. Горман не двигается. Он запоминает." }

- id: fire_escape_climb
  location: fire_escape
  background: fire_escape
  title: Пожарная лестница
  lines:
    - { who: narrator, text: "Чугунные ступени, ветер с товарной станции, внизу шесть этажей пустоты." }
    - { who: narrator, text: "В окне седьмого мелькает женщина в халате и задёргивает штору.", when: [turn >= 6] }
    - { who: gut, text: "Ступени под ногами сухие. Козырёк над пролётом, наверное." }
  choices:
    - do: Наверх, к окну восьмого
      effects: [floor = 8]
      reply:
        - { who: narrator, text: "Окно восьмого не заперто. Со стороны дождя здесь ничего не запирают." }
      goto: floor_08
    - do: Назад, в окно шестого
      free: true
      goto: floor_06
