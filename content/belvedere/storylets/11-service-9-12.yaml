# Служебные 9–12 (v2, реплики): студия WHRW, механизм часов, архив посещений, книга залогов.

# ── 9. Студия WHRW. Эфир 00:00–02:00 (ходы 4–7). Сюда же выходит вентиляция с 5-го.

- id: studio_on_air
  location: service_09
  priority: 1
  when: [turn >= 4, turn < 8]
  background: landing_09
  portrait: bennett
  title: Студия WHRW
  lines:
    - { who: narrator, text: "Красная лампа «В эфире». Беннет за стеклом говорит тем голосом, каким говорят с одним человеком." }
    - { who: bennett, text: "«…мисс Шоу, если слышите, — ставьте чайник. А вы, кто не спит на лестнице, — вас тоже слышно»." }
  choices:
    - do: Взять микрофон
      when: [seen.bennett_invite == 1, seen.on_air == 0]
      effects: [seen.on_air = 1, suspicion += 2, clues += 1]
      reply:
        - { who: nick, text: "Меня зовут Ник Кэллоуэй. Я ищу Уолтера Хейла. Если он меня слышит…" }
        - { who: narrator, text: "Ты не знаешь, как закончить. Беннет мягко забирает микрофон." }
        - { who: narrator, text: "Где-то наверху звякает о блюдце чайная ложка." }
    - do: Послушать эфир
      when: [seen.on_air_listen == 0]
      effects: [seen.on_air_listen = 1]
      reply:
        - { who: bennett, text: "«…Говорят, в Белведере есть тринадцатый этаж. Туда ходит лифт, который не ходит»." }
        - { who: bennett, text: "«Я в это не верю, дорогие слушатели. Я верю в дождь. Дождь идёт одиннадцать лет»." }
    - do: Уйти
      free: true
      goto: floor_09

- id: studio_dark
  location: service_09
  background: landing_09
  title: Студия WHRW
  lines:
    - { who: narrator, text: "Микрофон под чехлом, пепельница с одним окурком. На пульте записка Беннета самому себе." }
    - { who: narrator, text: "«Не забыть: тебя никто не узнаёт. Это не повод говорить хуже»." }
  choices:
    - do: Уйти
      free: true
      goto: floor_09

# ── 10. Механизм башенных часов ──────────────────────────────────────────────

- id: clockworks_room
  location: service_10
  background: clockworks
  title: Механизм часов
  lines:
    - { who: narrator, text: "Латунные колёса в человеческий рост. Маятник проходит над головой с тяжёлым вздохом." }
    - { who: narrator, text: "Изнутри циферблат читается задом наперёд, как твоё имя на стекле конторы." }
  choices:
    - do: Прочитать журнал на верстаке
      when: [seen.fenn_log == 0]
      effects: [seen.fenn_log = 1, clues += 1]
      reply:
        - { who: narrator, text: "Почерк Фенна, строка на ночь: «Кэллоуэй. Вошёл в 22:01. Ушёл до рассвета. Заложил что-то, не сказал что»." }
        - { who: gut, text: "Строк столько, что ты перестаёшь считать на второй странице." }
    # След Хейла: до первой строки «Кэллоуэй» — строки «Хейл».
    - do: Пролистать журнал к началу
      when: [seen.fenn_log == 1, seen.fenn_log_start == 0]
      effects: [seen.fenn_log_start = 1, clues += 1]
      reply:
        - { who: narrator, text: "Первые страницы: «Хейл, 3-В. Вошёл в 22:01. Ушёл до рассвета»." }
        - { who: narrator, text: "Месяц строк «Хейл». Потом, с пятнадцатого марта, — «Кэллоуэй»." }
        - { who: gut, text: "Почерк один. Это почерк Фенна. Это ничего не значит." }
    - do: Остановить маятник рукой
      when: [seen.pendulum == 0]
      effects: [seen.pendulum = 1, suspicion += 1]
      reply:
        - { who: narrator, text: "Маятник замирает в ладони. Весь дом на секунду затихает: ни тиканья, ни труб, ни радио." }
        - { who: narrator, text: "Потом внизу Долли роняет спицу, и всё начинается снова." }
    - do: Уйти
      free: true
      goto: floor_10

# ── 11. Архив посещений ──────────────────────────────────────────────────────

- id: visits_archive
  location: service_11
  background: landing_11
  title: Архив посещений
  lines:
    - { who: narrator, text: "Шкафы с журналами посещений, по одному на год. Судя по пыли, их ни разу не перечитывали." }
    - { who: narrator, text: "Сквозь стену из приёмной — два голоса и звон чашек.", when: [rumor.guest_upstairs == 1] }
  choices:
    - do: Прислушаться к голосам за стеной
      when: [rumor.guest_upstairs == 1, seen.archive_overheard == 0]
      effects: [seen.archive_overheard = 1, clues += 1]
      reply:
        - { who: cordelia, text: "Он опять поднимется. Вы ему позволите?" }
        - { who: owner, text: "Я никому ничего не позволяю. Я только записываю." }
    - do: Открыть журнал за март
      when: [memories_returned < 3, seen.visits_march == 0]
      effects: [seen.visits_march = 1]
      reply:
        - { who: narrator, text: "Март на месте, кроме одной страницы. Пятнадцатое вырезано бритвой у самого корешка." }
    - do: Открыть журнал за март
      when: [memories_returned >= 3, has.visitor_log == 0]
      effects: [has.visitor_log = 1, clues += 1]
      reply:
        - { who: narrator, text: "Страница за пятнадцатое вклеена обратно, криво, свежим клеем. Кто-то хотел, чтобы ты её прочёл." }
        - { who: narrator, text: "«15 марта, 23:40. Миссис В. Хейл — к Владельцу». «02:10. Миссис В. Хейл — к Владельцу. Повторно»." }
        - { who: gut, text: "Дважды за одну ночь." }
    - do: Уйти
      free: true
      goto: floor_11

# ── 12. Книга залогов ────────────────────────────────────────────────────────
# Здесь единственное прямое подтверждение лора: запись № 1. Открывается поздно.

- id: pledge_book
  location: service_12
  background: landing_12
  portrait: proprietor
  title: Книга залогов
  lines:
    - { who: narrator, text: "Книга на пюпитре, как в церкви. Толщиной в ладонь, страницы почти прозрачные." }
    - { who: gut, text: "Такие книги держат в несгораемых шкафах. Эта лежит открытой. Её не боятся потерять." }
  choices:
    - do: Пролистать март
      when: [mem.true.name == 0, seen.book_41 == 0]
      effects: [seen.book_41 = 1, clues += 1]
      reply:
        - { who: narrator, text: "«№ 41. 15 марта. Предмет залога: имя „Уолтер Хейл“. Залогодатель: ———»." }
        - { who: narrator, text: "Строка залогодателя залита чернилами. Под кляксой угадывается женский почерк." }
    - do: Пролистать март
      when: [mem.true.name == 1, seen.book_41_vivian == 0]
      effects: [seen.book_41 = 1, seen.book_41_vivian = 1, clues += 1]
      reply:
        - { who: gut, text: "Теперь клякса не мешает. Этим почерком подписаны открытки на годовщину." }
        - { who: narrator, text: "«№ 41. 15 марта. Предмет: имя „Уолтер Хейл“. Залогодатель: Вивиан Хейл, жена»." }
        - { who: narrator, text: "Строкой ниже: «№ 42. Предмет: память о залоге № 41. Залогодатель: она же»." }
    - do: Открыть книгу на первой странице
      when: [knows.fire == 1, memories_returned >= 5, knows.tomorrow == 0]
      effects: [knows.tomorrow = 1, seen.book_one = 1, clues += 1]
      reply:
        - { who: narrator, text: "Первая страница пожелтела сильнее прочих. Одна строка, чернила выцвели до коричневого." }
        - { who: narrator, text: "«№ 1. Предмет залога: завтрашний день Белведера. Залогодатель: Владелец»." }
        - { who: gut, text: "Одиннадцать лет. Дождь. Часы на 05:59." }
    - do: Вырвать страницу с сорок первой строкой
      when: [seen.book_41 == 1, seen.book_torn == 0]
      effects: [seen.book_torn = 1, suspicion += 3]
      reply:
        - { who: narrator, text: "Страница не рвётся. Тонкая, почти прозрачная, а держит, как кожа. Книга помнит." }
        - { who: narrator, text: "Треск разносится по этажу. За стеной человек в шляпе впервые за много лет поворачивается к двери." }
    - do: Уйти
      free: true
      goto: floor_12
