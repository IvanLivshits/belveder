# Служебные 9–12: студия WHRW, механизм часов, архив посещений, книга залогов.

# ── 9. Студия WHRW. Эфир 00:00–02:00 (ходы 4–7). Сюда же выходит вентиляция с 5-го.

- id: studio_on_air
  location: service_09
  priority: 1
  when: [turn >= 4, turn < 8]
  background: landing_09
  portrait: bennett
  title: Студия WHRW
  text: |
    Красная лампа «В эфире». Беннет за стеклом говорит в микрофон тем голосом, которым говорят с одним человеком, хотя слушает весь дом:

    «…мисс Шоу, если вы слышите, — ставьте чайник. А вы, кто не спит на лестнице, — вас тоже слышно».
  choices:
    - text: Взять микрофон
      when: [seen.bennett_invite == 1, seen.on_air == 0]
      effects: [seen.on_air = 1, suspicion += 2, clues += 1]
      outcome: |
        Беннет кивает и отодвигается. Микрофон тёплый от его дыхания.

        — Меня зовут Ник Кэллоуэй, — говоришь ты всему дому. — Я ищу Уолтера Хейла. Если он меня слышит… — Ты не знаешь, как закончить. Беннет мягко забирает микрофон.

        Где-то над головой, этажом выше, звякает о блюдце чайная ложка.
    - text: Послушать эфир
      when: [seen.on_air_listen == 0]
      effects: [seen.on_air_listen = 1]
      outcome: |
        «…Говорят, в Белведере есть тринадцатый этаж. Говорят, туда ходит лифт, который не ходит. Я в это не верю, дорогие слушатели. Я верю в дождь. Дождь идёт одиннадцать лет».
    - text: Уйти
      free: true
      goto: floor_09

- id: studio_dark
  location: service_09
  background: landing_09
  title: Студия WHRW
  text: |
    Пустая студия. Микрофон под чехлом, пепельница с одним окурком, на пульте записка Беннета самому себе: «Не забыть: тебя никто не узнаёт. Это не повод говорить хуже». Под потолком решётка вентиляции.
  choices:
    - text: Уйти
      free: true
      goto: floor_09

# ── 10. Механизм башенных часов ──────────────────────────────────────────────

- id: clockworks_room
  location: service_10
  background: clockworks
  title: Механизм часов
  text: |
    Латунные колёса в человеческий рост, маятник проходит над головой с тяжёлым вздохом. Изнутри циферблат читается задом наперёд, как твоё имя на стекле конторы.
  choices:
    - text: Прочитать журнал на верстаке
      when: [seen.fenn_log == 0]
      effects: [seen.fenn_log = 1, clues += 1]
      outcome: |
        Толстая тетрадь, почерк Фенна. Каждая строка — одна ночь:

        «Кэллоуэй. Вошёл в 22:01. Ушёл до рассвета. Заложил что-то, не сказал что».

        Строк столько, что ты перестаёшь считать на второй странице.
    - text: Остановить маятник рукой
      when: [seen.pendulum == 0]
      effects: [seen.pendulum = 1, suspicion += 1]
      outcome: |
        Маятник замирает у тебя в ладони. Весь дом на секунду затихает: ни тиканья, ни труб, ни радио.

        Потом где-то внизу Долли роняет спицу, и всё начинается снова.
    - text: Уйти
      free: true
      goto: floor_10

# ── 11. Архив посещений ──────────────────────────────────────────────────────

- id: visits_archive
  location: service_11
  background: landing_11
  title: Архив посещений
  text: |
    Шкафы с журналами посещений, по одному на год. На корешках — только цифры. Мисс Шоу ведёт их аккуратно и, судя по пыли, ни разу не перечитывала.
  choices:
    - text: Открыть журнал за март
      when: [memories_returned < 3, seen.visits_march == 0]
      effects: [seen.visits_march = 1]
      outcome: |
        Март на месте, кроме одной страницы. Пятнадцатое число вырезано бритвой, ровно, у самого корешка.
    - text: Открыть журнал за март
      when: [memories_returned >= 3, has.visitor_log == 0]
      effects: [has.visitor_log = 1, clues += 1]
      outcome: |
        Страница за пятнадцатое вклеена обратно, криво, свежим клеем. Кто-то хотел, чтобы ты её прочёл.

        «15 марта, 23:40. Миссис В. Хейл — к Владельцу».
        «15 марта, 02:10. Миссис В. Хейл — к Владельцу. Повторно».

        Дважды за одну ночь.
    - text: Уйти
      free: true
      goto: floor_11

# ── 12. Книга залогов ────────────────────────────────────────────────────────

- id: pledge_book
  location: service_12
  background: landing_12
  portrait: proprietor
  title: Книга залогов
  text: |
    Книга лежит на пюпитре, как в церкви. Толщиной в ладонь, страницы тонкие, почти прозрачные. На обложке ничего. Здесь записана каждая сделка Белведера. Если книга сгорит, всё заложенное вернётся владельцам.
  choices:
    - text: Найти сорок первую строку марта
      when: [mem.true.name == 0, seen.book_41 == 0]
      effects: [seen.book_41 = 1, clues += 1]
      outcome: |
        «№ 41. 15 марта. Предмет залога: имя „Уолтер Хейл“. Залогодатель: ———».

        Строка залогодателя залита чернилами. Под кляксой угадывается женский почерк.
    - text: Найти сорок первую строку марта
      when: [mem.true.name == 1, seen.book_41_vivian == 0]
      effects: [seen.book_41 = 1, seen.book_41_vivian = 1, clues += 1]
      outcome: |
        Теперь клякса не мешает. Ты знаешь этот почерк: им подписаны открытки на годовщину и списки покупок на кухонном столе.

        «№ 41. 15 марта. Предмет залога: имя „Уолтер Хейл“. Залогодатель: Вивиан Хейл, жена».

        И строкой ниже: «№ 42. 15 марта. Предмет: память о залоге № 41. Залогодатель: она же».
    - text: Вырвать страницу с сорок первой строкой
      when: [seen.book_torn == 0]
      effects: [seen.book_torn = 1, suspicion += 3]
      outcome: |
        Ты тянешь страницу, и она не рвётся. Бумага тонкая, почти прозрачная, но держит, как кожа. Книга помнит.

        Треск разносится по всему этажу. За стеной что-то скрипит: человек в шляпе впервые за много лет поворачивается к двери.
    - text: Уйти
      free: true
      goto: floor_12
