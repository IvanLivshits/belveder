# Жильцы 9–12 и Владелец.
# Концовки на 12-м помечены полем `ending`: UI спрашивает подтверждение перед финалом.

# ── 9. Клод Беннет, ночной диктор WHRW ───────────────────────────────────────

- id: bennett_apartment
  location: tenant_09
  background: landing_09
  portrait: bennett
  title: Квартира диктора
  text: |
    Человек в жилетке репетирует перед зеркалом, но в зеркало не смотрит. Голос у него такой, что хочется сесть поближе к приёмнику. Лицо — такое, что через минуту его не вспомнишь.

    — Клод Беннет, WHRW. Вы меня, конечно, не узнали. Меня никто не узнаёт. Я это продал.
  choices:
    - text: Спросить, кто его слушает
      when: [seen.bennett_who == 0]
      effects: [seen.bennett_who = 1, clues += 1]
      outcome: |
        — Весь дом. Через трубы, через вентиляцию, через стены. — Он понижает голос. — И он тоже. Наверху. Владелец не спит, пока я в эфире. Говорят, мисс Шоу ставит ему чайник на мои позывные.
    - text: Попросить минуту в эфире
      when: [seen.bennett_invite == 0]
      effects: [seen.bennett_invite = 1, debt.bennett += 1]
      outcome: |
        Беннет впервые смотрит на тебя внимательно.

        — В час ночи. Студия за соседней дверью. Скажете то, что не можете сказать в лицо. Здесь все так делают. — Пауза. — Только помните: вас услышат все. Все.
    - text: Уйти
      free: true
      goto: floor_09

# ── 10. Ирвинг Фенн, часовщик ────────────────────────────────────────────────

- id: fenn_intro
  location: tenant_10
  priority: 2
  when: [visited.floor10.tenant == 1, seen.fenn_intro == 0]
  background: clockworks
  portrait: fenn
  title: Мастерская часовщика
  text: |
    Сорок часов на стенах, и все показывают разное время. Старик с лупой в глазу поднимает голову.

    — Ирвинг Фенн. А вы мистер Кэллоуэй. Ночей за вами, если считать честно, — {nights}. Эта не в счёт, пока не кончилась. Вы опять опоздали на одну минуту.
  choices:
    - text: Спросить, на какую минуту
      free: true
      effects: [seen.fenn_intro = 1, seen.fenn_minute = 1, debt.fenn += 1]
      outcome: |
        — На ту, в которую вы вошли в этот дом впервые. Двадцать две ноль одна. С тех пор вы каждый раз входите в двадцать две ноль одна. Часы врут. Вы — нет.

- id: fenn_shop
  location: tenant_10
  background: clockworks
  portrait: fenn
  title: Мастерская Фенна
  text: |
    Фенн собирает механизм пинцетом, не поднимая глаз. Он хочет одного: дожить до завтра. По его словам, завтра в этом доме ещё ни разу не наступало.
  choices:
    - text: Спросить, на какую минуту он опаздывает
      when: [seen.fenn_minute == 0]
      effects: [seen.fenn_minute = 1, debt.fenn += 1]
      outcome: |
        — На ту, в которую вы вошли в этот дом впервые. Двадцать две ноль одна. С тех пор вы каждый раз входите в двадцать две ноль одна.
    - text: Помочь завести стенные часы
      when: [seen.fenn_wind == 0]
      effects: [seen.fenn_wind = 1, debt.fenn += 1, turn += 1]
      outcome: |
        Вы заводите сорок часов, одни за другими. Фенн ведёт счёт вслух. На тридцать девятых он сбивается и долго смотрит на тебя.

        — Вы заводили их со мной в прошлый раз. И в позапрошлый. У вас рука набита.
    - text: Угостить сигаретой
      when: [cigarettes >= 1, seen.fenn_cig == 0]
      effects: [seen.fenn_cig = 1, cigarettes -= 1, debt.fenn += 1]
      outcome: |
        — Не курю. Отвлекает от секундной стрелки. — Он всё-таки прячет сигарету в ящик с винтиками. — Спасибо. Я её посчитаю.
    - text: Попросить часовой ключ
      when: [debt.fenn >= 2, has.clock_key == 0]
      effects: [has.clock_key = 1, clues += 1]
      outcome: |
        Фенн снимает с шеи ключ на красной ленте.

        — Он открывает всё, что заводится. Решётка на одиннадцатом заводится, как часы, — её ставил я. — Он не отпускает ленту. — Верните до рассвета. Хотя рассвет всё равно не наступит.
    - text: Уйти
      free: true
      goto: floor_10

# ── 11. Мисс Корделия Шоу, секретарь Владельца ───────────────────────────────

- id: cordelia_desk
  location: tenant_11
  background: landing_11
  portrait: cordelia
  title: Приёмная
  text: |
    Женщина за пустым столом. Ни бумаг, ни цветов, ни фотографии в рамке. Перед ней только печать и стопка пропусков, перевязанная лентой. Она смотрит сквозь тебя, вежливо, как смотрят на дождь.

    — Мисс Шоу. Чем могу? Хотя я ничего не могу. И ничего не хочу. Это не жалоба.
  choices:
    - text: Спросить, чего она хочет
      when: [seen.cordelia_want == 0]
      effects: [seen.cordelia_want = 1, debt.cordelia += 1]
      outcome: |
        — Ничего. Я продала это давно. Список желаний, написанный в девятнадцать лет. — Она поправляет печать на сантиметр. — Раньше это было облегчением. Теперь это пугает.
    - text: Предложить ей сигарету, чтобы она захотела хотя бы её
      when: [seen.cordelia_want == 1, cigarettes >= 1, has.cordelia_pass == 0]
      effects: [cigarettes -= 1, has.cordelia_pass = 1, clues += 1]
      outcome: |
        Мисс Шоу долго смотрит на сигарету. Потом берёт. Потом — впервые — улыбается, неловко, как человек, который давно не пользовался лицом.

        — Кажется, я её хочу. — Она снимает с ленты пропуск и кладёт перед тобой. — Это вам. За то, что напомнили.
    - text: Сказать, что она слышала тебя по радио
      when: [seen.on_air == 1, has.cordelia_pass == 0]
      effects: [has.cordelia_pass = 1, clues += 1]
      outcome: |
        — Слышала. Мы все слышали. — Она развязывает ленту. — Мне было интересно, чем это кончится. Мне давно ничего не было интересно. Идите. Он вас ждёт. Он всех ждёт.
    - text: Взять пропуск со стола, пока она смотрит в окно
      when: [has.cordelia_pass == 0]
      effects: [has.cordelia_pass = 1, clues += 1, suspicion += 2]
      outcome: |
        Ты тянешь пропуск из-под ленты. Мисс Шоу не оборачивается.

        — Можно было попросить, — говорит она стеклу. — Я бы всё равно не захотела отказать.
    - text: Уйти
      free: true
      goto: floor_11

# ── 12. Владелец ─────────────────────────────────────────────────────────────

- id: owner_first
  location: tenant_12
  priority: 2
  when: [met.owner == 0]
  background: landing_12
  portrait: proprietor
  title: Ломбард
  text: |
    Стойка, как у Долли, только из чёрного дерева. За ней человек в шляпе, лицом к окну. Он не оборачивается, и ты понимаешь, что не хочешь, чтобы он обернулся.

    — Мистер Кэллоуэй. Вы поднялись сами. Это важно. Остальные поднимаются, когда их приносят.
  choices:
    - text: Подойти к стойке
      free: true
      effects: [met.owner = 1]

- id: owner_office
  location: tenant_12
  background: landing_12
  portrait: proprietor
  title: Ломбард
  text: |
    Владелец стоит лицом к окну. На стойке перед ним — лист отчёта, ручка и пустой конверт. Кресло за стойкой отодвинуто, будто его давно никто не занимал по-настоящему.
  choices:
    - text: Спросить, где Хейл
      when: [seen.owner_hale == 0]
      effects: [seen.owner_hale = 1, clues += 1]
      outcome: |
        — Хейла нет. Есть имя в книге. Имя, заложенное из любви, — самое дорогое, что здесь лежит. — Пауза. — Я не лгу, мистер Кэллоуэй. Я просто не отвечаю на вопросы.
    - text: Спросить, кто он
      when: [seen.owner_who == 0]
      effects: [seen.owner_who = 1]
      outcome: |
        — Должность. — Он чуть поворачивает голову, но лица ты всё равно не видишь. — Её занимают те, у кого ничего не осталось. Я занимаю её очень давно. Я устал.
    - text: "Подписать отчёт: «Уолтер Хейл мёртв»"
      # Кольцо уходит вдове в конверте, поэтому его нужно хоть раз найти.
      when: [mem.true.name == 0, found.ring == 1]
      ending: case_closed
      outcome: |
        Ручка тяжёлая, как пистолет. Ты подписываешь. Владелец кладёт в конверт отчёт и что-то ещё — маленькое, звякнувшее о стойку.

        — Передайте вдове. Она заплатит остальное.
    - text: Выкупить имя
      when: [mem.true.name == 1, found.ledger_true == 1, met.sloan_deal == 1]
      ending: redemption
      outcome: |
        — Цена втрое, — говорит Владелец. — Не деньгами. Всё, что вы узнали в этом доме. Каждую ночь. Каждую лестницу. Каждое лицо.

        Ты киваешь. Он открывает книгу на сорок первой строке.
    - text: Сесть в его кресло
      when: [suspicion >= 7, has.cordelia_pass == 1, has.clock_key == 1]
      ending: new_proprietor
      outcome: |
        Ты обходишь стойку и садишься. Кресло тёплое. Владелец оборачивается — впервые — и снимает шляпу.

        Под шляпой никого нет.
    - text: Уйти
      free: true
      goto: floor_12
