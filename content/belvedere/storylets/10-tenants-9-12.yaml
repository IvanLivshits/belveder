# Жильцы 9–12 и Владелец (v2, реплики).
# Концовки на 12-м помечены полем `ending`: UI спрашивает подтверждение перед финалом.
# Поручительство: Фенн (завести часы и назвать, которая это ночь по счёту).

# ── 9. Клод Беннет, ночной диктор WHRW ───────────────────────────────────────
# Хочет: чтобы его узнали. Скрывает: продал лицо, и теперь его не узнаёт никто.

- id: bennett_apartment
  location: tenant_09
  background: landing_09
  portrait: bennett
  title: Квартира диктора
  lines:
    - { who: narrator, text: "Человек в жилетке репетирует перед зеркалом, но в зеркало не смотрит." }
    - { who: narrator, text: "Голос такой, что хочется сесть поближе к приёмнику. Лицо забываешь через минуту." }
    - { who: bennett, text: "Клод Беннет, WHRW. Вы меня, конечно, не узнали. Меня никто не узнаёт. Я это продал." }
  choices:
    - say: Кто вас слушает?
      when: [seen.bennett_who == 0]
      effects: [seen.bennett_who = 1, clues += 1]
      reply:
        - { who: bennett, text: "Весь дом. Через трубы, вентиляцию, стены." }
        - { who: bennett, text: "И он тоже, наверху. Говорят, мисс Шоу ставит ему чайник на мои позывные." }
    - say: Дадите минуту в эфире?
      when: [seen.bennett_invite == 0]
      effects: [seen.bennett_invite = 1, debt.bennett += 1]
      reply:
        - { who: bennett, text: "В час ночи. Студия за соседней дверью. Скажете то, что не можете сказать в лицо." }
        - { who: bennett, text: "Только помните: вас услышат все. Все." }
    - do: Уйти
      free: true
      goto: floor_09

# ── 10. Ирвинг Фенн, часовщик ────────────────────────────────────────────────
# Хочет: дожить до завтра. Скрывает: знает, что завтра в этом доме не наступает.

- id: fenn_intro
  location: tenant_10
  priority: 2
  when: [visited.floor10.tenant == 1, seen.fenn_intro == 0, seen.fenn_met == 0]
  background: clockworks
  portrait: fenn
  title: Мастерская часовщика
  lines:
    - { who: narrator, text: "Сорок часов на стенах, и все показывают разное время. Старик с лупой в глазу поднимает голову." }
    - { who: fenn, text: "Ирвинг Фенн. А вы мистер Кэллоуэй. Ночей за вами, если считать честно, — {nights}." }
    - { who: fenn, text: "Вы опять опоздали на одну минуту." }
  choices:
    - say: На какую минуту?
      free: true
      effects: [seen.fenn_intro = 1, seen.fenn_met = 1, seen.fenn_minute = 1, debt.fenn += 1]
      reply:
        - { who: fenn, text: "На ту, в которую вошли сюда впервые. Двадцать две ноль одна." }
        - { who: fenn, text: "С тех пор вы всегда входите в двадцать две ноль одна. Часы врут. Вы — нет." }

- id: fenn_shop
  location: tenant_10
  background: clockworks
  portrait: fenn
  title: Мастерская Фенна
  lines:
    - { who: narrator, text: "Фенн собирает механизм пинцетом. Говорит, хочет дожить до завтра. Завтра здесь ещё ни разу не наступало." }
    - { who: gut, text: "Сорок часов врут по-разному. Одни стоят: 05:59.", when: [nights >= 3] }
  choices:
    - say: На какую минуту я опаздываю?
      when: [seen.fenn_minute == 0]
      effects: [seen.fenn_minute = 1, debt.fenn += 1]
      reply:
        - { who: fenn, text: "На ту, в которую вошли сюда впервые. Двадцать две ноль одна. С тех пор — всегда в двадцать две ноль одна." }
    - say: Почему эти часы стоят?
      when: [nights >= 3, seen.fenn_559 == 0]
      effects: [seen.fenn_559 = 1, clues += 1]
      reply:
        - { who: fenn, text: "Остановились в ту ночь. За минуту до шести. Не до них." }
        - { who: gut, text: "Сломанные часы. В мастерской часовщика. Бывает." }
    - do: Помочь завести стенные часы
      when: [seen.fenn_wind == 0]
      effects: [seen.fenn_wind = 1, debt.fenn += 1, turn += 1]
      reply:
        - { who: narrator, text: "Сорок часов, одни за другими. Фенн ведёт счёт вслух и сбивается на тридцать девятых." }
        - { who: fenn, text: "Вы заводили их со мной в прошлый раз. Рука набита. А я сбился — и со счёта ночей тоже. Которая сегодня?" }
    # Поручительство: назвать номер ночи. Ник знает его по своим отчётам.
    - do: Назвать, которая это ночь
      when: [seen.fenn_wind == 1, vouch.fenn == 0]
      effects: [vouch.fenn = 1, vouches += 1, debt.fenn += 1, seen.fenn_vouched = 1]
      reply:
        - { who: narrator, text: "Ты считаешь страницы отчётов в голове и называешь число." }
        - { who: fenn, text: "Верно. Точность заслуживает доверия. Наверху спросят — я поручусь." }
    - do: Угостить сигаретой
      when: [cigarettes >= 1, seen.fenn_cig == 0]
      effects: [seen.fenn_cig = 1, cigarettes -= 1, debt.fenn += 1]
      reply:
        - { who: fenn, text: "Не курю. Отвлекает от секундной стрелки." }
        - { who: narrator, text: "Он всё-таки прячет сигарету в ящик с винтиками. «Я её посчитаю»." }
    - say: Что открывает ключ у вас на шее?
      when: [debt.fenn >= 2, has.clock_key == 0]
      effects: [has.clock_key = 1, clues += 1]
      reply:
        - { who: fenn, text: "Всё, что заводится. Решётка на одиннадцатом заводится, как часы. Её ставил я." }
        - { who: fenn, text: "Верните до рассвета. Хотя рассвет всё равно не наступит." }
    - do: Уйти
      free: true
      goto: floor_10

# ── 11. Мисс Корделия Шоу, секретарь Владельца ───────────────────────────────
# Хочет: ничего, продала желания. Скрывает: ей страшно, что ничего не хочется.

- id: cordelia_busy
  location: tenant_11
  priority: 3
  when: [rumor.guest_upstairs == 1, has.cordelia_pass == 0]
  background: landing_11
  title: Приёмная
  lines:
    - { who: narrator, text: "Дверь приёмной заперта. На ручке табличка «Занято». Внутри звенит ложка о блюдце: чай на двоих." }
    - { who: gut, text: "Долли говорила, наверху сегодня гость." }
  choices:
    - do: Уйти
      free: true
      goto: floor_11

- id: cordelia_desk
  location: tenant_11
  background: landing_11
  portrait: cordelia
  title: Приёмная
  lines:
    - { who: narrator, text: "Пустой стол: только печать и стопка пропусков на ленте. Она смотрит сквозь тебя, вежливо, как на дождь." }
    - { who: cordelia, text: "Мисс Шоу. Чем могу? Хотя я ничего не могу. И ничего не хочу. Это не жалоба." }
  choices:
    - say: За меня поручились трое
      when: [vouches >= 3, has.cordelia_pass == 0]
      effects: [has.cordelia_pass = 1, seen.cordelia_vouched = 1, clues += 1]
      reply:
        - { who: narrator, text: "Мисс Шоу развязывает ленту раньше, чем ты договариваешь." }
        - { who: cordelia, text: "Знаю. Записки пришли пневмопочтой. Владелец не любит ждать тех, за кого поручились." }
    - say: Чего вы хотите?
      when: [seen.cordelia_want == 0]
      effects: [seen.cordelia_want = 1, debt.cordelia += 1]
      reply:
        - { who: cordelia, text: "Ничего. Я продала это давно. Список желаний, написанный в девятнадцать лет." }
        - { who: cordelia, text: "Раньше это было облегчением. Теперь это пугает." }
    - do: Предложить ей сигарету
      when: [seen.cordelia_want == 1, cigarettes >= 1, has.cordelia_pass == 0]
      effects: [cigarettes -= 1, has.cordelia_pass = 1, clues += 1]
      reply:
        - { who: narrator, text: "Мисс Шоу долго смотрит на сигарету. Берёт. Улыбается неловко, как человек, который давно не пользовался лицом." }
        - { who: cordelia, text: "Кажется, я её хочу. Это вам. За то, что напомнили." }
    - say: Вы слышали меня по радио
      when: [seen.on_air == 1, has.cordelia_pass == 0]
      effects: [has.cordelia_pass = 1, clues += 1]
      reply:
        - { who: cordelia, text: "Слышали. Мы все слышали. Мне было интересно, чем это кончится." }
        - { who: cordelia, text: "Мне давно ничего не было интересно. Идите. Он всех ждёт." }
    - do: Взять пропуск, пока она смотрит в окно
      when: [has.cordelia_pass == 0]
      effects: [has.cordelia_pass = 1, clues += 1, suspicion += 2]
      reply:
        - { who: narrator, text: "Ты тянешь пропуск из-под ленты. Мисс Шоу не оборачивается." }
        - { who: cordelia, text: "Можно было попросить. Я бы всё равно не захотела отказать." }
    - do: Уйти
      free: true
      goto: floor_11

# ── 12. Владелец ─────────────────────────────────────────────────────────────
# Не оборачивается, не лжёт, не отвечает на вопросы.

- id: owner_first
  location: tenant_12
  priority: 2
  when: [met.owner == 0]
  background: landing_12
  portrait: proprietor
  title: Ломбард
  lines:
    - { who: narrator, text: "Стойка, как у Долли, только из чёрного дерева. За ней человек в шляпе, лицом к окну." }
    - { who: gut, text: "Ты не хочешь, чтобы он обернулся." }
    - { who: owner, text: "Мистер Кэллоуэй. Вы поднялись сами. Это важно. Остальных сюда приносят." }
  choices:
    - do: Подойти к стойке
      free: true
      effects: [met.owner = 1]

- id: owner_office
  location: tenant_12
  background: landing_12
  portrait: proprietor
  title: Ломбард
  lines:
    - { who: narrator, text: "Владелец стоит лицом к окну. На стойке лист отчёта, ручка и пустой конверт." }
    - { who: narrator, text: "Кресло за стойкой отодвинуто, будто его давно никто не занимал по-настоящему." }
  choices:
    - say: Где Хейл?
      when: [seen.owner_hale == 0]
      effects: [seen.owner_hale = 1, clues += 1]
      reply:
        - { who: owner, text: "Хейла нет. Есть имя в книге. Имя, заложенное из любви, — самое дорогое, что здесь лежит." }
        - { who: owner, text: "Я не лгу, мистер Кэллоуэй. Я просто не отвечаю на вопросы." }
    - say: Кто вы?
      when: [seen.owner_who == 0]
      effects: [seen.owner_who = 1]
      reply:
        - { who: owner, text: "Должность. Её занимают те, у кого ничего не осталось." }
        - { who: owner, text: "Я занимаю её очень давно. Я устал." }
    # Слой лора: прочитана запись № 1 в книге залогов.
    - say: Вы заложили завтрашний день
      when: [knows.tomorrow == 1, seen.owner_tomorrow == 0]
      effects: [seen.owner_tomorrow = 1, clues += 1]
      reply:
        - { who: owner, text: "Чтобы никто не сгорел. Никто и не сгорел." }
        - { who: owner, text: "Никто и не проснулся." }
    - say: "Подписать: «Уолтер Хейл мёртв»"
      # Кольцо уходит вдове в конверте, поэтому его нужно хоть раз найти.
      when: [mem.true.name == 0, found.ring == 1]
      ending: case_closed
      reply:
        - { who: narrator, text: "Ручка тяжёлая, как пистолет. Владелец кладёт в конверт отчёт и что-то маленькое, звякнувшее о стойку." }
        - { who: owner, text: "Передайте вдове. Она заплатит остальное." }
    - say: Я выкуплю имя
      when: [mem.true.name == 1, found.ledger_true == 1, met.sloan_deal == 1]
      ending: redemption
      reply:
        - { who: owner, text: "Цена втрое. Не деньгами. Всё, что вы узнали в этом доме. Каждую ночь. Каждое лицо." }
        - { who: narrator, text: "Ты киваешь. Он открывает книгу на сорок первой строке." }
    - do: Сесть в его кресло
      when: [suspicion >= 7, has.cordelia_pass == 1, has.clock_key == 1]
      ending: new_proprietor
      reply:
        - { who: narrator, text: "Ты обходишь стойку и садишься. Кресло тёплое. Владелец оборачивается — впервые — и снимает шляпу." }
        - { who: narrator, text: "Под шляпой никого нет." }
    - do: Уйти
      free: true
      goto: floor_12
