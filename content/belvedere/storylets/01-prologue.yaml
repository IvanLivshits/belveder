# Пролог: контора Ника и фасад. Всё здесь бесплатно: ночь начинается в вестибюле.
# Варианты конторы выбираются по priority: кольцо > кофе > повтор > первая ночь.

- id: office_return
  location: office
  priority: 1
  when: [nights >= 1]
  background: office_empty
  portrait: vivian
  title: Контора
  text: |
    Половина десятого. Мокрое пальто, трость у стола, конверт с двумя сотнями.

    — Мой муж, Уолтер Хейл…

    Ты знаешь, что она скажет дальше, за секунду до того, как она это говорит. Списываешь на усталость. В этом городе все истории начинаются одинаково.
  choices:
    - text: Закурить и спросить, что он там забыл
      when: [seen.office_smoke == 0, cigarettes >= 1]
      free: true
      effects: [seen.office_smoke = 1, cigarettes -= 1, clues += 1]
      outcome: |
        — Выкупить одну вещь. — Она отвечает раньше, чем ты договариваешь. Потом сама этому удивляется.
    - text: Спросить, мог ли он сбежать с чужими деньгами
      when: [seen.vivian_lie == 0]
      free: true
      effects: [seen.vivian_lie = 1]
      outcome: |
        — Уолтер никогда не брал чужого.

        Ты киваешь. Ты уже слышал эту фразу. Ты уже ей не поверил.
    - text: Взять деньги и дело
      free: true
      effects: [seen.client_return = 1]
      goto: facade

- id: office_coffee
  location: office
  priority: 2
  when: [nights >= 4]
  background: office_empty
  portrait: vivian_tears
  title: Контора
  text: |
    Ты наливаешь ей кофе: две ложки сахара, без молока. Раньше, чем она просит.

    Она смотрит на чашку так, будто ты её ударил. Ты делаешь вид, что не заметил. Вы оба делаете вид уже очень долго.
  choices:
    - text: Спросить, мог ли он сбежать с чужими деньгами
      when: [seen.vivian_lie == 0]
      free: true
      effects: [seen.vivian_lie = 1]
      outcome: |
        — Уолтер никогда… — Она замолкает и смотрит на сахарницу. — Уолтер никогда не брал чужого.
    - text: Взять деньги и дело
      free: true
      effects: [seen.client_coffee = 1]
      goto: facade

- id: office_ring
  location: office
  priority: 3
  when: [mem.true.ring == 1]
  background: office_empty
  portrait: vivian_recognize
  title: Контора
  text: |
    Она снимает перчатку, и ты видишь тонкое кольцо.

    Вспоминается часовня на Канал-стрит: рис на мокрых ступенях, чья-то ладонь в твоей. Ты смотришь на свою руку. Кольца нет. Только светлая полоска на пальце, будто его сняли недавно.
  choices:
    - text: Спросить, где они венчались
      when: [seen.office_chapel == 0]
      free: true
      effects: [seen.office_chapel = 1, clues += 1]
      outcome: |
        — На Канал-стрит. — Пауза. — Откуда вы знаете, что мы венчались?

        Ты не знаешь, откуда ты знаешь.
    - text: Взять деньги и дело
      free: true
      effects: [seen.client_ring = 1]
      goto: facade

- id: facade_night
  location: facade
  background: facade
  title: Белведер-билдинг
  text: |
    Башня торчит над товарной станцией, как чемодан, забытый на перроне. Двенадцать этажей кирпича и чугуна, на крыше красным горит «Займы под залог».

    Дождь в Харроу идёт одиннадцать лет. Он не торопится.
  choices:
    - text: Сосчитать окна, пока стоишь под козырьком
      when: [seen.facade_windows == 0]
      free: true
      effects: [seen.facade_windows = 1]
      outcome: |
        Ты считаешь ряды снизу вверх и сбиваешься где-то наверху. Дождь заливает глаза. Двенадцать, наверное. Должно быть двенадцать.
    - text: Подойти к машине у фонаря
      when: [nights >= 1, seen.facade_car == 0]
      free: true
      effects: [seen.facade_car = 1, suspicion += 1]
      outcome: |
        Стекло опускается на два пальца. Внутри тлеет сигарета и блестит значок.

        — Кэллоуэй? Иди, иди, — говорит сержант Горман. — Я подожду, пока ты найдёшь его за меня.
    - text: Войти через парадную
      free: true
      goto: lobby
