# Пролог: контора Ника и фасад. Всё здесь бесплатно: ночь начинается в вестибюле.
# Варианты конторы выбираются по priority: кольцо > кофе > повтор > первая ночь.

- id: office_return
  location: office
  priority: 1
  when: [nights >= 1]
  background: office_empty
  portrait: vivian
  title: Контора
  text: |
    Половина десятого. Мокрое пальто, трость у стола, конверт с двумя сотнями.

    — Мой муж, Уолтер Хейл…

    Ты знаешь, что она скажет дальше, за секунду до того, как она это говорит. Списываешь на усталость. В этом городе все истории начинаются одинаково.
  choices:
    - text: Закурить и спросить, что он там забыл
      when: [seen.office_smoke == 0, cigarettes >= 1]
      free: true
      effects: [seen.office_smoke = 1, cigarettes -= 1, clues += 1]
      outcome: |
        — Выкупить одну вещь. — Она отвечает раньше, чем ты договариваешь. Потом сама этому удивляется.
    - text: Спросить, мог ли он сбежать с чужими деньгами
      when: [seen.vivian_lie == 0]
      free: true
      effects: [seen.vivian_lie = 1]
      outcome: |
        — Уолтер никогда не брал чужого.

        Ты киваешь. Ты уже слышал эту фразу. Ты уже ей не поверил.
    - text: Взять деньги и дело
      free: true
      effects: [seen.client_return = 1]
      goto: facade

- id: office_coffee
  location: office
  priority: 2
  when: [nights >= 4]
  background: office_empty
  portrait: vivian_tears
  title: Контора
  text: |
    Ты наливаешь ей кофе: две ложки сахара, без молока. Раньше, чем она просит.

    Она смотрит на чашку так, будто ты её ударил. Ты делаешь вид, что не заметил. Вы оба делаете вид уже очень долго.
  choices:
    - text: Спросить, мог ли он сбежать с чужими деньгами
      when: [seen.vivian_lie == 0]
      free: true
      effects: [seen.vivian_lie = 1]
      outcome: |
        — Уолтер никогда… — Она замолкает и смотрит на сахарницу. — Уолтер никогда не брал чужого.
    - text: Взять деньги и дело
      free: true
      effects: [seen.client_coffee = 1]
      goto: facade

- id: office_ring
  location: office
  priority: 3
  when: [mem.true.ring == 1, met.office_ring == 0]
  background: office_empty
  portrait: vivian_recognize
  title: Контора
  text: |
    Половина десятого. Мокрое пальто, трость у стола, тот же конверт. Она снимает перчатку, и ты видишь тонкое кольцо.

    Вспоминается часовня на Канал-стрит: рис на мокрых ступенях, чья-то ладонь в твоей. Ты зачем-то смотришь на свою руку. Просто так. Привычка, которой у тебя вчера не было.
  choices:
    - text: Спросить, где они венчались
      when: [seen.office_chapel == 0]
      free: true
      effects: [seen.office_chapel = 1, clues += 1]
      outcome: |
        — На Канал-стрит. — Пауза. — Откуда вы знаете, что мы венчались?

        Ты не знаешь, откуда ты знаешь.
    - text: Взять деньги и дело
      free: true
      effects: [seen.client_ring = 1, met.office_ring = 1]
      goto: facade

- id: office_ledger
  location: office
  priority: 4
  when: [mem.true.ledger == 1, met.office_ledger == 0]
  background: office_empty
  portrait: vivian
  title: Контора
  text: |
    Половина десятого. Мокрое пальто, трость, конверт на столе.

    Ты пересчитываешь деньги, не глядя, одними пальцами, как кассир в конце смены. Двести. Ты никогда не работал кассиром. Пальцы с тобой не согласны.
  choices:
    - text: Взять деньги и дело
      free: true
      effects: [seen.client_return = 1, met.office_ledger = 1]
      goto: facade

- id: office_cashbox
  location: office
  priority: 5
  when: [mem.true.cashbox == 1, met.office_cashbox == 0]
  background: office_empty
  portrait: vivian_lie
  title: Контора
  text: |
    Половина десятого. Она кладёт на стол конверт и, будто оправдываясь, счёт из больницы Святого Луки: «Операция. Оплачено полностью».

    Ты знаешь сумму раньше, чем видишь её. Четыре тысячи.
  choices:
    - text: Спросить, кто оплатил операцию
      when: [seen.office_hospital == 0]
      free: true
      effects: [seen.office_hospital = 1, clues += 1]
      outcome: |
        — Уолтер. — Она убирает счёт обратно в сумочку. — Он сказал, что занял у друзей. У Уолтера не было таких друзей.
    - text: Взять деньги и дело
      free: true
      effects: [seen.client_cashbox = 1, met.office_cashbox = 1]
      goto: facade

- id: office_lantern
  location: office
  priority: 6
  when: [mem.true.lantern == 1, met.office_lantern == 0]
  background: office_empty
  portrait: vivian_recognize
  title: Контора
  text: |
    Половина десятого. Пока она снимает перчатки, ты насвистываешь что-то медленное, из тех мелодий, под которые в портовых клубах гасят свет.

    Вивиан замирает.

    — Откуда вы знаете эту песню? Её пели только в «Синем фонаре». Уолтер её… — Она не договаривает.
  choices:
    - text: Взять деньги и дело
      free: true
      effects: [seen.client_lantern = 1, met.office_lantern = 1]
      goto: facade

- id: office_hospital
  location: office
  priority: 7
  when: [mem.true.hospital == 1, met.office_hospital == 0]
  background: office_empty
  portrait: vivian_tears
  title: Контора
  text: |
    Половина десятого. Ты видишь, как она садится: сначала трость, потом левая рука на стол, правое бедро бережёт.

    Ты знаешь, где под платьем шов. Знаешь, сколько в нём стежков. Ты стоял в коридоре, пока его накладывали.

    — Вам нехорошо, мистер Кэллоуэй?
  choices:
    - text: Взять деньги и дело
      free: true
      effects: [seen.client_hospital = 1, met.office_hospital = 1]
      goto: facade

- id: office_voice
  location: office
  priority: 8
  when: [mem.true.voice == 1, met.office_voice == 0]
  background: office_empty
  portrait: vivian
  title: Контора
  text: |
    — Мистер Кэллоуэй?

    Она зовёт второй раз. В первый раз ты не обернулся: тебе послышалось другое имя. Короче. Мягче. Сказанное так, как говорят дома.
  choices:
    - text: Взять деньги и дело
      free: true
      effects: [seen.client_voice = 1, met.office_voice = 1]
      goto: facade

- id: facade_night
  location: facade
  background: facade
  title: Белведер-билдинг
  text: |
    Башня торчит над товарной станцией, как чемодан, забытый на перроне. Двенадцать этажей кирпича и чугуна, на крыше красным горит «Займы под залог».

    Дождь в Харроу идёт одиннадцать лет. Он не торопится.
  choices:
    - text: Сосчитать окна ещё раз
      when: [paths.thirteen == 1, seen.facade_windows == 0]
      free: true
      effects: [seen.facade_windows = 1]
      outcome: |
        Ты встаёшь под фонарь и считаешь медленно, загибая пальцы. Двенадцать рядов светлых окон. И над ними, под самой вывеской, ещё один ряд — тёмный, без единого огня.

        Тринадцать.
    - text: Сосчитать окна, пока стоишь под козырьком
      when: [paths.thirteen == 0, seen.facade_windows == 0]
      free: true
      effects: [seen.facade_windows = 1]
      outcome: |
        Ты считаешь ряды снизу вверх и сбиваешься где-то наверху. Дождь заливает глаза. Двенадцать, наверное. Должно быть двенадцать.
    - text: Подойти к машине у фонаря
      when: [nights >= 1, seen.facade_car == 0]
      free: true
      effects: [seen.facade_car = 1, suspicion += 1, met.gorman = 1]
      outcome: |
        Стекло опускается на два пальца. Внутри тлеет сигарета и блестит значок.

        — Кэллоуэй? Иди, иди, — говорит сержант Горман. — Я подожду, пока ты найдёшь его за меня.
    - text: Войти через парадную
      free: true
      goto: lobby
