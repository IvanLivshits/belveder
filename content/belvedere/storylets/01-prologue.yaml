# Пролог (v2, реплики): контора Ника и фасад. Всё бесплатно, ночь начинается в вестибюле.
# Варианты конторы по priority: вернувшиеся воспоминания > кофе > повтор.
# Вещи Хейла (бирка, коробок, записка) кладутся в карман движком: rules.onNightStart.

- id: office_return
  location: office
  priority: 1
  when: [nights >= 1]
  background: office_empty
  portrait: vivian
  title: Контора
  lines:
    - { who: narrator, text: "Половина десятого. Мокрое пальто, трость у стола, конверт с двумя сотнями." }
    - { who: vivian, text: "Мой муж, Уолтер Хейл…" }
    - { who: gut, text: "Ты знаешь, что она скажет. Может, это ты каждый вечер её не помнишь." }
    - { who: narrator, text: "Бирка, коробок спичек, клочок бумаги. Те же, что вчера." }
  choices:
    - do: Закурить и спросить, что он там забыл
      when: [seen.office_smoke == 0, cigarettes >= 1]
      free: true
      effects: [seen.office_smoke = 1, cigarettes -= 1, clues += 1]
      reply:
        - { who: vivian, text: "Выкупить одну вещь." }
        - { who: narrator, text: "Она отвечает раньше, чем ты договорил. Потом сама этому удивляется." }
    - say: Мог он сбежать с чужими деньгами?
      when: [seen.vivian_lie == 0]
      free: true
      effects: [seen.vivian_lie = 1]
      reply:
        - { who: vivian, text: "Уолтер никогда не брал чужого." }
        - { who: gut, text: "Ты уже слышал эту фразу. Ты уже ей не поверил." }
    - do: Взять деньги и дело
      free: true
      effects: [seen.client_return = 1]
      goto: facade

- id: office_coffee
  location: office
  priority: 2
  when: [nights >= 4]
  background: office_empty
  portrait: vivian_tears
  title: Контора
  lines:
    - { who: narrator, text: "Ты наливаешь ей кофе: две ложки сахара, без молока. Раньше, чем она просит." }
    - { who: narrator, text: "Она смотрит на чашку так, будто ты её ударил." }
    - { who: gut, text: "Вы оба делаете вид. Уже очень долго." }
  choices:
    - say: Мог он сбежать с чужими деньгами?
      when: [seen.vivian_lie == 0]
      free: true
      effects: [seen.vivian_lie = 1]
      reply:
        - { who: vivian, text: "Уолтер никогда… Уолтер никогда не брал чужого." }
        - { who: narrator, text: "Она смотрит на сахарницу." }
    - do: Взять деньги и дело
      free: true
      effects: [seen.client_coffee = 1]
      goto: facade

- id: office_ring
  location: office
  priority: 3
  when: [mem.true.ring == 1, met.office_ring == 0]
  background: office_empty
  portrait: vivian_recognize
  title: Контора
  lines:
    - { who: narrator, text: "Половина десятого. Она снимает перчатку. Тонкое кольцо." }
    - { who: gut, text: "Часовня на Канал-стрит. Рис на мокрых ступенях. Чья-то ладонь в твоей." }
    - { who: narrator, text: "Ты зачем-то смотришь на свою руку. Привычка, которой вчера не было." }
  choices:
    - say: Где вы венчались?
      when: [seen.office_chapel == 0]
      free: true
      effects: [seen.office_chapel = 1, clues += 1]
      reply:
        - { who: vivian, text: "На Канал-стрит. Откуда вы знаете, что мы венчались?" }
        - { who: gut, text: "Ты не знаешь, откуда ты знаешь." }
    - do: Взять деньги и дело
      free: true
      effects: [seen.client_ring = 1, met.office_ring = 1]
      goto: facade

- id: office_ledger
  location: office
  priority: 4
  when: [mem.true.ledger == 1, met.office_ledger == 0]
  background: office_empty
  portrait: vivian
  title: Контора
  lines:
    - { who: narrator, text: "Ты пересчитываешь деньги не глядя, одними пальцами, как кассир в конце смены." }
    - { who: gut, text: "Двести. Ты никогда не работал кассиром. Пальцы с тобой не согласны." }
  choices:
    - do: Взять деньги и дело
      free: true
      effects: [seen.client_return = 1, met.office_ledger = 1]
      goto: facade

- id: office_cashbox
  location: office
  priority: 5
  when: [mem.true.cashbox == 1, met.office_cashbox == 0]
  background: office_empty
  portrait: vivian_lie
  title: Контора
  lines:
    - { who: narrator, text: "Рядом с конвертом она кладёт счёт из больницы Святого Луки: «Операция. Оплачено полностью»." }
    - { who: gut, text: "Четыре тысячи. Ты знаешь сумму раньше, чем видишь её." }
  choices:
    - say: Кто оплатил операцию?
      when: [seen.office_hospital == 0]
      free: true
      effects: [seen.office_hospital = 1, clues += 1]
      reply:
        - { who: vivian, text: "Уолтер. Сказал, что занял у друзей." }
        - { who: vivian, text: "У Уолтера не было таких друзей." }
    - do: Взять деньги и дело
      free: true
      effects: [seen.client_cashbox = 1, met.office_cashbox = 1]
      goto: facade

- id: office_lantern
  location: office
  priority: 6
  when: [mem.true.lantern == 1, met.office_lantern == 0]
  background: office_empty
  portrait: vivian_recognize
  title: Контора
  lines:
    - { who: narrator, text: "Пока она снимает перчатки, ты насвистываешь что-то медленное, портовое." }
    - { who: vivian, text: "Откуда вы знаете эту песню? Её пели только в «Синем фонаре»." }
    - { who: vivian, text: "Уолтер её…" }
  choices:
    - do: Взять деньги и дело
      free: true
      effects: [seen.client_lantern = 1, met.office_lantern = 1]
      goto: facade

- id: office_hospital
  location: office
  priority: 7
  when: [mem.true.hospital == 1, met.office_hospital == 0]
  background: office_empty
  portrait: vivian_tears
  title: Контора
  lines:
    - { who: narrator, text: "Она садится: сначала трость, потом левая рука на стол. Правое бедро бережёт." }
    - { who: gut, text: "Ты знаешь, где шов. Сколько в нём стежков. Ты стоял в том коридоре." }
    - { who: vivian, text: "Вам нехорошо, мистер Кэллоуэй?" }
  choices:
    - do: Взять деньги и дело
      free: true
      effects: [seen.client_hospital = 1, met.office_hospital = 1]
      goto: facade

- id: office_voice
  location: office
  priority: 8
  when: [mem.true.voice == 1, met.office_voice == 0]
  background: office_empty
  portrait: vivian
  title: Контора
  lines:
    - { who: vivian, text: "Мистер Кэллоуэй?" }
    - { who: narrator, text: "Она зовёт второй раз. В первый ты не обернулся." }
    - { who: gut, text: "Послышалось другое имя. Короче. Мягче. Сказанное так, как говорят дома." }
  choices:
    - do: Взять деньги и дело
      free: true
      effects: [seen.client_voice = 1, met.office_voice = 1]
      goto: facade

- id: office_name
  location: office
  priority: 9
  when: [mem.true.name == 1, met.office_name == 0]
  background: office_empty
  portrait: vivian_recognize
  title: Контора
  lines:
    - { who: narrator, text: "Она входит, и ты говоришь раньше, чем успеваешь подумать." }
    - { who: nick, text: "Здравствуй, Ви." }
    - { who: narrator, text: "Трость падает. Вивиан не нагибается за ней." }
  choices:
    - do: Поднять трость и взять дело
      free: true
      effects: [seen.client_name = 1, met.office_name = 1]
      goto: facade

- id: office_secret
  location: office
  priority: 10
  when: [mem.true.secret == 1, met.office_secret == 0]
  background: office_empty
  portrait: vivian_tears
  title: Контора
  lines:
    - { who: narrator, text: "Мокрое пальто, трость, конверт." }
    - { who: gut, text: "Ты знаешь, что она сделала той ночью. Она не знает, что сделала." }
    - { who: narrator, text: "Ты наливаешь ей кофе и не можешь поднять глаз." }
  choices:
    - do: Взять деньги и дело
      free: true
      effects: [seen.client_secret = 1, met.office_secret = 1]
      goto: facade

- id: facade_night
  location: facade
  background: facade
  title: Белведер-билдинг
  lines:
    - { who: narrator, text: "Башня над товарной станцией. На крыше красным: «Займы под залог»." }
    - { who: narrator, text: "Дождь в Харроу идёт одиннадцать лет. Он не торопится." }
  choices:
    - do: Сосчитать окна ещё раз
      when: [paths.thirteen == 1, seen.facade_windows == 0]
      free: true
      effects: [seen.facade_windows = 1]
      reply:
        - { who: narrator, text: "Двенадцать рядов светлых окон. И над ними, под самой вывеской, ещё один — тёмный." }
        - { who: gut, text: "Тринадцать." }
    - do: Сосчитать окна
      when: [paths.thirteen == 0, seen.facade_windows == 0]
      free: true
      effects: [seen.facade_windows = 1]
      reply:
        - { who: narrator, text: "Ты сбиваешься где-то наверху. Дождь заливает глаза." }
        - { who: gut, text: "Двенадцать, наверное. Должно быть двенадцать." }
    - do: Подойти к машине у фонаря
      when: [nights >= 1, seen.facade_car == 0, rumor.gorman_inside == 0]
      free: true
      effects: [seen.facade_car = 1, suspicion += 1, met.gorman = 1]
      reply:
        - { who: narrator, text: "Стекло опускается на два пальца. Тлеет сигарета, блестит значок." }
        - { who: gorman, text: "Кэллоуэй? Иди, иди. Я подожду, пока ты найдёшь его за меня." }
    - do: Войти
      free: true
      goto: lobby
