# Вестибюль: Долли у лифта. Доверие Долли живёт между ночами.
- id: lobby_dolly_wary
  location: lobby
  when: [seen.lobby == 0, dolly_trust < 2]
  background: lobby
  portrait: dolly_suspicion
  title: Вестибюль
  text: |
    Долли сидит у лифта так, будто лифт её собственность. Прищур, карандаш за ухом.
    «Жильцов не беспокоить. Посетителей не бывает. Вы кто из этих двух?»
  choices:
    - text: Показать визитку клиентки
      effects: [seen.lobby = 1, dolly_trust += 1]
      goto: floor_01
    - text: Угостить сигаретой
      when: [cigarettes >= 1]
      effects: [seen.lobby = 1, cigarettes -= 1, dolly_trust += 1]
      goto: floor_01
    - text: Пройти мимо, не отвечая
      effects: [seen.lobby = 1, suspicion += 2]
      goto: floor_01

- id: lobby_dolly_trusting
  location: lobby
  priority: 1
  when: [seen.lobby == 0, dolly_trust >= 2]
  background: lobby
  portrait: dolly_trust
  title: Вестибюль
  text: |
    Долли кивает прежде, чем вы открываете рот. Карандаш указывает на лифт.
    «Грузовой работает до трёх. Потом ключ у Гормана, а Гормана лучше не будить».
  choices:
    - text: Спросить, как попасть на грузовой лифт
      effects: [seen.lobby = 1, paths.freight_lift = 1]
      goto: floor_01
    - text: Спросить о клиентке
      effects: [seen.lobby = 1, clues += 1, dolly_trust += 1]
      goto: floor_01
    - text: Кивнуть и подняться
      effects: [seen.lobby = 1]
      goto: floor_01

- id: lobby_again
  location: lobby
  when: [seen.lobby == 1]
  background: lobby
  portrait: dolly_worry
  title: Вестибюль
  text: |
    Долли смотрит на лифт, в котором горит свет, хотя лифт стоит.
    «Вы бы шли уже. Вверх или наружу, но шли».
  choices:
    - text: Наверх
      goto: floor_01
    - text: Наружу, в хранилище залогов
      free: true
      goto: pledge
