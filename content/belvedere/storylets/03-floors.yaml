# Экраны трёх дверей. Порядок: дверь жильца, служебная дверь, лестница.
# Войти в дверь = 1 ход. Выйти на лестницу и вернуться на площадку бесплатно,
# пролёт вверх или вниз = 1 ход.

- id: floor_01_doors
  location: floor_01
  layout: doors
  background: landing_base
  title: Площадка 1
  text: |
    Слева стеклянная будка Долли и мёртвая шахта лифта. Справа стена латунных почтовых ящиков. Лестница уходит вверх, пахнет мокрым деревом.
  choices:
    - text: Долли
      free: true
      effects: [visited.floor1.tenant += 1, floor = 1]
      goto: lobby
    - text: Почтовые ящики
      effects: [visited.floor1.service += 1, floor = 1]
      goto: mailboxes
    - text: Лестница
      free: true
      effects: [floor = 1]
      goto: stairwell

- id: floor_02_doors
  location: floor_02
  layout: doors
  background: landing_02
  title: Площадка 2
  text: |
    Пар ползёт из-под двери прачечной и оседает на перилах. В стене гудит труба пневмопочты: кто-то наверху опять пишет записки. На служебной двери выцветшее «Бельё».
  choices:
    - text: Прачечная
      when: [suspicion < 5]
      effects: [visited.floor2.tenant += 1, floor = 2]
      goto: tenant_02
    - text: Бельё
      when: [paths.laundry_chute == 1]
      free: true
      effects: [visited.floor2.service += 1, floor = 2]
      goto: chute
    - text: Лестница
      free: true
      effects: [floor = 2]
      goto: stairwell

- id: floor_03_doors
  location: floor_03
  layout: doors
  background: landing_03
  title: Площадка 3
  text: |
    У двери миссис Пул стоят мужские ботинки, начищенные до блеска. Их никто не носит. Служебная дверь без таблички. Говорят, за ней по утрам просыпаются новые жильцы.
  choices:
    - text: Квартира миссис Пул
      when: [suspicion < 5]
      effects: [visited.floor3.tenant += 1, floor = 3]
      goto: tenant_03
    - text: Служебная дверь
      effects: [visited.floor3.service += 1, floor = 3]
      goto: service_03
    - text: Лестница
      free: true
      effects: [floor = 3]
      goto: stairwell

- id: floor_04_doors
  location: floor_04
  layout: doors
  background: landing_04
  title: Площадка 4
  text: |
    Из-под двери аудитора зелёный свет настольной лампы. На служебной двери новый медный замок, ещё не потемневший. Пролёт наверх перегорожен козлами с табличкой «Ремонт».
  choices:
    - text: Кабинет аудитора
      when: [suspicion < 5]
      effects: [visited.floor4.tenant += 1, floor = 4, seen.sloan_met = 1]
      goto: tenant_04
    - text: Служебная дверь
      effects: [visited.floor4.service += 1, floor = 4]
      goto: service_04
    - text: Лестница
      free: true
      effects: [floor = 4]
      goto: stairwell

# Лестница. Одна локация на все этажи, выбор зависит от floor.
# Встречи (Горман, Эдди) перехватывают лестницу по priority и после выбора
# уступают место обычной карточке: их флаг seen.* уже стоит.

# Горман берёт за воротник: Подозрение 7+. Отсюда реально дойти до поимки (10).
- id: stairs_gorman_collar
  location: stairwell
  priority: 9
  when: [suspicion >= 7, seen.gorman_collar == 0]
  background: stairwell
  portrait: gorman_threat
  title: Лестница
  text: |
    Горман выходит из-за поворота пролёта, будто стоял там всю ночь. Берёт тебя за лацкан, не сильно, по-хозяйски.

    — Весь дом про тебя шепчется, Кэллоуэй. Мне это надоело раньше, чем дому.
  choices:
    - text: Откупиться двумя сигаретами
      when: [cigarettes >= 2]
      effects: [seen.gorman_collar = 1, cigarettes -= 2, suspicion -= 2]
      outcome: |
        Горман берёт обе, одну прячет за ухо.

        — Ещё раз услышу твою фамилию до рассвета — отдам тебя Тони.
    - text: Вырваться и уйти вниз
      effects: [seen.gorman_collar = 1, suspicion += 3]
      outcome: |
        Ты вырываешься, оставляя у него в кулаке пуговицу, и слышишь за спиной его смех. Он не бежит следом. Ему некуда торопиться: из этого дома выходят только через вестибюль.
    - text: Дать себя увести
      effects: [seen.gorman_collar = 1, suspicion = 10]
      outcome: |
        Горман ведёт тебя вниз, держа за лацкан, как ведут пьяного. Пролётом ниже его молча сменяет Тони Риццо.

- id: stairs_gorman_again
  location: stairwell
  priority: 7
  when: [suspicion >= 4, seen.gorman == 0, seen.facade_car == 1]
  background: stairwell
  portrait: gorman_threat
  title: Лестница
  text: |
    Горман всё-таки вылез из машины. Стоит на пролёте, курит и не прячет сигарету.

    — Я же сказал, что подожду, Кэллоуэй. Ждать надоело. Ты ищешь Хейла, я тоже. Только тебе за это платят, а я за это плачу. — Пауза. — Аудитор у себя?
  choices:
    - text: Угостить сигаретой
      when: [cigarettes >= 1]
      effects: [seen.gorman = 1, met.gorman = 1, cigarettes -= 1, suspicion -= 1]
      outcome: |
        Горман берёт сигарету, прикуривает от своей и выбрасывает свою в пролёт.

        — Хорошие. Хейл курил такие же.
    - text: Спросить, почему он платит
      effects: [seen.gorman = 1, met.gorman = 1, seen.gorman_debt = 1, clues += 1]
      outcome: |
        — Клуб «Синий фонарь» недосчитался четырёх тысяч. Ордер на Хейла выписан, а Хейла нет. Долг клубу теперь на мне. — Он улыбается без страха, как человек, которому нечего бояться. — Так что найди его, Кэллоуэй. Или я найду, кем его заменить.
    - text: Сказать, что аудитора нет
      when: [seen.sloan_met == 1]
      effects: [seen.gorman = 1, met.gorman = 1, debt.sloan += 1, suspicion += 1]
      outcome: |
        — Никого, — повторяет Горман. — Даже бухгалтера. Ладно.

        Он не верит. Но наверх не идёт.


- id: stairs_gorman
  location: stairwell
  priority: 6
  when: [suspicion >= 4, seen.gorman == 0]
  background: stairwell
  portrait: gorman_threat
  title: Лестница
  text: |
    На пролёте курит человек в мокром плаще, значок на лацкане. Он не прячет сигарету, когда видит тебя.

    — Сержант Горман. Кэллоуэй, верно? Ты ищешь Хейла. Я тоже. Разница в том, что тебе за это платят, а я за это плачу. — Пауза. — Аудитор у себя?
  choices:
    - text: Угостить сигаретой
      when: [cigarettes >= 1]
      effects: [seen.gorman = 1, met.gorman = 1, cigarettes -= 1, suspicion -= 1]
      outcome: |
        Горман берёт сигарету, прикуривает от своей и выбрасывает свою в пролёт.

        — Хорошие. Хейл курил такие же.
    - text: Спросить, почему он платит
      effects: [seen.gorman = 1, met.gorman = 1, seen.gorman_debt = 1, clues += 1]
      outcome: |
        — Клуб «Синий фонарь» недосчитался четырёх тысяч. Ордер на Хейла выписан, а Хейла нет. Долг клубу теперь на мне. — Он улыбается без страха, как человек, которому нечего бояться. — Так что найди его, Кэллоуэй. Или я найду, кем его заменить.
    - text: Сказать, что аудитора нет
      when: [seen.sloan_met == 1]
      effects: [seen.gorman = 1, met.gorman = 1, debt.sloan += 1, suspicion += 1]
      outcome: |
        — Никого, — повторяет Горман. — Даже бухгалтера. Ладно.

        Он не верит. Но наверх не идёт.

- id: stairs_eddie_again
  location: stairwell
  priority: 5
  when: [turn >= 3, seen.eddie == 0, met.eddie == 1]
  background: stairwell
  portrait: eddie_scared
  title: Лестница
  text: |
    Эдди. Опять бежит, опять с цилиндром, опять едва не сбивает тебя с ног. Останавливается, морщит лоб.

    — Мистер, мы знакомы? — Пауза. — Нет. Показалось. У вас просто лицо такое.
  choices:
    - text: Дать сигарету и спросить, кому записка
      when: [cigarettes >= 1]
      effects: [seen.eddie = 1, met.eddie = 1, cigarettes -= 1, has.owner_note = 1, clues += 1]
      outcome: |
        Эдди прячет сигарету за ухо, к карандашу, и косится на лестницу.

        — Наверх. Всегда наверх. — Он суёт тебе листок. — Я ничего не давал. Вы сами прочитали.

        «Детектив поднимется. Не мешать. Ему нужно дойти самому. — В.»
    - text: Выхватить цилиндр
      effects: [seen.eddie = 1, met.eddie = 1, seen.eddie_hostile = 1, suspicion += 2, has.owner_note = 1, clues += 1]
      outcome: |
        Крышка поддаётся с третьего раза. «Детектив поднимется. Не мешать. Ему нужно дойти самому. — В.»

        Эдди смотрит на тебя так, будто ты отобрал у него не записку, а билет на поезд.
    - text: Отпустить
      effects: [seen.eddie = 1, met.eddie = 1, debt.eddie += 1]
      outcome: |
        Эдди уже двумя пролётами ниже. Оттуда:

        — Спасибо, мистер! Я запомню!


