# Площадки 1–4, лестница v2 и встречи по пути.
# Войти в дверь = 1 ход. Выйти на лестницу и вернуться на площадку бесплатно.
# Скрепку на двери движок ставит сам, если открытая зацепка ведёт в эту локацию (leads.target).

- id: floor_01_doors
  location: floor_01
  layout: doors
  background: landing_base
  title: Площадка 1
  lines:
    - { who: narrator, text: "Будка Долли, мёртвая шахта лифта, стена латунных почтовых ящиков." }
  choices:
    - text: Долли
      free: true
      effects: [visited.floor1.tenant += 1, floor = 1]
      goto: lobby
    - text: Почтовые ящики
      effects: [visited.floor1.service += 1, floor = 1]
      goto: mailboxes
    - text: Лестница
      free: true
      effects: [floor = 1]
      goto: stairwell

- id: floor_02_doors
  location: floor_02
  layout: doors
  background: landing_02
  title: Площадка 2
  lines:
    - { who: narrator, text: "Пар из-под двери прачечной оседает на перилах. В стене гудит труба пневмопочты." }
  choices:
    - text: Прачечная
      when: [suspicion < 5]
      effects: [visited.floor2.tenant += 1, floor = 2]
      goto: tenant_02
    - text: Бельё
      when: [paths.laundry_chute == 1]
      free: true
      effects: [visited.floor2.service += 1, floor = 2]
      goto: chute
    - text: Лестница
      free: true
      effects: [floor = 2]
      goto: stairwell

- id: floor_03_doors
  location: floor_03
  layout: doors
  background: landing_03
  title: Площадка 3
  lines:
    - { who: narrator, text: "У двери миссис Пул мужские ботинки, начищенные до блеска. Их никто не носит." }
    - { who: gut, text: "Перила сухие. На улице льёт, а перила сухие.", when: [nights >= 1] }
  choices:
    - text: Квартира миссис Пул
      when: [suspicion < 5]
      effects: [visited.floor3.tenant += 1, floor = 3]
      goto: tenant_03
    - text: Комната 3-В
      when: [knows.room == 1]
      effects: [visited.floor3.service += 1, floor = 3, seen.room_open = 1]
      goto: service_03
    - text: Служебная дверь
      when: [knows.room == 0]
      effects: [visited.floor3.service += 1, floor = 3]
      goto: service_03
    - text: Лестница
      free: true
      effects: [floor = 3]
      goto: stairwell

- id: floor_04_doors
  location: floor_04
  layout: doors
  background: landing_04
  title: Площадка 4
  lines:
    - { who: narrator, text: "Из-под двери аудитора зелёный свет. На служебной двери новый медный замок." }
    - { who: narrator, text: "Служебная дверь приоткрыта. Внутри темно.", when: [rumor.sloan_lamp == 1] }
  choices:
    - text: Кабинет аудитора
      when: [suspicion < 5]
      effects: [visited.floor4.tenant += 1, floor = 4, seen.sloan_met = 1]
      goto: tenant_04
    - text: Архив
      effects: [visited.floor4.service += 1, floor = 4]
      goto: service_04
    - text: Лестница
      free: true
      effects: [floor = 4]
      goto: stairwell

# ── Лестница v2: один экран. Кнопки этажей и «Обратно на площадку» рисует движок
# по world.yaml → stairs. Здесь только текст.
- id: stairs
  location: stairwell
  layout: stairs
  background: stairwell_up
  title: Лестница
  lines:
    - { who: narrator, text: "Ступени скрипят заранее, будто предупреждают кого-то наверху." }
    - { who: narrator, text: "Лампы мигают. Идёшь на ощупь.", when: [rumor.lights == 1] }
  choices: []

# ── Встречи по пути (location: stairs_event). floors: [от, до] — где на пути случается встреча.
# Выбор без goto — Ник идёт дальше, на целевой этаж.

# Горман берёт за воротник: Подозрение 7+.
- id: stairs_gorman_collar
  location: stairs_event
  priority: 9
  when: [suspicion >= 7, seen.gorman_collar == 0]
  background: stairwell
  portrait: gorman_threat
  title: Лестница
  lines:
    - { who: narrator, text: "Горман выходит из-за поворота и берёт тебя за лацкан. Не сильно, по-хозяйски." }
    - { who: gorman, text: "Весь дом про тебя шепчется, Кэллоуэй. Мне это надоело раньше, чем дому." }
  choices:
    - do: Откупиться двумя сигаретами
      when: [cigarettes >= 2]
      effects: [seen.gorman_collar = 1, cigarettes -= 2, suspicion -= 2]
      reply:
        - { who: gorman, text: "Ещё раз услышу твою фамилию до рассвета — отдам тебя Тони." }
    - do: Вырваться
      effects: [seen.gorman_collar = 1, suspicion += 3]
      reply:
        - { who: narrator, text: "У него в кулаке остаётся пуговица. Он не бежит следом." }
        - { who: gut, text: "Ему некуда торопиться. Выход тут один — через Долли." }
    - do: Дать себя увести
      effects: [seen.gorman_collar = 1, suspicion = 10]
      reply:
        - { who: narrator, text: "Горман ведёт тебя вниз, как пьяного. Пролётом ниже его молча сменяет Тони Риццо." }

# Горман: при Подозрении 4+ или по слуху gorman_inside. Два сторилета с одинаковыми выборами.
- id: stairs_gorman
  location: stairs_event
  priority: 6
  when: [suspicion >= 4, seen.gorman == 0]
  background: stairwell
  portrait: gorman_threat
  title: Лестница
  lines:
    - { who: narrator, text: "На пролёте курит человек в мокром плаще. Значок на лацкане." }
    - { who: gorman, text: "Сержант Горман. А ты Кэллоуэй.", when: [seen.facade_car == 0] }
    - { who: gorman, text: "Я же сказал, что подожду. Ждать надоело.", when: [seen.facade_car == 1] }
    - { who: gorman, text: "Ты ищешь Хейла, я тоже. Аудитор у себя?" }
  choices:
    - do: Угостить сигаретой
      when: [cigarettes >= 1]
      effects: [seen.gorman = 1, met.gorman = 1, cigarettes -= 1, suspicion -= 1]
      reply:
        - { who: gorman, text: "Хорошие. Хейл курил такие же." }
    - say: Почему вы его ищете?
      effects: [seen.gorman = 1, met.gorman = 1, seen.gorman_debt = 1, knows.shortage = 1, clues += 1]
      reply:
        - { who: gorman, text: "«Синий фонарь» недосчитался четырёх тысяч. Ордер на Хейла есть, Хейла нет." }
        - { who: gorman, text: "Долг клубу теперь на мне. Найди его. Или я найду, кем его заменить." }
    - say: Аудитора нет
      when: [met.sloan == 1]
      effects: [seen.gorman = 1, met.gorman = 1, seen.covered_sloan = 1, debt.sloan += 1, suspicion += 1]
      reply:
        - { who: gorman, text: "Никого. Даже бухгалтера. Ладно." }
        - { who: narrator, text: "Он не верит. Но наверх не идёт." }

- id: stairs_gorman_rumor
  location: stairs_event
  priority: 7
  when: [rumor.gorman_inside == 1, seen.gorman == 0]
  background: stairwell
  portrait: gorman_threat
  title: Лестница
  lines:
    - { who: narrator, text: "Горман сидит на ступеньке, как дома. Сигарета, значок, мокрый плащ." }
    - { who: gorman, text: "Долли тебе сказала, что я внутри? Она всем говорит. Аудитор у себя?" }
  choices:
    - do: Угостить сигаретой
      when: [cigarettes >= 1]
      effects: [seen.gorman = 1, met.gorman = 1, cigarettes -= 1, suspicion -= 1]
      reply:
        - { who: gorman, text: "Хорошие. Хейл курил такие же." }
    - say: Почему вы его ищете?
      effects: [seen.gorman = 1, met.gorman = 1, seen.gorman_debt = 1, knows.shortage = 1, clues += 1]
      reply:
        - { who: gorman, text: "«Синий фонарь» недосчитался четырёх тысяч. Ордер на Хейла есть, Хейла нет." }
        - { who: gorman, text: "Долг клубу теперь на мне. Найди его. Или я найду, кем его заменить." }
    - say: Аудитора нет
      when: [met.sloan == 1]
      effects: [seen.gorman = 1, met.gorman = 1, seen.covered_sloan = 1, debt.sloan += 1, suspicion += 1]
      reply:
        - { who: gorman, text: "Никого. Даже бухгалтера. Ладно." }
        - { who: narrator, text: "Он не верит. Но наверх не идёт." }

# Эдди бежит с цилиндром наверх. Только выше второго (на втором он в прачечной)
# и не в ночь, когда он «не в духе».
- id: stairs_eddie
  location: stairs_event
  priority: 4
  floors: [4, 12]
  when: [turn >= 3, seen.eddie == 0, rumor.eddie_blue == 0]
  background: stairwell
  portrait: eddie_scared
  title: Лестница
  lines:
    - { who: narrator, text: "Мальчишка в кепке курьера едва не сбивает тебя с ног. Из кармана торчит цилиндр с печатью «В»." }
    - { who: eddie, text: "Мистер, мы знакомы? Нет. Показалось. Лицо у вас такое.", when: [met.eddie == 1] }
  choices:
    - do: Дать сигарету и спросить, кому записка
      when: [cigarettes >= 1]
      effects: [seen.eddie = 1, seen.eddie_ran = 1, met.eddie = 1, cigarettes -= 1, has.owner_note = 1, clues += 1]
      reply:
        - { who: eddie, text: "Наверх. Всегда наверх. Я ничего не давал, вы сами прочитали." }
        - { who: narrator, text: "«Детектив поднимется. Не мешать. Ему нужно дойти самому. — В.»" }
    - do: Выхватить цилиндр
      effects: [seen.eddie = 1, seen.eddie_ran = 1, met.eddie = 1, seen.eddie_hostile = 1, suspicion += 2, has.owner_note = 1, clues += 1]
      reply:
        - { who: narrator, text: "«Детектив поднимется. Не мешать. Ему нужно дойти самому. — В.»" }
        - { who: gut, text: "Он смотрит так, будто ты отнял билет на поезд." }
    - do: Отпустить
      effects: [seen.eddie = 1, seen.eddie_ran = 1, met.eddie = 1, debt.eddie += 1]
      reply:
        - { who: eddie, text: "Спасибо, мистер! Я запомню!" }

# Дилемма: в ночь пирога миссис Пул зовёт к столу, когда Ник проходит третий.
- id: stairs_pool_pie
  location: stairs_event
  priority: 5
  floors: [3, 3]
  when: [rumor.pool_pie == 1, seen.pool_invited == 0]
  background: landing_03
  portrait: pool
  title: Третий этаж
  lines:
    - { who: narrator, text: "На третьем открывается дверь. Пахнет корицей." }
    - { who: pool, text: "Мистер! Пирог как раз из печи. Я поставила вторую тарелку." }
    - { who: gut, text: "Ужин у неё — час, не меньше. А Долли просила зайти.", when: [seen.dolly_ask == 1, turn <= 5] }
  choices:
    - say: Иду
      effects: [seen.pool_invited = 1, floor = 3]
      goto: tenant_03
    - say: Меня ждут внизу
      free: true
      effects: [seen.pool_invited = 1, seen.pool_declined = 1]
      reply:
        - { who: pool, text: "Он тоже всегда торопился. Всегда кто-то ждал внизу." }

# На двенадцатом выше лестницы нет. Один раз.
- id: stairs_chalk
  location: stairs_event
  priority: 1
  floors: [12, 12]
  when: [seen.stairs_chalk == 0]
  background: stairwell
  title: Лестница
  lines:
    - { who: narrator, text: "Выше двенадцатого ступени упираются в свежую кладку. На кирпиче мелом: «13»." }
  choices:
    - do: Пойти дальше
      free: true
      effects: [seen.stairs_chalk = 1]

# Желоб: только вниз, в подвал к Сайласу. Ход не тратится.
- id: chute_peek
  location: chute
  background: landing_02
  title: Бельевой желоб
  lines:
    - { who: narrator, text: "Снизу тянет теплом и угольной гарью. Где-то глубоко гудит топка и кто-то поёт без слов." }
    - { who: gut, text: "Вниз — за секунду. Обратно — только пешком." }
  choices:
    - do: Прыгнуть
      free: true
      effects: [floor = 0]
      reply:
        - { who: narrator, text: "Темнота, запах мыла и угля, удар о гору мешков. Ты лежишь в подвале и смотришь на огонь." }
      goto: basement
    - do: Закрыть заслонку
      free: true
      goto: floor_02
