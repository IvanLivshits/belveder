# Лестница: тексты по высоте, выборы зависят от floor.
# С 11-го на 12-й решётка: нужен пропуск Корделии или часовой ключ Фенна.
- id: stairs_top
  location: stairwell
  priority: 1
  when: [floor == 12]
  background: stairwell
  title: Лестница
  text: |
    Выше двенадцатого лестницы нет. Ступени упираются в кирпичную кладку, свежую, будто проём заложили вчера. На кирпиче мелом: «13».
  choices:
    - text: Вниз, на одиннадцатый
      when: [floor == 12]
      effects: [floor = 11]
      goto: floor_11
    - text: Обратно на площадку
      when: [floor == 12]
      free: true
      goto: floor_12

- id: stairs_grate
  location: stairwell
  priority: 1
  when: [floor == 11]
  background: stairwell
  title: Лестница
  text: |
    Пролёт на двенадцатый перекрыт кованой решёткой. На замке гравировка: «Только по приглашению». Сквозь прутья видно ковровую дорожку и полоску жёлтого света под дверью.
  choices:
    - text: Вверх, на двенадцатый (пропуск)
      when: [floor == 11, has.cordelia_pass == 1]
      effects: [floor = 12]
      goto: floor_12
    - text: Вверх, на двенадцатый (часовой ключ)
      when: [floor == 11, has.cordelia_pass == 0, has.clock_key == 1]
      effects: [floor = 12]
      goto: floor_12
    - text: Вниз, на десятый
      when: [floor == 11]
      effects: [floor = 10]
      goto: floor_10
    - text: Обратно на площадку
      when: [floor == 11]
      free: true
      goto: floor_11

- id: stairs_upper
  location: stairwell
  priority: 1
  when: [floor >= 5, floor <= 10]
  background: stairwell_up
  title: Лестница
  text: |
    Чем выше, тем суше ступени и тем дороже ковровая дорожка. Пахнет лаком, канифолью и больницей. Где-то наверху бубнит радио.
  choices:
    - text: Вверх, на шестой
      when: [floor == 5]
      effects: [floor = 6]
      goto: floor_06
    - text: Вниз, на четвёртый
      when: [floor == 5]
      effects: [floor = 4]
      goto: floor_04
    - text: Обратно на площадку
      when: [floor == 5]
      free: true
      goto: floor_05
    - text: Вверх, на седьмой
      when: [floor == 6]
      effects: [floor = 7]
      goto: floor_07
    - text: Вниз, на пятый
      when: [floor == 6]
      effects: [floor = 5]
      goto: floor_05
    - text: Обратно на площадку
      when: [floor == 6]
      free: true
      goto: floor_06
    - text: Вверх, на восьмой
      when: [floor == 7]
      effects: [floor = 8]
      goto: floor_08
    - text: Вниз, на шестой
      when: [floor == 7]
      effects: [floor = 6]
      goto: floor_06
    - text: Обратно на площадку
      when: [floor == 7]
      free: true
      goto: floor_07
    - text: Вверх, на девятый
      when: [floor == 8]
      effects: [floor = 9]
      goto: floor_09
    - text: Вниз, на седьмой
      when: [floor == 8]
      effects: [floor = 7]
      goto: floor_07
    - text: Обратно на площадку
      when: [floor == 8]
      free: true
      goto: floor_08
    - text: Вверх, на десятый
      when: [floor == 9]
      effects: [floor = 10]
      goto: floor_10
    - text: Вниз, на восьмой
      when: [floor == 9]
      effects: [floor = 8]
      goto: floor_08
    - text: Обратно на площадку
      when: [floor == 9]
      free: true
      goto: floor_09
    - text: Вверх, на одиннадцатый
      when: [floor == 10]
      effects: [floor = 11]
      goto: floor_11
    - text: Вниз, на девятый
      when: [floor == 10]
      effects: [floor = 9]
      goto: floor_09
    - text: Обратно на площадку
      when: [floor == 10]
      free: true
      goto: floor_10

- id: stairs
  location: stairwell
  background: stairwell_up
  title: Лестница
  text: |
    Ступени скрипят заранее, будто предупреждают кого-то наверху. Пахнет мокрым деревом и чужим табаком.
  choices:
    - text: Вверх, на второй
      when: [floor == 1]
      effects: [floor = 2]
      goto: floor_02
    - text: Обратно на площадку
      when: [floor == 1]
      free: true
      goto: floor_01
    - text: Вверх, на третий
      when: [floor == 2]
      effects: [floor = 3]
      goto: floor_03
    - text: Вниз, в вестибюль
      when: [floor == 2]
      effects: [floor = 1]
      goto: floor_01
    - text: Обратно на площадку
      when: [floor == 2]
      free: true
      goto: floor_02
    - text: Вверх, на четвёртый
      when: [floor == 3]
      effects: [floor = 4]
      goto: floor_04
    - text: Вниз, на второй
      when: [floor == 3]
      effects: [floor = 2]
      goto: floor_02
    - text: Обратно на площадку
      when: [floor == 3]
      free: true
      goto: floor_03
    - text: Вверх, на пятый
      when: [floor == 4]
      effects: [floor = 5]
      goto: floor_05
    - text: Вниз, на третий
      when: [floor == 4]
      effects: [floor = 3]
      goto: floor_03
    - text: Обратно на площадку
      when: [floor == 4]
      free: true
      goto: floor_04

# Желоб: только вниз, в подвал к Сайласу. Ход не тратится.
- id: chute_peek
  location: chute
  background: landing_02
  title: Бельевой желоб
  text: |
    Ты откидываешь заслонку. Снизу тянет теплом и угольной гарью. Где-то очень глубоко гудит топка, и кто-то поёт без слов.

    Эдди говорил: отсюда можно попасть в подвал за секунду. Обратно — только пешком.
  choices:
    - text: Прыгнуть
      free: true
      effects: [floor = 0]
      outcome: |
        Темнота, запах мыла и угля, удар о гору мешков с бельём. Ты лежишь в подвале и смотришь на огонь в открытой топке.
      goto: basement
    - text: Закрыть заслонку
      free: true
      goto: floor_02
