# Первая ночь (v2, реплики). Всё здесь срабатывает только при nights == 0.
# Что игрок должен вынести из первой ночи:
#   контора  — вещи Хейла (три зацепки в блокноте) и странность «днём там забор»;
#   вестибюль — правила, «12 — выкупить» → приглашение и трое поручителей;
#   слух дня  — пирог миссис Пул и просьба Долли «загляни до полуночи» → дилемма;
#   бирка     → Эдди → комната 3-В → кольцо → первое настоящее воспоминание.
#
# Формат реплик: lines — лента до выбора; у выбора say (реплика Ника), do (действие)
# или старый text; reply — лента после выбора. who — id из world.yaml → speakers.

- id: office_morning
  location: office
  priority: 2
  when: [nights == 0, seen.office_morning == 0]
  background: office_empty
  title: Контора
  lines:
    - { who: narrator, text: "Контора над прачечной на Портовой. На стекле двери твоё имя, задом наперёд." }
    - { who: gut, text: "Ник Кэллоуэй. Частный сыск, лицензия № 2214." }
    - { who: gut, text: "Морская пехота. «Макгиннис». Лорейн ушла к трубачу. Шериф ждёт дома." }
    - { who: narrator, text: "В дверь стучат." }
  choices:
    - do: Открыть
      free: true
      effects: [seen.office_morning = 1]

- id: office_first_night
  location: office
  priority: 1
  when: [nights == 0]
  background: office_empty
  portrait: vivian
  title: Контора
  lines:
    - { who: narrator, text: "Женщина в мокром пальто садится без приглашения и ставит трость к столу." }
    - { who: vivian, text: "Мой муж, Уолтер Хейл. Три недели назад ушёл в Белведер-билдинг и не вернулся." }
    - { who: vivian, text: "Здесь двести. Остальное — когда найдёте. И вот что было у него в карманах." }
    - { who: narrator, text: "Бирка из прачечной. Коробок спичек «Синий фонарь», на обороте цифры. Клочок бумаги: «12 — выкупить до 15-го»." }
  choices:
    - say: Что это за дом?
      when: [seen.office_belvedere == 0]
      free: true
      effects: [seen.office_belvedere = 1]
      reply:
        - { who: vivian, text: "Днём — конторы. А ночью на последнем этаже работает ломбард." }
        - { who: vivian, text: "Там закладывают не вещи, мистер Кэллоуэй. Воспоминания." }
    - say: Вы бывали там сами?
      when: [seen.office_daytime == 0]
      free: true
      effects: [seen.office_daytime = 1]
      reply:
        - { who: vivian, text: "Днём. Забор, табличка «Снос», окна заколочены." }
        - { who: vivian, text: "А ночью там горит свет. Уолтер возвращался оттуда под утро и пах дымом." }
        - { who: gut, text: "Перепутала адрес. В Харроу полно заколоченных домов." }
    - say: Мог он сбежать с чужими деньгами?
      when: [seen.vivian_lie == 0]
      free: true
      effects: [seen.vivian_lie = 1]
      reply:
        - { who: vivian, text: "Уолтер никогда не брал чужого." }
        - { who: gut, text: "Слишком ровно. Так говорят текст, выученный наизусть." }
    - do: Взять деньги и дело
      free: true
      effects: [seen.client_first = 1, met.vivian = 1, knows.club = 1]
      goto: facade

- id: facade_first_night
  location: facade
  priority: 1
  when: [nights == 0]
  background: facade
  title: Белведер-билдинг
  lines:
    - { who: narrator, text: "Двенадцать этажей кирпича над товарной станцией. На крыше красным: «Займы под залог»." }
    - { who: narrator, text: "Свет во всех окнах. У входа в луже размокает «Харроу Курьер»." }
    - { who: gut, text: "Никакого забора. Перепутала, значит." }
  choices:
    - do: Поднять газету
      when: [seen.facade_paper == 0]
      free: true
      effects: [seen.facade_paper = 1]
      reply:
        - { who: narrator, text: "Третья полоса: «Пропавший докер найден живым. Не помнит ни жены, ни имени. При нём сорок долларов»." }
        - { who: gut, text: "Таких заметок по две в неделю. Раньше ты их не читал." }
    - do: Войти
      free: true
      goto: lobby

# Вестибюль, первая ночь: правила одной карточкой.
- id: lobby_rules
  location: lobby
  priority: 5
  when: [nights == 0, seen.lobby_rules == 0]
  background: lobby
  portrait: dolly_suspicion
  title: Вестибюль
  lines:
    - { who: narrator, text: "Седая женщина у мёртвой шахты лифта откладывает вязание." }
    - { who: dolly, text: "Долли. А ты новенький. Слушай, повторять не буду." }
    - { who: dolly, text: "Войти сюда может кто угодно. Уйти — только через меня, оставив залог. Кусок своей жизни." }
    - { who: dolly, text: "К шести будь внизу. Кто не ушёл до рассвета, тот здесь остаётся." }
  choices:
    - say: Давно вы здесь?
      free: true
      effects: [seen.lobby_rules = 1, met.dolly = 1]
      reply:
        - { who: dolly, text: "Сорок лет за этой стойкой. Помню всех, кто входил в эту дверь." }
        - { who: dolly, text: "Совсем всех. Это не похвальба, это диагноз." }
    - do: Кивнуть
      free: true
      effects: [seen.lobby_rules = 1, met.dolly = 1]

# Первый разговор. Любой выбор ставит seen.lobby = 1 и seen.dolly_ask = 1
# (Долли уже попросила зайти до часу ночи — это половина дилеммы).
- id: lobby_first_night
  location: lobby
  priority: 1
  when: [seen.lobby == 0, nights == 0]
  background: lobby
  portrait: dolly
  title: Вестибюль
  lines:
    - { who: dolly, text: "Хейл? Поднимался. Курил «Пульман Ред». Спрашивал, сколько дают за имя." }
    - { who: dolly, rumor: true }
    - { who: dolly, text: "А ты загляни ко мне до часу ночи. Покажу, как ходит лифт, который не ходит." }
  choices:
    - say: Что значит «12 — выкупить»?
      effects: [seen.lobby = 1, seen.dolly_ask = 1, seen.dolly_invite = 1, knows.invitation = 1, clues += 1]
      reply:
        - { who: dolly, text: "Двенадцатый. Там Владелец. Там выкупают то, что заложили." }
        - { who: dolly, text: "Наверх без приглашения не ходят. Хейла пригласили. Тебя — когда за тебя поручатся трое." }
        - { who: gut, text: "Трое жильцов. Значит, придётся стучать в двери." }
    - say: Сколько дают за имя?
      effects: [seen.lobby = 1, seen.dolly_ask = 1, seen.dolly_hale = 1, clues += 1]
      reply:
        - { who: dolly, text: "Смотря чьё. За своё дают мало." }
        - { who: dolly, text: "За чужое, если тебя им зовут, — столько, что хватает на всё." }
    - do: Угостить сигаретой
      when: [cigarettes >= 1]
      effects: [seen.lobby = 1, seen.dolly_ask = 1, seen.dolly_cig = 1, cigarettes -= 1, dolly_trust += 1]
      reply:
        - { who: narrator, text: "Долли прячет сигарету в карман фартука. Не закуривает." }
        - { who: gut, text: "Так берут задаток, а не подарок." }

# Первый залог: Долли объясняет обмен.
- id: pledge_first_night
  location: pledge
  layout: pledge
  priority: 3
  when: [nights == 0]
  background: lobby
  portrait: dolly_trust
  title: Залог
  lines:
    - { who: narrator, text: "Долли кладёт на стойку пустой конверт." }
    - { who: dolly, text: "Отдай мне кусок своей жизни. То, что не жалко." }
    - { who: dolly, text: "Если наверху нашёл что-то своё, оно встанет на освободившееся место." }
    - { who: dolly, text: "Или отдай саму ночь. Ничего не потеряешь, ничего не вернёшь." }
  choices:
    - do: Заложить эту ночь
      free: true
      effects: [night_pledged = 1]
      reply:
        - { who: dolly, text: "Осторожный. Осторожные здесь живут дольше. Но не лучше." }
      endNight: true

# Рассвет в первую ночь: игрока перенесло к Долли, это надо объяснить.
- id: pledge_first_dawn
  location: pledge
  layout: pledge
  priority: 4
  when: [nights == 0, turn >= 16]
  background: lobby_dawn
  portrait: dolly_worry
  title: Рассвет
  lines:
    - { who: narrator, text: "Серый свет в стёклах. Ты не помнишь, как спустился. Долли держит тебя за рукав." }
    - { who: dolly, text: "Еле успела. Ещё минута — и проснулся бы в 3-В, новым жильцом." }
    - { who: dolly, text: "Отдай кусок жизни, что не жалко. Или саму ночь. Быстро." }
  choices:
    - do: Заложить эту ночь
      free: true
      effects: [night_pledged = 1]
      endNight: true

# Первая ночь, ничего своего не найдено.
- id: pledge_first_empty
  location: pledge
  layout: pledge
  priority: 5
  when: [nights == 0, turn < 16, has.ring == 0, seen.sloan_cashbox == 0, has.ledger_true == 0]
  background: lobby
  portrait: dolly_worry
  title: Залог
  lines:
    - { who: narrator, text: "Долли кладёт на стойку пустой конверт и смотрит на твои руки." }
    - { who: dolly, text: "Пустые. Ничего своего наверху не нашёл." }
    - { who: dolly, text: "Отдашь кусок жизни — взамен ничего не встанет. Лучше отдай ночь." }
    - { who: gut, text: "В блокноте три зацепки. Ни одна не закрыта." }
  choices:
    - do: Заложить эту ночь
      free: true
      effects: [night_pledged = 1]
      reply:
        - { who: dolly, text: "Правильно. Жизнь тратят на что-то. Не на пустые руки." }
      endNight: true
