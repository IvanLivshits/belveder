# Первая ночь — она же обучение. Всё здесь срабатывает только при nights == 0.
# Каждое правило объясняет персонаж, в тот момент, когда оно понадобится:
#   контора — что такое Белведер; фасад — что бывает с теми, кто туда ходит;
#   вестибюль — залог, рассвет и Горман, плюс подсказка «третий этаж»;
#   залог — как работает обмен воспоминаний.
# Цель ночи: игрок находит кольцо и уже на первом залоге получает настоящее воспоминание.

# Самая первая карточка игры: кто такой Ник. Без неё игрок впервые
# видит «свою жизнь» только на экране залога.
- id: office_morning
  location: office
  priority: 2
  when: [nights == 0, seen.office_morning == 0]
  background: office_empty
  title: Контора
  text: |
    Тебя зовут Ник Кэллоуэй. Частный сыск, лицензия № 2214, контора над прачечной на Портовой.

    Ты служил в морской пехоте на Тихом океане. Пьёшь в «Макгиннисе». Бывшая жена, Лорейн, ушла к трубачу. Пёс, Шериф, ждёт дома. Шрам на руке — Бруклин, давно.

    Это всё, что у тебя есть. Тебе хватает.

    В дверь стучат.
  choices:
    - text: Открыть
      free: true
      effects: [seen.office_morning = 1]

- id: office_first_night
  location: office
  priority: 1
  when: [nights == 0]
  background: office_empty
  portrait: vivian
  title: Контора
  text: |
    Дождь стучит в стекло, на котором твоё имя написано задом наперёд. Женщина в мокром пальто садится, не дожидаясь приглашения, и ставит трость к столу.

    — Мой муж, Уолтер Хейл. Три недели назад он ушёл в Белведер-билдинг и не вернулся. — Она кладёт на стол конверт. — Здесь двести. Остальное — когда найдёте.
  choices:
    - text: Спросить, что это за дом
      when: [seen.office_belvedere == 0]
      free: true
      effects: [seen.office_belvedere = 1]
      outcome: |
        — Днём там обычные конторы. А ночью на последнем этаже работает ломбард. — Она поправляет перчатку. — Там закладывают не вещи, мистер Кэллоуэй. Воспоминания. Люди выходят оттуда с деньгами и без половины себя.
    - text: Закурить и спросить, что он там забыл
      when: [seen.office_smoke == 0, cigarettes >= 1]
      free: true
      effects: [seen.office_smoke = 1, cigarettes -= 1, clues += 1]
      outcome: |
        — Сказал, что идёт выкупить одну вещь. Не сказал какую. — Она смотрит на твою сигарету. — Он курил такие же.
    - text: Спросить, мог ли он сбежать с чужими деньгами
      when: [seen.vivian_lie == 0]
      free: true
      effects: [seen.vivian_lie = 1]
      outcome: |
        — Уолтер никогда не брал чужого.

        Она говорит это слишком ровно. Так произносят текст, выученный наизусть.
    - text: Взять деньги и дело
      free: true
      effects: [seen.client_first = 1]
      goto: facade

- id: facade_first_night
  location: facade
  priority: 1
  when: [nights == 0]
  background: facade
  title: Белведер-билдинг
  text: |
    Башня торчит над товарной станцией, как чемодан, забытый на перроне. Двенадцать этажей кирпича и чугуна, на крыше красным горит «Займы под залог».

    У входа в луже размокает вчерашний «Харроу Курьер».
  choices:
    - text: Поднять газету
      when: [seen.facade_paper == 0]
      free: true
      effects: [seen.facade_paper = 1]
      outcome: |
        Заметка на третьей полосе: «Пропавший докер найден живым. Не помнит ни жены, ни своего имени. При нём сорок долларов наличными».

        Таких заметок в «Курьере» по две в неделю. Раньше ты их не читал.
    - text: Войти через парадную
      free: true
      goto: lobby

# Вестибюль, первая ночь: сначала правила (одна карточка), потом Долли о Хейле.
- id: lobby_rules
  location: lobby
  priority: 5
  when: [nights == 0, seen.lobby_rules == 0]
  background: lobby
  portrait: dolly_suspicion
  title: Вестибюль
  text: |
    Седая женщина у мёртвой шахты лифта откладывает вязание и разглядывает тебя, как опись.

    — Долли, — говорит она вместо «добрый вечер». — А ты новенький. Слушай, повторять не буду. Войти сюда может кто угодно. Уйти — только через меня, и только оставив залог: кусок своей жизни. — Она пожимает плечами. — Не бойся, у тебя их много. В шесть приедет сержант Горман с нарядом. К этому времени будь внизу.
  choices:
    - text: Спросить, давно ли она здесь
      free: true
      effects: [seen.lobby_rules = 1, met.dolly = 1]
      outcome: |
        — Сорок лет за этой стойкой. — Спицы снова идут. — Я помню всех, кто входил в эту дверь. Совсем всех. Это не похвальба, это диагноз.
    - text: Кивнуть
      free: true
      effects: [seen.lobby_rules = 1, met.dolly = 1]

- id: lobby_first_night
  location: lobby
  priority: 1
  when: [seen.lobby == 0, nights == 0]
  background: lobby
  portrait: dolly
  title: Вестибюль
  text: |
    — Хейл? — Долли не поднимает глаз от вязания. — Поднимался. Курил «Пульман Ред». Спрашивал, сколько дают за имя.

    Лифт за её спиной не работает с тех пор, как город перестал верить в лифты. Справа лестница, пахнет мокрым деревом.
  choices:
    - text: Спросить, где он ночевал
      effects: [seen.lobby = 1, seen.dolly_hint = 1, clues += 1]
      outcome: |
        — На третьем. В комнате для новых жильцов, за служебной дверью. — Спицы замирают на секунду. — Там все ночуют, кто здесь впервые. Сходи посмотри. Только не говори миссис Пул, что я тебя послала.
    - text: Спросить, сколько дают за имя
      effects: [seen.lobby = 1, seen.dolly_hale = 1, clues += 1]
      outcome: |
        — Смотря чьё. За своё дают мало. За чужое, если тебя им зовут, — столько, что хватает на всё. — Она кивает на лестницу. — Он ночевал на третьем. Остальное узнавай сам.
    - text: Предложить сигарету
      when: [cigarettes >= 1]
      effects: [seen.lobby = 1, seen.dolly_cig = 1, cigarettes -= 1, dolly_trust += 1]
      outcome: |
        Долли берёт сигарету и прячет её в карман фартука. Не закуривает. Так берут задаток.

        — Третий этаж, — говорит она, будто ты спросил. — Служебная дверь.

# Первый залог: Долли объясняет обмен. Перебивает и обычный выход, и рассвет.
- id: pledge_first_night
  location: pledge
  layout: pledge
  priority: 3
  when: [nights == 0]
  background: lobby
  portrait: dolly_trust
  title: Залог
  text: |
    Долли кладёт на стойку пустой конверт.

    — Ты сейчас отдашь мне кусок своей жизни. Выбери то, что не жалко. — Она смотрит на твои руки. — Если наверху ты нашёл что-то своё, оно может встать на освободившееся место. А можешь отдать саму ночь: тогда ничего не потеряешь, но и ничего не вернёшь.
  choices:
    - text: Заложить эту ночь
      free: true
      effects: [night_pledged = 1]
      outcome: |
        — Осторожный, — говорит Долли и заклеивает конверт. — Осторожные здесь живут дольше. Но не лучше.
      endNight: true

# Рассвет в первую ночь: игрока перенесло к Долли, это надо объяснить.
- id: pledge_first_dawn
  location: pledge
  layout: pledge
  priority: 4
  when: [nights == 0, turn >= 16]
  background: lobby_dawn
  portrait: dolly_worry
  title: Рассвет
  text: |
    Серый свет в стёклах. С улицы сирена: Горман приехал с нарядом. Ты не помнишь, как спустился. В этом доме на рассвете все оказываются внизу.

    Долли кладёт на стойку пустой конверт.

    — Отдай мне кусок своей жизни, то, что не жалко. Если наверху ты нашёл что-то своё, оно встанет на освободившееся место. Или отдай саму ночь: ничего не потеряешь, ничего не вернёшь.
  choices:
    - text: Заложить эту ночь
      free: true
      effects: [night_pledged = 1]
      endNight: true

# Первая ночь, ничего своего не найдено: Долли советует не тратить жизнь зря.
- id: pledge_first_empty
  location: pledge
  layout: pledge
  priority: 5
  # turn < 16: на рассвете важнее объяснить, почему игрок внизу (pledge_first_dawn).
  when: [nights == 0, turn < 16, has.ring == 0, seen.sloan_cashbox == 0, has.ledger_true == 0]
  background: lobby
  portrait: dolly_worry
  title: Залог
  text: |
    Долли кладёт на стойку пустой конверт и смотрит на твои руки.

    — Пустые. Ничего своего наверху не нашёл. — Она вздыхает. — Можешь отдать кусок жизни, но взамен ничего не встанет, останется дыра. Или отдай ночь: ничего не потеряешь. Третий этаж никуда не денется, Ник. Я тоже.
  choices:
    - text: Заложить эту ночь
      free: true
      effects: [night_pledged = 1]
      outcome: |
        — Правильно, — говорит Долли и заклеивает конверт. — Жизнь тратят на что-то. Не на пустые руки.
      endNight: true
