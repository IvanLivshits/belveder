# Выход из башни = залог у Долли. Игрок закладывает ложное воспоминание (экран pledge)
# или закладывает саму ночь: воспоминания не трогаются, отчёт не попадает в дело.
- id: pledge_dolly
  location: pledge
  layout: pledge
  background: lobby
  portrait: dolly_worry
  title: Залог у Долли
  text: |
    Долли выдвигает ящик стойки. В ящике конверты, на каждом ваш почерк.
    «Выход платный. Одно воспоминание. Выбирайте то, без которого обойдётесь. Или заложите ночь целиком — тогда утром вы ничего не вспомните, но и ничего не потеряете».
    Улик при вас: {clues}.
  choices:
    - text: Заложить ночь
      free: true
      effects: [night_pledged = 1]
      endNight: true
