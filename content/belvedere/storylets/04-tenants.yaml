# Жильцы этажей 2–4 (v2, реплики).
#   intro (priority 2) — самый первый визит за всю игру;
#   hub   (priority 0) — разговор; каждый вопрос — 1 ход, после ответа скрывается.
# Вопросы, которые требуют знания, закрыты knows.* (правила логики, раздел «Знание»).
# Поручительство: vouch.<жилец> = 1 и vouches += 1, один раз за игру.

# ── 2. Эдди Мэлоун, прачечная и узел пневмопочты ─────────────────────────────
# Хочет: уехать туда, где нет дождя. Скрывает: читает всю почту дома.

- id: eddie_hostile
  location: tenant_02
  priority: 9
  when: [seen.eddie_hostile == 1]
  background: landing_02
  portrait: eddie
  title: Прачечная
  lines:
    - { who: narrator, text: "Эдди гладит рубашку, которая давно гладкая. Головы не поднимает." }
    - { who: eddie, text: "Почта сегодня не для вас, мистер." }
  choices:
    - do: Уйти
      free: true
      goto: floor_02

- id: eddie_intro
  location: tenant_02
  priority: 2
  when: [visited.floor2.tenant == 1, seen.eddie_intro == 0, met.eddie == 0]
  background: landing_02
  portrait: eddie_caught
  title: Прачечная
  lines:
    - { who: narrator, text: "Пар, гладильные доски, трубы пневмопочты под потолком, как кишки дома." }
    - { who: narrator, text: "Мальчишка в кепке курьера читает под лампой чужую записку. Прятать не думает." }
    - { who: eddie, text: "Я только проверяю, чтобы не промокла." }
  choices:
    - do: Сделать вид, что не заметил
      free: true
      effects: [seen.eddie_intro = 1, met.eddie = 1, debt.eddie += 1]

- id: eddie_laundry
  location: tenant_02
  background: landing_02
  portrait: eddie
  title: Прачечная
  lines:
    - { who: narrator, text: "Эдди гладит и косится на полку, где лежат латунные цилиндры. У половины открученные крышки." }
    - { who: eddie, text: "Сегодня не бегаю. Ноги не идут.", when: [rumor.eddie_blue == 1] }
    - { who: gut, text: "Только что он бежал наверх. Теперь гладит, будто и не уходил.", when: [seen.eddie_ran == 1] }
  choices:
    - do: Показать бирку
      when: [has.laundry_tag == 1, knows.room == 0]
      effects: [seen.eddie = 1, seen.eddie_room = 1, knows.room = 1, clues += 1]
      reply:
        - { who: eddie, text: "Хейл, из 3-В. Четырнадцать рубашек, все одинаковые." }
        - { who: eddie, text: "Будто месяц носил. Или один вечер, много раз. Тут не разберёшь." }
        - { who: eddie, text: "Ключ от 3-В на косяке. Все так делают." }
    - say: Как выглядел Хейл?
      when: [knows.room == 1, seen.eddie_hale == 0]
      effects: [seen.eddie = 1, seen.eddie_hale = 1, clues += 1]
      reply:
        - { who: eddie, text: "Шляпа с узкими полями. Пальто как у вас." }
        - { who: gut, text: "Он смотрит на твоё пальто дольше, чем нужно." }
    - say: Что случилось?
      when: [rumor.eddie_blue == 1, seen.eddie_blue == 0]
      effects: [seen.eddie = 1, seen.eddie_blue = 1, paths.laundry_chute = 1, debt.eddie += 1]
      reply:
        - { who: eddie, text: "Показалось, что я уже прожил этот вечер. Раз сто." }
        - { who: eddie, text: "Глупость, да? Желоб в подвал — вон та заслонка. Берите, если надо." }
    - do: Угостить сигаретой и спросить, кому записки
      when: [cigarettes >= 1, has.owner_note == 0, knows.owner_note == 0]
      effects: [seen.eddie = 1, cigarettes -= 1, debt.eddie += 1, has.owner_note = 1, knows.owner_note = 1, clues += 1]
      reply:
        - { who: eddie, text: "Все наверх. Ему. И одна про вас. Я не давал, вы сами нашли." }
        - { who: narrator, text: "«Детектив поднимется. Не мешать. Ему нужно дойти самому. — В.»" }
    # Грубый путь — только когда угостить нечем.
    - do: Снять цилиндр с полки
      when: [cigarettes == 0, has.owner_note == 0, knows.owner_note == 0]
      effects: [seen.eddie = 1, seen.eddie_hostile = 1, suspicion += 2, has.owner_note = 1, knows.owner_note = 1, clues += 1]
      reply:
        - { who: narrator, text: "«Детектив поднимется. Не мешать. Ему нужно дойти самому. — В.»" }
        - { who: gut, text: "Ему пятнадцать. Он только что решил, что ты такой же, как все тут." }
    # Про Денвер Ник узнаёт один раз (knows.denver). Аванс можно отдать только в другую ночь:
    # Эдди не помнит разговора, и это часть вуали.
    - say: Куда хочешь уехать?
      when: [knows.denver == 0]
      effects: [seen.eddie = 1, seen.eddie_dream = 1, knows.denver = 1, debt.eddie += 1]
      reply:
        - { who: eddie, text: "В Денвер. Отец говорил, оттуда видно горы." }
        - { who: eddie, text: "Лица его не помню, а горы помню. Смешно, да?" }
    # Услуги Эдди (аванс, ключ, желоб) — не больше одной за ночь: seen.eddie_favor.
    - do: Отдать ему аванс на билет до Денвера
      when: [knows.denver == 1, seen.eddie_dream == 0, vouch.eddie == 0, seen.eddie_favor == 0]
      effects: [vouch.eddie = 1, vouches += 1, has.advance_given = 1, debt.eddie += 1, seen.eddie_favor = 1]
      reply:
        - { who: eddie, text: "Откуда вы знаете про Денвер? Я никому… Мистер, это же два билета." }
        - { who: eddie, text: "Наверху спросят, кто вы, — я скажу. Я им почту ношу, мне верят." }
    - say: Есть ключ от лаборатории Мэй?
      when: [met.mei == 1, debt.eddie >= 2, has.darkroom_key == 0, seen.eddie_favor == 0]
      effects: [has.darkroom_key = 1, seen.eddie_favor = 1]
      reply:
        - { who: narrator, text: "Эдди снимает с гвоздя ключ с красной биркой." }
        - { who: eddie, text: "Мэй забывает его в карманах, я нахожу при стирке. Не вернёте — она и не узнает." }
    - say: Куда ведёт желоб?
      when: [nights >= 1, debt.eddie >= 1, paths.laundry_chute == 0, seen.eddie_favor == 0]
      effects: [seen.eddie = 1, paths.laundry_chute = 1, seen.eddie_favor = 1]
      reply:
        - { who: eddie, text: "В подвал, к Сайласу. Быстро, но только вниз." }
        - { who: eddie, text: "Заслонку я вам открою. Только Сайласу не говорите, что от меня." }
    - do: Уйти
      free: true
      goto: floor_02

# ── 3. Миссис Харриет Пул, меблированные комнаты ─────────────────────────────
# Хочет: дождаться сына с флота. Скрывает: сын не придёт, фотография лицом к стене.

# Ужин в ночь пирога (позвала с лестницы или Ник сам постучал). Это и есть дилемма.
- id: pool_dinner
  location: tenant_03
  priority: 6
  when: [rumor.pool_pie == 1, seen.pool_dinner == 0, seen.pool_declined == 0]
  background: landing_03
  portrait: pool
  title: Квартира миссис Пул
  lines:
    - { who: narrator, text: "Стол на двоих. Пирог с корицей, чай в чашках с отбитыми ручками." }
    - { who: pool, text: "Садись. Ты всегда приходишь, когда остывает." }
  choices:
    - do: Сесть за стол и доесть
      when: [vouch.pool == 0]
      effects: [seen.pool_dinner = 1, seen.pool_intro = 1, met.pool = 1, knows.room = 1, vouch.pool = 1, vouches += 1, clues += 1, turn += 1]
      reply:
        - { who: pool, text: "Уолтер из 3-В тоже любил с корицей. Месяц у меня ужинал." }
        - { who: pool, text: "Наверху спросят, кто ты, — скажу, что свой. Мне там верят." }
        - { who: gut, text: "Месяц. Комната 3-В. И ты съел пирог." }
    - do: Сесть за стол и доесть
      when: [vouch.pool == 1]
      effects: [seen.pool_dinner = 1, seen.pool_intro = 1, met.pool = 1, knows.room = 1, clues += 1, turn += 1]
      reply:
        - { who: pool, text: "Уолтер из 3-В тоже любил с корицей. Месяц у меня ужинал." }
        - { who: gut, text: "Пирог тот же. Она тоже." }
    - say: Я на минуту
      effects: [seen.pool_declined = 1, met.pool = 1]
      reply:
        - { who: pool, text: "Все на минуту. А потом месяц." }
      goto: floor_03

- id: pool_intro
  location: tenant_03
  priority: 2
  when: [visited.floor3.tenant == 1, seen.pool_intro == 0, met.pool == 0]
  background: landing_03
  portrait: pool
  title: Квартира миссис Пул
  lines:
    - { who: narrator, text: "Пахнет жареным луком. Стол накрыт на двоих. Хозяйка ставит вторую тарелку перед тобой." }
    - { who: pool, text: "Ешь, остынет. Ты всегда приходишь, когда остывает." }
  choices:
    - do: Снять шляпу
      free: true
      effects: [seen.pool_intro = 1, met.pool = 1]

- id: pool_walter
  location: tenant_03
  priority: 4
  when: [mem.true.name == 1, met.pool_walter == 0]
  background: landing_03
  portrait: pool_recognize
  title: Квартира миссис Пул
  lines:
    - { who: narrator, text: "Миссис Пул роняет половник." }
    - { who: pool, text: "Уолтер. Ты же съехал. Ты съехал в то утро и сказал, что тебя зовут по-другому." }
  choices:
    - say: Вы ошибаетесь
      effects: [seen.pool_walter = 1, met.pool_walter = 1, met.pool = 1]
      reply:
        - { who: pool, text: "Конечно. Они все так говорят." }
        - { who: pool, text: "Ешь, остынет." }
    - say: Это я
      effects: [seen.pool_walter = 1, met.pool_walter = 1, met.pool = 1, seen.pool_confess = 1, clues += 1]
      reply:
        - { who: pool, text: "Я знала. В то утро я постучала: «Доброе утро, мистер…». А ты сказал: «Кэллоуэй»." }
        - { who: pool, text: "Сам. Прочитал фамилию на визитке у себя на тумбочке." }

- id: pool_table
  location: tenant_03
  background: landing_03
  portrait: pool
  title: Квартира миссис Пул
  lines:
    - { who: narrator, text: "Скатерть в клетку, вторая тарелка. Фотография на комоде повёрнута к стене." }
  choices:
    - say: Кого вы ждёте?
      when: [seen.pool == 0]
      effects: [seen.pool = 1]
      reply:
        - { who: pool, text: "Сына. Служит на флоте, пишет редко." }
        - { who: pool, text: "Скоро придёт. Они все приходят, если накрыть стол." }
    - say: Кто жил в 3-В?
      when: [knows.room == 1, seen.pool_room == 0, seen.pool_dinner == 0]
      effects: [seen.pool_room = 1, clues += 1]
      reply:
        - { who: pool, text: "Уолтер. Вежливый, всегда вытирал ноги." }
        - { who: pool, text: "Съехал однажды утром и не попрощался. Они все так съезжают." }
    - do: Сесть и поесть
      when: [seen.pool_meal == 0, seen.pool_dinner == 0]
      effects: [seen.pool_meal = 1, knows.room = 1, turn += 1]
      reply:
        - { who: narrator, text: "Суп с луком, горячий, как в детстве, которого ты не помнишь." }
        - { who: pool, text: "Он тоже так держал ложку. Тот, из 3-В." }
    - do: Попросить книгу жильцов
      when: [visited.floor3.tenant >= 2, memories_returned >= 1, has.tenant_register == 0]
      effects: [has.tenant_register = 1, clues += 1]
      reply:
        - { who: narrator, text: "«Кэллоуэй Н., комната 3-В, с 15 марта». Прежний адрес — прочерк. Прежнее имя — прочерк." }
        - { who: gut, text: "Почерк её. Прочерки — чьи-то ещё." }
    - do: Показать кольцо
      when: [has.ring == 1, seen.pool_ring == 0]
      effects: [seen.pool_ring = 1, clues += 1]
      reply:
        - { who: narrator, text: "Миссис Пул берёт кольцо двумя пальцами, как чужое письмо." }
        - { who: pool, text: "Уолтера. Из 3-В. Съехал и не попрощался." }
    - do: Уйти
      free: true
      goto: floor_03

# ── 4. Огден Слоун, аудитор ──────────────────────────────────────────────────
# Хочет: чтобы его оставили в покое. Скрывает: настоящую книгу «Синего фонаря».

- id: sloan_intro
  location: tenant_04
  priority: 2
  when: [visited.floor4.tenant == 1, seen.sloan_intro == 0, met.sloan == 0]
  background: landing_04
  portrait: sloan
  title: Кабинет аудитора
  lines:
    - { who: narrator, text: "Худой человек в нарукавниках не удивлён." }
    - { who: sloan, text: "Огден Слоун, аудитор. А вы мистер Кэллоуэй." }
    - { who: sloan, text: "Я не ждал вас. Я знал, что вы придёте. Это разные вещи." }
  choices:
    - do: Сесть без приглашения
      free: true
      effects: [seen.sloan_intro = 1, met.sloan = 1]

- id: sloan_office
  location: tenant_04
  background: landing_04
  portrait: sloan
  title: Кабинет Слоуна
  lines:
    - { who: narrator, text: "Зелёная лампа, арифмометр, три ровные стопки. Слоун выравнивает их, пока ты говоришь." }
    - { who: narrator, text: "Лампа новая, ещё с биркой.", when: [rumor.sloan_lamp == 1] }
  choices:
    - say: Вы знали Уолтера Хейла?
      when: [seen.sloan_hale == 0]
      effects: [seen.sloan_hale = 1, met.sloan = 1]
      reply:
        - { who: sloan, text: "Нет." }
        - { who: gut, text: "Он ответил раньше, чем ты договорил фамилию." }
    - do: Показать коробок с цифрами
      when: [has.matchbook == 1, knows.matchbook == 0]
      effects: [seen.sloan_lantern = 1, knows.matchbook = 1, knows.shortage = 1, met.sloan = 1, clues += 1]
      reply:
        - { who: narrator, text: "Слоун смотрит на цифры и снимает очки." }
        - { who: sloan, text: "Это номера строк. Из моей ревизии «Синего фонаря», март." }
        - { who: sloan, text: "Откуда у вас мой почерк?" }
    - do: Угостить сигаретой
      when: [cigarettes >= 1, seen.sloan_cig == 0]
      effects: [seen.sloan_cig = 1, cigarettes -= 1, debt.sloan += 1, met.sloan = 1]
      reply:
        - { who: narrator, text: "Он не курит. Кладёт сигарету параллельно краю стола и немного успокаивается." }
    - say: Полиция о вас не узнает
      when: [seen.sloan_promise == 0]
      effects: [seen.sloan_promise = 1, debt.sloan += 1, met.sloan = 1]
      reply:
        - { who: sloan, text: "Сержант Горман узнаёт всё, что ему выгодно." }
        - { who: sloan, text: "Но спасибо. Мне давно никто ничего не обещал." }
    - say: Я прикрыл вас перед Горманом
      when: [seen.covered_sloan == 1, vouch.sloan == 0]
      effects: [vouch.sloan = 1, vouches += 1, debt.sloan += 1]
      reply:
        - { who: sloan, text: "Вы соврали полицейскому. Ради меня." }
        - { who: sloan, text: "Если наверху спросят — я поручусь. В цифрах я не вру." }
    - do: Надавить и потребовать книгу
      when: [knows.shortage == 1, has.ledger_fake == 0, has.ledger_true == 0]
      effects: [suspicion += 1, has.ledger_fake = 1, seen.sloan_copy = 1, clues += 1]
      reply:
        - { who: narrator, text: "Слоун без спора достаёт из ящика копию книги клуба. Слишком быстро." }
        - { who: gut, text: "Март сходится до цента. У таких людей всё сходится." }
    - say: Куда делись четыре тысячи?
      when: [knows.shortage == 1, debt.sloan >= 1, seen.sloan_cashbox == 0]
      effects: [seen.sloan_cashbox = 1, has.pawn_ticket = 1, clues += 1]
      reply:
        - { who: sloan, text: "В марте из кассы пропали четыре тысячи. Я нашёл недостачу." }
        - { who: sloan, text: "Утром пятнадцатого деньги вернулись. До цента. А человек — нет." }
        - { who: narrator, text: "Он кладёт на стол квитанцию ломбарда: «Предмет залога: имя»." }
    - say: Молчание за настоящую копию
      when: [knows.shortage == 1, debt.sloan >= 2, has.ledger_true == 0]
      effects: [has.ledger_true = 1, clues += 1, met.sloan_deal = 1]
      reply:
        - { who: narrator, text: "Слоун отодвигает шкаф. За ним вторая книга, перевязанная бечёвкой." }
        - { who: sloan, text: "В архиве лежит та, что для Гормана. Эта — для вас. Март, сорок первая строка." }
    - do: Уйти
      free: true
      goto: floor_04
