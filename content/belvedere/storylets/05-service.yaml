# Служебные комнаты 3 и 4.

# ── 3. Комната для новых жильцов. Здесь кольцо (пара «ring») ────────────────

- id: room_ring_found
  location: service_03
  priority: 2
  when: [has.ring == 1]
  background: room_newtenant
  portrait: ev_nick_hands
  title: Комната для новых жильцов
  text: |
    Кольцо сидит так, будто ты его никогда не снимал. Ты пробуешь его повернуть, и палец сам помнит, в какую сторону.
  choices:
    - text: Открыть ящик тумбочки
      when: [visited.floor3.service >= 2, has.contract == 0]
      effects: [has.contract = 1, clues += 1]
      outcome: |
        Договор найма на комнату 3-В, бессрочный. Арендатор: Н. Кэллоуэй.

        Подпись внизу твоя. Ты расписываешься так с детства. Ты не помнишь, где прошло твоё детство.
    - text: Уйти
      free: true
      goto: floor_03

- id: room_again
  location: service_03
  priority: 1
  when: [visited.floor3.service >= 3]
  background: room_newtenant
  title: Комната для новых жильцов
  text: |
    Кровать опять заправлена туго, по-армейски. Ты не помнишь, кто её заправил. Хочется думать, что не ты.

    На тумбочке твоя визитка. Ты кладёшь её сюда каждый раз? Или кто-то за тебя?
  choices:
    - text: Обыскать кровать
      when: [has.ring == 0, mem.true.ring == 0]
      effects: [has.ring = 1, clues += 1]
      outcome: |
        Под матрасом, там же, где в прошлый раз. Тонкое золото, внутри гравировка: «В. и У. Навсегда».
    - text: Достать кольцо из-под матраса
      when: [has.ring == 0, mem.true.ring == 1]
      effects: [has.ring = 1, clues += 1]
      outcome: |
        Кольцо там же, где всегда. Теперь ты знаешь, где часовня. Не знаешь только, чья рука была в твоей.
    - text: Открыть ящик тумбочки
      when: [has.contract == 0]
      effects: [has.contract = 1, clues += 1]
      outcome: |
        Договор найма на комнату 3-В, бессрочный. Арендатор: Н. Кэллоуэй. Подпись внизу твоя.
    - text: Уйти
      free: true
      goto: floor_03

- id: room_first
  location: service_03
  background: room_newtenant
  title: Комната для новых жильцов
  text: |
    Железная кровать, заправленная туго, как в казарме. Шкаф. Чистая пепельница. На тумбочке визитка: «Ник Кэллоуэй, частный сыск».

    Твоя визитка. Наверное, Хейл заходил к тебе в контору. Наверное.
  choices:
    - text: Обыскать кровать
      when: [has.ring == 0, mem.true.ring == 0]
      effects: [has.ring = 1, clues += 1]
      outcome: |
        Под матрасом, у самой стены, — обручальное кольцо. Тонкое золото, внутри гравировка: «В. и У. Навсегда».

        Ты примеряешь его, просто чтобы проверить. Оно впору.
    - text: Достать кольцо из-под матраса
      when: [has.ring == 0, mem.true.ring == 1]
      effects: [has.ring = 1, clues += 1]
      outcome: |
        Кольцо там же, где всегда. Теперь ты знаешь, где часовня. Не знаешь только, чья рука была в твоей.
    - text: Открыть шкаф
      when: [seen.room_wardrobe == 0]
      effects: [seen.room_wardrobe = 1, clues += 1]
      outcome: |
        Пальто как у тебя. Шляпа с узкими полями, как у тебя. Ты смотришь на ярлык: твой размер.

        Ты закрываешь шкаф аккуратно, как закрывают чужое.
    - text: Уйти
      free: true
      goto: floor_03

# ── 4. Архив копий. Настоящая и поддельная книга (пара «ledger») ────────────

- id: archive_locked
  location: service_04
  priority: 1
  when: [has.archive_key == 0, seen.archive_open == 0]
  background: landing_04
  title: Архив копий
  text: |
    Замок новый, медь ещё не потемнела. Ключа у тебя нет, а у Слоуна ты его просить не станешь.
  choices:
    - text: Вскрыть замок
      effects: [seen.archive_open = 1, suspicion += 2]
      outcome: |
        Отмычка, две минуты, мокрые от пота ладони. Замок щёлкает так громко, что внизу, кажется, замолкает радио.
    - text: Уйти
      free: true
      goto: floor_04

- id: archive_shelves
  location: service_04
  background: archive
  portrait: ev_ledgers
  title: Архив копий
  text: |
    Стеллажи до потолка, на каждом корешке год и название клуба. «Синий фонарь» занимает целую полку. Пыль везде, кроме одной книги на ближнем краю и узкой щели между стеллажом и стеной.
  choices:
    - text: Взять копию с ближней полки
      when: [has.ledger_fake == 0]
      effects: [has.ledger_fake = 1, clues += 1]
      outcome: |
        Чистая книга, ровные столбцы. Март сходится до цента. Растраты не было.

        Слишком чисто для бухгалтерии портового клуба.
    - text: Пошарить за стеллажом
      when: [seen.sloan_cashbox == 1, has.ledger_true == 0]
      effects: [has.ledger_true = 1, clues += 1]
      outcome: |
        Слоун говорил, что деньги вернулись наутро. Значит, должна быть книга, где они сначала пропали.

        За стеллажом вторая копия, перевязанная бечёвкой. Март, сорок первая строка: «Недостача 4 000. Погашена наличными в ночь на 15-е».
    - text: Сравнить с копией Слоуна
      when: [has.ledger_fake == 1, has.ledger_true == 0, seen.sloan_cashbox == 0]
      effects: [has.ledger_true = 1, clues += 1]
      outcome: |
        Книга на полке — точная копия той, что тебе отдал Слоун. Слишком точная: даже клякса на той же странице. Две подделки делают, когда где-то есть оригинал.

        За стеллажом, в щели у стены, — третья книга, перевязанная бечёвкой. Март, сорок первая строка: «Недостача 4 000. Погашена наличными в ночь на 15-е».
    - text: Сверить две копии
      when: [has.ledger_fake == 1, has.ledger_true == 1, seen.ledger_compare == 0]
      effects: [seen.ledger_compare = 1, clues += 1]
      outcome: |
        Почерк один, бумага одна. Расходятся в одной строке. В одной строке недостача есть, в другой её никогда не было.

        Ночь на 15 марта. Запомни эту дату.
    - text: Уйти
      free: true
      goto: floor_04
