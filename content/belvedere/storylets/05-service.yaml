# Служебные комнаты 3 и 4 (v2, реплики).

# ── 3. Комната 3-В, для новых жильцов. Здесь кольцо (пара «ring») ───────────
# Дверь открыта, если Ник знает про комнату (knows.room: Эдди или ужин у Пул) —
# тогда на площадке кнопка «Комната 3-В» ставит seen.room_open.
# Без знания — заперто; вскрыть можно, но грубо.
# Прямые намёки «Ник = Хейл» (визитка, договор) — только после 2 возвращённых воспоминаний.

- id: room_locked
  location: service_03
  priority: 3
  when: [seen.room_open == 0]
  background: landing_03
  title: Служебная дверь
  lines:
    - { who: narrator, text: "Заперто. На двери мелом: «3-В». Ключа под ковриком нет." }
    - { who: gut, text: "Кто-то в этом доме знает, где ключ. Кто-то, кто здесь всё стирает." }
  choices:
    - do: Вскрыть замок
      effects: [seen.room_open = 1, suspicion += 2]
      reply:
        - { who: narrator, text: "Отмычка, минута. Замок поддаётся с таким скрипом, что за стеной замолкает радио." }
    - do: Уйти
      free: true
      goto: floor_03

- id: room_ring_found
  location: service_03
  priority: 2
  when: [has.ring == 1, seen.room_open == 1]
  background: room_newtenant
  portrait: ev_ring
  title: Комната 3-В
  lines:
    - { who: narrator, text: "Кольцо лежит в кармане и весит больше, чем положено кольцу." }
    - { who: narrator, text: "Коробка «Забыто» стоит на подоконнике, будто её выставили на продажу." }
  choices:
    - do: Посмотреть на тумбочку внимательнее
      when: [memories_returned >= 2, seen.room_card == 0]
      effects: [seen.room_card = 1, clues += 1]
      reply:
        - { who: narrator, text: "В щели у стены застряла визитка. «Ник Кэллоуэй, частный сыск». Твоя." }
        - { who: gut, text: "Наверное, Хейл заходил в контору. Наверное, ты дал ему визитку." }
    - do: Открыть ящик тумбочки
      when: [memories_returned >= 2, visited.floor3.service >= 2, has.contract == 0]
      effects: [has.contract = 1, clues += 1]
      reply:
        - { who: narrator, text: "Договор найма на 3-В, бессрочный. Арендатор: Н. Кэллоуэй. Подпись твоя." }
        - { who: gut, text: "Ты расписываешься так с детства. Ты не помнишь детства." }
    - do: Уйти
      free: true
      goto: floor_03

- id: room_again
  location: service_03
  priority: 1
  when: [visited.floor3.service >= 3, seen.room_open == 1]
  background: room_newtenant
  title: Комната 3-В
  lines:
    - { who: narrator, text: "Кровать опять заправлена туго, по-армейски. На подушке ни вмятины." }
    - { who: narrator, text: "В чистой пепельнице щепотка пепла. Сигарету здесь никто не курил." }
  choices:
    - do: Перебрать коробку
      when: [has.ring == 0, mem.true.ring == 0]
      effects: [has.ring = 1, clues += 1]
      reply:
        - { who: narrator, text: "Часы без стрелок, очки, фотографии с вырезанными лицами. И кольцо: «В. и У. Навсегда»." }
    - do: Найти в коробке кольцо
      when: [has.ring == 0, mem.true.ring == 1]
      effects: [has.ring = 1, clues += 1]
      reply:
        - { who: narrator, text: "Кольцо там же, под фотографиями без лиц." }
        - { who: gut, text: "Теперь ты знаешь, где часовня. Не знаешь, чья рука была в твоей." }
    - do: Уйти
      free: true
      goto: floor_03

- id: room_first
  location: service_03
  when: [seen.room_open == 1]
  background: room_newtenant
  title: Комната 3-В
  lines:
    - { who: narrator, text: "Железная кровать, заправленная туго, как в казарме. Шкаф. Чистая пепельница." }
    - { who: narrator, text: "На подоконнике картонная коробка. Карандашом: «Забыто»." }
    - { who: gut, text: "Здесь никто не живёт дольше одной ночи. Но кто-то здесь живёт всегда." }
  choices:
    - do: Перебрать коробку
      when: [has.ring == 0, mem.true.ring == 0]
      effects: [has.ring = 1, clues += 1]
      reply:
        - { who: narrator, text: "Часы без стрелок, чьи-то очки, фотографии с аккуратно вырезанными лицами." }
        - { who: narrator, text: "На дне — обручальное кольцо. Внутри гравировка: «В. и У. Навсегда»." }
        - { who: gut, text: "Вивиан и Уолтер. Хейл был здесь. И что-то здесь оставил." }
    - do: Найти в коробке кольцо
      when: [has.ring == 0, mem.true.ring == 1]
      effects: [has.ring = 1, clues += 1]
      reply:
        - { who: narrator, text: "Кольцо там же, под фотографиями без лиц." }
        - { who: gut, text: "Теперь ты знаешь, где часовня. Не знаешь, чья рука была в твоей." }
    - do: Открыть шкаф
      when: [seen.room_wardrobe == 0]
      effects: [seen.room_wardrobe = 1]
      reply:
        - { who: narrator, text: "Мужское пальто и шляпа с узкими полями. Карманы вычищены для следующего хозяина." }
        - { who: gut, text: "Как у половины мужчин в Харроу. Как у тебя." }
    - do: Уйти
      free: true
      goto: floor_03

# ── 4. Архив копий. Настоящая и поддельная книга (пара «ledger») ────────────
# Ключ — у Долли (доверие 2). В ночь sloan_lamp дверь открыта. В ночь lights
# замок можно вскрыть без Подозрения: темно, никто не видит.

- id: archive_locked
  location: service_04
  priority: 1
  when: [has.archive_key == 0, seen.archive_open == 0, rumor.sloan_lamp == 0]
  background: landing_04
  title: Архив
  lines:
    - { who: narrator, text: "Замок новый, медь ещё не потемнела." }
    - { who: gut, text: "У Слоуна ключ просить не станешь. У Долли, говорят, есть второй." }
  choices:
    - do: Вскрыть замок
      when: [rumor.lights == 0]
      effects: [seen.archive_open = 1, suspicion += 2]
      reply:
        - { who: narrator, text: "Отмычка, две минуты, мокрые ладони. Щелчок такой громкий, что внизу замолкает радио." }
    - do: Вскрыть замок в темноте
      when: [rumor.lights == 1]
      effects: [seen.archive_open = 1]
      reply:
        - { who: narrator, text: "Свет мигает и гаснет. Отмычка входит на ощупь. Щелчок тонет в темноте." }
    - do: Уйти
      free: true
      goto: floor_04

- id: archive_shelves
  location: service_04
  background: archive
  portrait: ev_ledgers
  title: Архив копий
  lines:
    - { who: narrator, text: "Стеллажи до потолка. «Синий фонарь» занимает целую полку." }
    - { who: narrator, text: "Пыль везде, кроме одной книги на краю и щели между стеллажом и стеной." }
  choices:
    - do: Взять копию с ближней полки
      when: [has.ledger_fake == 0]
      effects: [has.ledger_fake = 1, clues += 1]
      reply:
        - { who: narrator, text: "Чистая книга, ровные столбцы. Март сходится до цента." }
        - { who: gut, text: "Слишком чисто для бухгалтерии портового клуба." }
    - do: Пошарить за стеллажом
      when: [seen.sloan_cashbox == 1, has.ledger_true == 0]
      effects: [has.ledger_true = 1, clues += 1]
      reply:
        - { who: gut, text: "Слоун сказал: деньги вернулись наутро. Значит, есть книга, где они сначала пропали." }
        - { who: narrator, text: "За стеллажом вторая копия на бечёвке. Март, строка 41: «Недостача 4 000. Погашена в ночь на 15-е»." }
    - do: Сравнить с копией Слоуна
      when: [seen.sloan_copy == 1, has.ledger_true == 0, seen.sloan_cashbox == 0]
      effects: [has.ledger_true = 1, clues += 1]
      reply:
        - { who: narrator, text: "Книга на полке — точная копия той, что дал Слоун. Даже клякса на той же странице." }
        - { who: gut, text: "Две подделки делают, когда где-то есть оригинал." }
        - { who: narrator, text: "В щели у стены — третья книга. Март, строка 41: «Недостача 4 000. Погашена в ночь на 15-е»." }
    - do: Сверить две копии
      when: [has.ledger_fake == 1, has.ledger_true == 1, seen.ledger_compare == 0]
      effects: [seen.ledger_compare = 1, clues += 1]
      reply:
        - { who: narrator, text: "Почерк один, бумага одна. Расходятся в одной строке." }
        - { who: gut, text: "Ночь на 15 марта. Запомни эту дату." }
    - do: Уйти
      free: true
      goto: floor_04
