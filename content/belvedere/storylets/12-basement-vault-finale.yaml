# Подвал (Сайлас), хранилище на 13-м, финальная ночь «Подпись».

# ── Подвал. Попадают только через бельевой желоб, выходят пешком в вестибюль.

- id: silas_intro
  location: basement
  priority: 2
  when: [met.silas == 0]
  background: stairwell
  portrait: silas
  title: Подвал
  text: |
    Огромная топка с открытой дверцей, жар бьёт в лицо. Перед ней на ящике сидит старик в бушлате и кормит огонь лопатой угля, неторопливо, как кормят зверя.

    — Сайлас, — говорит он, не оборачиваясь. — Больше ничего не знаю. Остальное продал.
  choices:
    - text: Сесть рядом с огнём
      free: true
      effects: [met.silas = 1]

- id: silas_boiler
  location: basement
  background: stairwell
  portrait: silas
  title: Подвал
  text: |
    Топка гудит. Сайлас охраняет огонь, из которого, говорят, берут пламя для самых важных дел наверху. Сам он мёрзнет даже здесь: тепла ему не хватает с тех пор, как он продал своё прошлое целиком.
  choices:
    - text: Спросить, кем он был
      when: [seen.silas_who == 0]
      effects: [seen.silas_who = 1, debt.silas += 1]
      outcome: |
        — Портовый город. Корабль. Имя на борту — помню, что было, не помню какое. — Он подбрасывает уголь. — Продал всё одним конвертом. Дорого дали. Не на что тратить.
    - text: Прикурить от топки и угостить его
      when: [cigarettes >= 1, seen.silas_cig == 0]
      effects: [seen.silas_cig = 1, cigarettes -= 1, debt.silas += 1]
      outcome: |
        Сайлас берёт сигарету, прикуренную от его же огня, и греет о неё пальцы, как о кружку.

        — Настоящий огонь. Сверху такой не приносят. Сверху приносят только спички.
    - text: Попросить спички
      when: [debt.silas >= 2, has.matches == 0]
      effects: [has.matches = 1, clues += 1]
      outcome: |
        Сайлас достаёт из бушлата коробок и долго держит его на ладони.

        — Это не простые. Ими можно зажечь то, что не горит. Бумагу, которая всё помнит. — Он отдаёт коробок. — Я сам не смог. Не хватило того, что продал.
    - text: Подняться по чёрной лестнице в вестибюль
      effects: [floor = 1]
      goto: floor_01

# ── Хранилище на 13-м. Лифт Долли при доверии 5. ─────────────────────────────

- id: vault_room
  location: vault
  background: vault13
  title: Тринадцатый
  text: |
    Стеллажи уходят в темноту дальше, чем позволяет ширина дома. На каждой полке конверты, перевязанные бечёвкой, на каждом конверте фамилия. Пахнет сургучом и дождём. Единственное окно в торце заложено изнутри конвертами.

    Где-то в глубине тихо шуршит бумага, будто кто-то перелистывает тебя.
  choices:
    - text: Найти конверты на фамилию Кэллоуэй
      when: [seen.vault13 == 0]
      effects: [seen.vault13 = 1, clues += 1]
      outcome: |
        Целая полка. Конверты подписаны твоей рукой, по одному на каждую ночь, когда ты выходил отсюда. Ты помнишь, как отдавал каждый, и не помнишь, что в них было.

        В самом конце полки — пустое место. Аккуратное, как вырезанная страница.
    - text: Найти конверт Вивиан Хейл
      when: [mem.true.name == 1, has.vivian_envelope == 0]
      effects: [has.vivian_envelope = 1, seen.vault13 = 1, clues += 1]
      outcome: |
        Он стоит отдельно, на уровне глаз, будто его ставили для тебя.

        «Залогодатель: Вивиан Хейл. Предмет: память о залоге № 41».

        Конверт тёплый. Внутри — ночь, которую она не помнит. Ночь, когда она отдала тебя, чтобы спасти.
    - text: Чиркнуть спичкой Сайласа
      when: [has.matches == 1, dolly_trust >= 5, memories_returned >= 6]
      ending: ashes
      outcome: |
        Спичка загорается с третьего раза. Огонь не торопится: он пробует бумагу, как пробуют суп. Ты не отходишь.
    - text: Вернуться к лифту
      effects: [floor = 1]
      goto: lobby

# ── Финальная ночь «Подпись» ─────────────────────────────────────────────────
# Открывается, когда вернулось «Тайное» и в папке есть фото подписи и медкарта.
# Ночь начинается не в конторе: Вивиан ждёт в вестибюле.

- id: office_signature
  location: office
  priority: 20
  when: [mem.true.secret == 1, found.signature_photo == 1, found.medical_file == 1]
  background: office_empty
  title: Контора
  text: |
    Половина десятого. Никто не приходит.

    Под дверью записка, почерк Долли: «Она внизу. Сидит у меня с семи. Не заставляй её ждать в этот раз».
  choices:
    - text: Пойти в Белведер
      free: true
      goto: lobby

- id: lobby_vivian
  location: lobby
  priority: 20
  when: [mem.true.secret == 1, found.signature_photo == 1, found.medical_file == 1]
  background: lobby
  portrait: vivian_recognize
  title: Вестибюль
  text: |
    Вивиан сидит на табурете Долли. Трость прислонена к стойке точно так же, как на снимке Мэй Тан, только стойка другая. Долли стоит у шахты лифта и впервые не вяжет.

    — Мистер Кэллоуэй, — говорит Вивиан. — Долли сказала, вы что-то нашли.

    Ты знаешь, что она сделала. Она — нет.
  choices:
    - text: Простить и ничего не говорить
      ending: signature_forgive
    - text: Рассказать ей правду
      ending: signature_truth
    - text: Оставить письмо у Долли и уйти
      ending: signature_letter
