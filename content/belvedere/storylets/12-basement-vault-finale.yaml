# Подвал (Сайлас), хранилище на 13-м, финальная ночь «Подпись» (v2, реплики).

# ── Подвал. Попадают только через бельевой желоб, выходят пешком в вестибюль.
# Слой лора: огонь Сайласа «с той ночи» → knows.fire.

- id: silas_intro
  location: basement
  priority: 2
  when: [met.silas == 0]
  background: stairwell
  portrait: silas
  title: Подвал
  lines:
    - { who: narrator, text: "Огромная топка, жар в лицо. Старик в бушлате кормит огонь углём, неторопливо, как кормят зверя." }
    - { who: silas, text: "Сайлас. Больше ничего не знаю. Остальное продал." }
  choices:
    - do: Сесть рядом с огнём
      free: true
      effects: [met.silas = 1]

- id: silas_boiler
  location: basement
  background: stairwell
  portrait: silas
  title: Подвал
  lines:
    - { who: narrator, text: "Топка гудит. Сайлас мёрзнет даже здесь: тепла не хватает с тех пор, как он продал прошлое целиком." }
  choices:
    - say: Кем вы были?
      when: [seen.silas_who == 0]
      effects: [seen.silas_who = 1, debt.silas += 1]
      reply:
        - { who: silas, text: "Портовый город. Корабль. Помню, что на борту было имя. Не помню какое." }
        - { who: silas, text: "Продал всё одним конвертом. Дорого дали. Не на что тратить." }
    - say: Зачем вы держите этот огонь?
      when: [seen.silas_fire == 0]
      effects: [seen.silas_fire = 1, knows.fire = 1, clues += 1]
      reply:
        - { who: silas, text: "Я его держу с той ночи. Если погаснет — ему некуда будет вернуться." }
        - { who: gut, text: "Старик заговаривается. Кочегары все немного заговариваются." }
    - do: Прикурить от топки и угостить его
      when: [cigarettes >= 1, seen.silas_cig == 0]
      effects: [seen.silas_cig = 1, cigarettes -= 1, debt.silas += 1]
      reply:
        - { who: narrator, text: "Сайлас греет пальцы о сигарету, прикуренную от его же огня, как о кружку." }
        - { who: silas, text: "Настоящий огонь. Сверху такой не приносят. Сверху приносят только спички." }
    # Спички — только тому, кто знает, что жечь (запись № 1). Иначе Сайлас объясняет отказ.
    - say: Дадите спички?
      when: [debt.silas >= 2, has.matches == 0, knows.tomorrow == 1]
      effects: [has.matches = 1, clues += 1]
      reply:
        - { who: silas, text: "Ты знаешь, что там лежит первым. Тогда бери." }
        - { who: silas, text: "Этими зажигают то, что не горит. Бумагу, которая всё помнит. Я сам не смог." }
    - say: Дадите спички?
      when: [debt.silas >= 2, has.matches == 0, knows.tomorrow == 0, seen.silas_refused == 0]
      effects: [seen.silas_refused = 1]
      reply:
        - { who: silas, text: "Зачем тебе? Ты не знаешь, что жечь." }
        - { who: silas, text: "Узнаешь, что заложено первым, — приходи. Раньше огонь тебе не поможет." }
    - do: Подняться по чёрной лестнице в вестибюль
      effects: [floor = 1]
      goto: floor_01

# ── Хранилище на 13-м. Лифт Долли при доверии 5. ─────────────────────────────

- id: vault_room
  location: vault
  background: vault13
  title: Тринадцатый
  lines:
    - { who: narrator, text: "Стеллажи уходят в темноту дальше, чем позволяет ширина дома. Конверты на бечёвке, на каждом фамилия." }
    - { who: narrator, text: "Пахнет сургучом и дождём. Окно в торце заложено изнутри конвертами." }
    - { who: gut, text: "Где-то в глубине шуршит бумага. Будто кто-то перелистывает тебя." }
  choices:
    - do: Найти конверты на фамилию Кэллоуэй
      when: [seen.vault13 == 0]
      effects: [seen.vault13 = 1, clues += 1]
      reply:
        - { who: narrator, text: "Целая полка. Конверты подписаны твоей рукой, по одному на каждую ночь, когда ты выходил отсюда." }
        - { who: narrator, text: "В конце полки пустое место. Аккуратное, как вырезанная страница." }
    - do: Найти конверт Вивиан Хейл
      when: [mem.true.name == 1, has.vivian_envelope == 0]
      effects: [has.vivian_envelope = 1, seen.vault13 = 1, clues += 1]
      reply:
        - { who: narrator, text: "Он стоит отдельно, на уровне глаз. «Залогодатель: Вивиан Хейл. Предмет: память о залоге № 41»." }
        - { who: gut, text: "Конверт тёплый. Внутри ночь, когда она отдала тебя, чтобы спасти." }
    # Огонь возвращает всё заложенное, конверт Вивиан тоже. Но чиркнуть решится только тот,
    # кто вернул себе почти всё (7 из 8): иначе жечь не за что.
    - do: Чиркнуть спичкой Сайласа
      when: [has.matches == 1, knows.tomorrow == 1, memories_returned >= 7]
      ending: ashes
      reply:
        - { who: narrator, text: "Спичка загорается с третьего раза. Огонь пробует бумагу, как пробуют суп. Ты не отходишь." }
    - do: Подержать спичку и не чиркать
      when: [has.matches == 1, memories_returned < 7, seen.vault_hesitate == 0]
      free: true
      effects: [seen.vault_hesitate = 1]
      reply:
        - { who: gut, text: "Огонь вернёт всем их конверты. А тебе — что? Ты ещё не знаешь, кем был." }
        - { who: gut, text: "Сначала верни себе себя. Потом жги." }
    - do: Вернуться к лифту
      effects: [floor = 1]
      goto: lobby

# ── Финальная ночь «Подпись» ─────────────────────────────────────────────────
# Открывается, когда вернулось «Тайное» и в папке есть фото подписи и медкарта.
# Ночь начинается не в конторе: Вивиан ждёт в вестибюле.

- id: office_signature
  location: office
  priority: 20
  when: [mem.true.secret == 1, found.signature_photo == 1, found.medical_file == 1]
  background: office_empty
  title: Контора
  lines:
    - { who: narrator, text: "Половина десятого. Никто не стучит." }
    - { who: gut, text: "Впервые за все вечера она не пришла. Ты знаешь, где её искать." }
  choices:
    - do: Пойти в Белведер
      free: true
      goto: lobby

- id: lobby_vivian
  location: lobby
  priority: 20
  when: [mem.true.secret == 1, found.signature_photo == 1, found.medical_file == 1]
  background: lobby
  portrait: vivian_recognize
  title: Вестибюль
  lines:
    - { who: narrator, text: "Вивиан на табурете Долли. Трость у стойки, как на снимке Мэй. Долли впервые не вяжет." }
    - { who: vivian, text: "Мистер Кэллоуэй. Я сама пришла. Долли сказала, вы что-то нашли." }
    - { who: gut, text: "Ты знаешь, что она сделала. Она — нет." }
  choices:
    - do: Простить и ничего не говорить
      ending: signature_forgive
    - do: Рассказать ей правду
      ending: signature_truth
    - do: Оставить письмо у Долли и уйти
      ending: signature_letter
