# Жильцы 5–8. Схема прежняя: intro (первый визит за игру) → hub.
# Пары воспоминаний этого блока:
#   lantern  — пластинка Руби (has.ruby_record)
#   hospital — медкарта Вивиан (has.medical_file)
#   voice    — два должка Руби за ночь (debt.ruby >= 2)

# ── 5. Мэй Тан, фотограф ─────────────────────────────────────────────────────

- id: mei_intro
  location: tenant_05
  priority: 2
  when: [visited.floor5.tenant == 1, seen.mei_intro == 0]
  background: landing_05
  portrait: mei
  title: Студия фотографа
  text: |
    Женщина в мужском пиджаке развешивает мокрые снимки на бельевой верёвке. На всех один и тот же город, и ни на одном нет солнца.

    — Мэй Тан. Не трогайте ничего красного. — Она усмехается. — Шутка. Я не вижу, что тут красное. Я продала цвета. Все сразу, за одну ночь.
  choices:
    - text: Посмотреть на снимки
      free: true
      effects: [seen.mei_intro = 1, met.mei = 1]

- id: mei_studio
  location: tenant_05
  background: landing_05
  portrait: mei
  title: Студия Мэй Тан
  text: |
    Верёвки со снимками, штатив, банки с химией. Мэй снимает быстро, будто торопится отснять город, пока он не исчез. На тебя она смотрит через видоискатель чаще, чем глазами.
  choices:
    - text: Спросить, снимала ли она Хейла
      when: [seen.mei_hale == 0]
      effects: [seen.mei_hale = 1, clues += 1]
      outcome: |
        — Я снимаю дом, а не жильцов. — Пауза. — Но дом иногда попадает в кадр вместе с жильцами. Ищите в лаборатории. Только плёнку не засветите.
    - text: Помочь развесить снимки
      when: [seen.mei_help == 0]
      effects: [seen.mei_help = 1, debt.mei += 1]
      outcome: |
        Вы молча развешиваете город по верёвкам. Порт, вокзал, «Синий фонарь» с погашенной вывеской. Мэй кивает, не глядя.

        — Лаборатория открыта. Для вас.
    - text: Спросить, зачем она продала цвета
      when: [seen.mei_colors == 0]
      effects: [seen.mei_colors = 1]
      outcome: |
        — Последнее, что я видела в цвете, было красное платье. Хотела, чтобы оно таким и осталось. — Она поднимает камеру. — Не шевелитесь. Вы хорошо смотритесь в сером.
    - text: Уйти
      free: true
      goto: floor_05

# ── 6. Тони «Двойка» Риццо ───────────────────────────────────────────────────

- id: tony_intro
  location: tenant_06
  priority: 2
  when: [visited.floor6.tenant == 1, seen.tony_intro == 0]
  background: landing_06
  portrait: tony
  title: Спортзал
  text: |
    Здоровяк в майке бьёт мешок так, будто мешок ему должен. Не оборачивается.

    — Тони Риццо. Двойка — потому что второй раз никто не просит. — Удар. — Ты детектив. Владелец сказал, ты придёшь. Сказал проводить.

    — Куда?

    — Не сказал.
  choices:
    - text: Остаться стоять
      free: true
      effects: [seen.tony_intro = 1, met.tony = 1]

- id: tony_gym
  location: tenant_06
  background: landing_06
  portrait: tony
  title: Спортзал Тони
  text: |
    Мешок, ринг с провисшими канатами, окно на пожарную лестницу. Тони выбивает долги из жильцов для Владельца и, кажется, не чувствует собственных ударов.
  choices:
    - text: Спросить про Хейла
      when: [seen.tony_hale == 0]
      effects: [seen.tony_hale = 1, seen.tony_lead = 1]
      outcome: |
        — Хейл? — Тони смеётся, не переставая бить. — Хейл в порту. На дне. Я сам видел, как его выносили. Ищи в «Курьере», там про это было.

        Он говорит слишком уверенно для человека, который ничего не видел.
    - text: Откупиться сигаретой
      when: [cigarettes >= 1, seen.tony_paid == 0]
      effects: [seen.tony_paid = 1, cigarettes -= 1, suspicion -= 1]
      outcome: |
        Тони берёт сигарету и суёт за бинт на запястье.

        — Я тебя не видел. Ты меня тоже.
    - text: Выйти на ринг
      effects: [suspicion += 1, turn += 1, paths.fire_escape = 1, seen.tony_fight = 1]
      outcome: |
        Ты держишься полтора раунда. Потом потолок меняется местами с полом, рама окна бьёт по спине, и в лицо хлещет дождь.

        Ты лежишь на площадке пожарной лестницы. Сверху высовывается Тони:

        — Не обижайся. Владелец сказал проводить. Наверх — там. — Окно захлопывается.
      goto: fire_escape
    - text: Уйти
      free: true
      goto: floor_06

# ── 7. Руби Вэнс, певица без голоса ──────────────────────────────────────────

- id: ruby_intro
  location: tenant_07
  priority: 2
  when: [visited.floor7.tenant == 1, seen.ruby_intro == 0]
  background: landing_07
  portrait: ruby
  title: Квартира певицы
  text: |
    Женщина в шёлковом халате открывает дверь, смотрит на тебя и пишет на салфетке. Почерк крупный, как у человека, привыкшего к афишам.

    «Руби Вэнс. Голоса нет. Не спрашивайте где».

    Вторая салфетка: «Ты пахнешь, как он».
  choices:
    - text: Войти
      free: true
      effects: [seen.ruby_intro = 1, met.ruby = 1]

- id: ruby_recognizes
  location: tenant_07
  priority: 3
  when: [mem.true.lantern == 1, seen.ruby_recognized == 0]
  background: landing_07
  portrait: ruby_recognize
  title: Квартира Руби
  text: |
    Руби поднимает глаза и роняет карандаш. Долго смотрит, потом пишет, не отрывая взгляда от тебя:

    «Третий столик слева. Ты всегда сидел за третьим столиком слева и считал выручку в уме, пока я пела».
  choices:
    - text: Сказать, что помнишь
      effects: [seen.ruby_recognized = 1, debt.ruby += 1, clues += 1]
      outcome: |
        Руби закрывает лицо руками. Плечи у неё трясутся без звука.

        Потом она пишет одно слово и подчёркивает дважды: «Уолтер».
    - text: Сказать, что она обозналась
      effects: [seen.ruby_recognized = 1]
      outcome: |
        Руби кивает слишком быстро. Рвёт салфетку пополам.

        «Да. Конечно. Он бы меня не забыл».

- id: ruby_room
  location: tenant_07
  background: landing_07
  portrait: ruby
  title: Квартира Руби
  text: |
    Афиши «Синего фонаря» на стенах, стопка салфеток на столе, патефон без пластинки. Руби курит, потому что терять голос ей уже нечего.
  choices:
    - text: Спросить, как кто
      when: [seen.ruby_who == 0]
      effects: [seen.ruby_who = 1]
      outcome: |
        Руби пишет, зачёркивает, пишет снова:

        «Как человек, который считал чужие деньги и не взял себе ни цента. Почти ни цента».
    - text: Спросить про Хейла
      when: [seen.ruby_hale == 0]
      effects: [seen.ruby_hale = 1, clues += 1]
      outcome: |
        «Не знаю такого».

        Карандаш ломается у неё в пальцах.
    - text: Угостить сигаретой
      when: [cigarettes >= 1, seen.ruby_cig == 0]
      effects: [seen.ruby_cig = 1, cigarettes -= 1, debt.ruby += 1]
      outcome: |
        Руби прикуривает от твоей спички и впервые улыбается.

        «Спасибо. Здесь никто не угощает. Все боятся, что я попрошу что-то ещё».
    - text: Попросить поставить пластинку
      when: [seen.ruby_listen == 0]
      effects: [seen.ruby_listen = 1, debt.ruby += 1, turn += 1]
      outcome: |
        Руби приносит из гримёрной пластинку, ставит иглу и садится напротив. Из патефона поёт её голос: тёплый, низкий, совсем живой.

        Она слушает себя с закрытыми глазами. Когда пластинка кончается, пишет: «Возьми её. Мне больнее, когда она здесь».
    - text: Взять пластинку
      when: [seen.ruby_listen == 1, has.ruby_record == 0]
      effects: [has.ruby_record = 1, clues += 1]
      outcome: |
        На конверте: «Руби Вэнс. Синий фонарь, 1941». И карандашом, другой рукой: «Для У., третий столик слева».
    - text: Уйти
      free: true
      goto: floor_07

# ── 8. Доктор Сэмюэль Ауэрбах ────────────────────────────────────────────────
# Принимает до полуночи (turn < 4). Успеть можно только грузовым лифтом.

- id: auerbach_shock
  location: tenant_08
  priority: 3
  when: [mem.true.hospital == 1, seen.auerbach_shocked == 0]
  background: landing_08
  portrait: auerbach_shock
  title: Приёмная доктора
  text: |
    Доктор поднимает глаза от карточки и бледнеет так, что видны вены на висках.

    — Вы… — Он снимает очки и надевает обратно. — Вы стояли в коридоре всю ночь. Вы не садились. Сестра приносила вам стул, а вы не садились.
  choices:
    - text: Спросить, какую ночь
      effects: [seen.auerbach_shocked = 1, debt.auerbach += 1, clues += 1]
      outcome: |
        — Ночь операции. Миссис Хейл. — Он сцепляет руки, чтобы не дрожали. — Вы заплатили наличными. Четыре тысячи, мятыми купюрами. Я не спросил, откуда. Я никогда не спрашиваю.

- id: auerbach_intro
  location: tenant_08
  priority: 2
  when: [visited.floor8.tenant == 1, seen.auerbach_intro == 0]
  background: landing_08
  portrait: auerbach
  title: Приёмная доктора
  text: |
    Седой человек в белом халате моет руки и не оборачивается. Моет долго, как моют то, что не отмывается.

    — Доктор Ауэрбах. Приём до полуночи, и вы успели. Немногие успевают.
  choices:
    - text: Сесть на кушетку
      free: true
      effects: [seen.auerbach_intro = 1]

- id: auerbach_office
  location: tenant_08
  background: landing_08
  portrait: auerbach
  title: Приёмная Ауэрбаха
  text: |
    Кушетка, шкаф с инструментами, диплом в рамке. Доктор Ауэрбах хочет одного: спокойно спать. По мешкам под глазами — давно не получается.
  choices:
    - text: Спросить про Вивиан Хейл
      when: [seen.auerbach_vivian == 0]
      effects: [seen.auerbach_vivian = 1]
      outcome: |
        — Не помню такой пациентки. — Он отвечает быстро и смотрит на шкаф с карточками. — У меня много пациентов, мистер Кэллоуэй.
    - text: Спросить, за что он не может спать
      when: [seen.auerbach_sleep == 0]
      effects: [seen.auerbach_sleep = 1, debt.auerbach += 1]
      outcome: |
        Доктор долго молчит.

        — Я заложил лицо одной девочки. Она лежала у меня на столе, и я ничего не смог. Теперь я не помню её лица, а сплю всё равно плохо. — Он усмехается. — Обман. Здесь всё обман, кроме цены.
    - text: Попросить карточку Вивиан Хейл
      when: [debt.auerbach >= 1, has.medical_file == 0]
      effects: [has.medical_file = 1, clues += 1]
      outcome: |
        Доктор достаёт карточку, не глядя: знает, где она лежит.

        «Хейл, Вивиан, 33 г. Перелом таза, внутреннее кровотечение. Операция: 4 000, оплачено наличными. Плательщик: У. Хейл».

        — Забирайте, — говорит он. — И не приходите больше до полуночи.
    - text: Уйти
      free: true
      goto: floor_08
