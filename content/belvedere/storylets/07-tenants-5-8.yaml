# Жильцы 5–8 (v2, реплики). Схема: intro (первый визит за игру) → hub.
# Пары воспоминаний этого блока:
#   lantern  — пластинка Руби (has.ruby_record)
#   hospital — медкарта Вивиан (has.medical_file)
#   voice    — два должка Руби за ночь (debt.ruby >= 2)
# Поручительства: Мэй (вынести негативы), Руби (послушать пластинку, не украв),
# Ауэрбах (выслушать про девочку и не судить).

# ── 5. Мэй Тан, фотограф ─────────────────────────────────────────────────────
# Хочет: отснять дом, пока он не исчез. Скрывает: снимала Хейла, и не только его.

- id: mei_intro
  location: tenant_05
  priority: 2
  when: [visited.floor5.tenant == 1, seen.mei_intro == 0, met.mei == 0]
  background: landing_05
  portrait: mei
  title: Студия фотографа
  lines:
    - { who: narrator, text: "Женщина в мужском пиджаке развешивает мокрые снимки на верёвке. Один город, и ни на одном нет солнца." }
    - { who: mei, text: "Мэй Тан. Не трогайте ничего красного." }
    - { who: mei, text: "Шутка. Я не вижу, что тут красное. Я продала цвета. Все сразу, за одну ночь." }
  choices:
    - do: Посмотреть на снимки
      free: true
      effects: [seen.mei_intro = 1, met.mei = 1]

- id: mei_studio
  location: tenant_05
  background: landing_05
  portrait: mei
  title: Студия Мэй Тан
  lines:
    - { who: narrator, text: "Верёвки со снимками, штатив, банки с химией. На тебя Мэй смотрит через видоискатель чаще, чем глазами." }
    - { who: narrator, text: "Над столом приколота пожелтевшая газетная вырезка.", when: [nights >= 3, knows.fire == 0] }
  choices:
    - say: Вы снимали Хейла?
      when: [seen.mei_hale == 0]
      effects: [seen.mei_hale = 1, clues += 1]
      reply:
        - { who: mei, text: "Я снимаю дом, а не жильцов. Но дом иногда попадает в кадр вместе с ними." }
        - { who: narrator, text: "Три снимка лестницы. Один и тот же мужчина в шляпе, три разных дня: разные газеты под мышкой." }
        - { who: gut, text: "Шляпа с узкими полями. Он здесь не ночевал. Он здесь жил." }
    - do: Помочь развесить снимки
      when: [seen.mei_help == 0]
      effects: [seen.mei_help = 1, debt.mei += 1]
      reply:
        - { who: narrator, text: "Порт, вокзал, «Синий фонарь» с погашенной вывеской. Мэй кивает, не глядя." }
        - { who: mei, text: "Лаборатория открыта. Для вас." }
        - { who: mei, text: "Горман грозится изъять негативы. Мне бы кто спрятал коробку. В шахту лифта он не полезет.", when: [vouch.mei == 0] }
    - do: Спрятать коробку с негативами
      when: [seen.mei_help == 1, vouch.mei == 0]
      effects: [vouch.mei = 1, vouches += 1, seen.mei_saved = 1, dolly_trust += 1, suspicion += 2, turn += 1]
      reply:
        - { who: narrator, text: "Коробка тяжёлая, как чемодан кирпичей. Ты спускаешь её на тросе в мёртвую шахту лифта." }
        - { who: narrator, text: "Снизу трос дёргают два раза. Долли приняла груз и ничего не спросила. Такое она запоминает." }
        - { who: mei, text: "Наверху спросят, кто вы. Скажу: человек, который умеет держать чужое." }
    - say: Что это за вырезка?
      when: [nights >= 3, knows.fire == 0]
      effects: [knows.fire = 1, seen.mei_clipping = 1, clues += 1]
      reply:
        - { who: narrator, text: "«Харроу Курьер», одиннадцать лет назад: «Пожар в корпусе у товарной станции. Погибших нет. Жильцы не найдены»." }
        - { who: mei, text: "Висела тут, когда я въехала. Не снимаю — привыкла." }
        - { who: gut, text: "У товарной станции три похожих корпуса. Это ничего не значит." }
    - say: Зачем вы продали цвета?
      when: [seen.mei_colors == 0]
      effects: [seen.mei_colors = 1]
      reply:
        - { who: mei, text: "Последнее, что я видела в цвете, — красное платье. Хотела, чтобы оно таким и осталось." }
        - { who: mei, text: "Не шевелитесь. Вы хорошо смотритесь в сером." }
    - do: Уйти
      free: true
      goto: floor_05

# ── 6. Тони «Двойка» Риццо ───────────────────────────────────────────────────
# Хочет: чтобы Владелец был доволен. Скрывает: сам не знает, кому служит.

- id: tony_away
  location: tenant_06
  priority: 5
  when: [rumor.tony_out == 1]
  background: landing_06
  title: Спортзал
  lines:
    - { who: narrator, text: "Пусто. Мешок покачивается на цепи. Окно на пожарную лестницу открыто настежь." }
    - { who: gut, text: "Тони внизу, у Сайласа, таскает уголь. Сегодня проводить некому." }
  choices:
    - do: Вылезти на пожарную лестницу
      effects: [paths.fire_escape = 1, floor = 6]
      goto: fire_escape
    - do: Уйти
      free: true
      goto: floor_06

- id: tony_intro
  location: tenant_06
  priority: 2
  when: [visited.floor6.tenant == 1, seen.tony_intro == 0, met.tony == 0]
  background: landing_06
  portrait: tony
  title: Спортзал
  lines:
    - { who: narrator, text: "Здоровяк в майке бьёт мешок так, будто мешок ему должен." }
    - { who: tony, text: "Тони Риццо. Двойка — потому что второй раз никто не просит." }
    - { who: tony, text: "Ты детектив. Владелец сказал, ты придёшь. Сказал проводить. Куда — не сказал." }
  choices:
    - do: Остаться стоять
      free: true
      effects: [seen.tony_intro = 1, met.tony = 1]

- id: tony_gym
  location: tenant_06
  background: landing_06
  portrait: tony
  title: Спортзал Тони
  lines:
    - { who: narrator, text: "Мешок, ринг с провисшими канатами, окно на пожарную лестницу. Тони бьёт и не чувствует своих ударов." }
  choices:
    - say: Где Хейл?
      when: [seen.tony_hale == 0]
      effects: [seen.tony_hale = 1, seen.tony_lead = 1]
      reply:
        - { who: tony, text: "Хейл в порту. На дне. Сам видел, как выносили. В «Курьере» было." }
        - { who: gut, text: "Слишком уверенно для человека, который ничего не видел." }
    - do: Откупиться сигаретой
      when: [cigarettes >= 1, seen.tony_paid == 0]
      effects: [seen.tony_paid = 1, cigarettes -= 1, suspicion -= 1]
      reply:
        - { who: narrator, text: "Тони суёт сигарету за бинт на запястье." }
        - { who: tony, text: "Я тебя не видел. Ты меня тоже." }
    - do: Выйти на ринг
      effects: [suspicion += 1, turn += 1, paths.fire_escape = 1, seen.tony_fight = 1]
      reply:
        - { who: narrator, text: "Полтора раунда. Потом потолок меняется местами с полом, рама бьёт по спине, в лицо хлещет дождь." }
        - { who: tony, text: "Не обижайся. Владелец сказал проводить. Наверх — там." }
      goto: fire_escape
    - do: Уйти
      free: true
      goto: floor_06

# ── 7. Руби Вэнс, певица без голоса ──────────────────────────────────────────
# Хочет: снова петь. Скрывает: любила Уолтера, и он сидел за третьим столиком слева.

- id: ruby_intro
  location: tenant_07
  priority: 2
  when: [visited.floor7.tenant == 1, seen.ruby_intro == 0, met.ruby == 0]
  background: landing_07
  portrait: ruby
  title: Квартира певицы
  lines:
    - { who: narrator, text: "Женщина в шёлковом халате смотрит на тебя и пишет на салфетке крупным афишным почерком." }
    - { who: ruby, text: "«Руби Вэнс. Голоса нет. Не спрашивайте где»." }
    - { who: ruby, text: "«Ты пахнешь, как он»." }
  choices:
    - do: Войти
      free: true
      effects: [seen.ruby_intro = 1, met.ruby = 1]

- id: ruby_recognizes
  location: tenant_07
  priority: 3
  when: [mem.true.lantern == 1, met.ruby_recognized == 0]
  background: landing_07
  portrait: ruby_recognize
  title: Квартира Руби
  lines:
    - { who: narrator, text: "Руби поднимает глаза и роняет карандаш. Пишет, не отводя взгляда." }
    - { who: ruby, text: "«Третий столик слева. Ты всегда сидел там и считал выручку в уме, пока я пела»." }
  choices:
    - say: Я помню
      effects: [seen.ruby_recognized = 1, met.ruby_recognized = 1, seen.ruby_said_remember = 1, met.ruby_voice = 1, knows.ruby_coffee = 1, debt.ruby += 1, clues += 1]
      reply:
        - { who: narrator, text: "Руби закрывает лицо руками. Плечи трясутся без звука." }
        - { who: ruby, text: "«Уолтер». Дважды подчёркнуто." }
    - say: Вы обознались
      effects: [seen.ruby_recognized = 1, met.ruby_recognized = 1, knows.ruby_coffee = 1]
      reply:
        - { who: narrator, text: "Руби кивает слишком быстро и рвёт салфетку пополам." }
        - { who: ruby, text: "«Да. Конечно. Он бы меня не забыл»." }

- id: ruby_room
  location: tenant_07
  background: landing_07
  portrait: ruby
  title: Квартира Руби
  lines:
    - { who: narrator, text: "Афиши «Синего фонаря», стопка салфеток, патефон с пыльной пластинкой. Руби курит: терять голос ей уже нечего." }
  choices:
    - say: Как кто я пахну?
      when: [seen.ruby_intro == 1, seen.ruby_who == 0]
      effects: [seen.ruby_who = 1]
      reply:
        - { who: ruby, text: "«Как человек, который считал чужие деньги и не взял себе ни цента»." }
        - { who: ruby, text: "«Почти ни цента»." }
    - say: Вы знали Хейла?
      when: [seen.ruby_hale == 0, met.ruby_recognized == 0]
      effects: [seen.ruby_hale = 1, clues += 1]
      reply:
        - { who: ruby, text: "«Не знаю такого»." }
        - { who: narrator, text: "Карандаш ломается у неё в пальцах." }
    # Знание из гримёрной: «Для У., третий столик слева».
    - say: Кто такой «У.»?
      when: [knows.ruby_u == 1, knows.ruby_coffee == 0]
      effects: [seen.ruby_u = 1, knows.ruby_coffee = 1, clues += 1]
      reply:
        - { who: ruby, text: "«Не твоё дело»." }
        - { who: ruby, text: "«Он пил кофе. Две ложки сахара, без молока»." }
        - { who: gut, text: "Как ты." }
    - do: Угостить сигаретой
      when: [cigarettes >= 1, seen.ruby_cig == 0]
      effects: [seen.ruby_cig = 1, cigarettes -= 1, debt.ruby += 1]
      reply:
        - { who: narrator, text: "Руби прикуривает от твоей спички и впервые улыбается." }
        - { who: ruby, text: "«Здесь никто не угощает. Боятся, что я попрошу что-то ещё»." }
    # Поручительство: послушать пластинку с ней, если этой ночью её не крали из гримёрной.
    - say: Поставите пластинку?
      when: [seen.ruby_listen == 0, seen.record_stolen == 0, vouch.ruby == 0]
      effects: [seen.ruby_listen = 1, met.ruby_voice = 1, debt.ruby += 1, turn += 1, vouch.ruby = 1, vouches += 1, seen.ruby_vouched = 1]
      reply:
        - { who: narrator, text: "Из патефона поёт её голос: тёплый, низкий, живой. Руби слушает с закрытыми глазами." }
        - { who: gut, text: "Этот голос ты слышал раньше. Не на пластинке. Ближе." }
        - { who: ruby, text: "«Возьми её. И если наверху спросят — я за тебя напишу. Крупно»." }
    - say: Поставите пластинку?
      when: [seen.ruby_listen == 0, seen.record_stolen == 0, vouch.ruby == 1]
      effects: [seen.ruby_listen = 1, met.ruby_voice = 1, debt.ruby += 1, turn += 1]
      reply:
        - { who: narrator, text: "Из патефона поёт её голос: тёплый, низкий, живой. Руби слушает с закрытыми глазами." }
        - { who: gut, text: "Этот голос ты слышал раньше. Не на пластинке. Ближе." }
        - { who: ruby, text: "«Возьми её. Мне больнее, когда она здесь»." }
    - do: Взять пластинку
      when: [seen.ruby_listen == 1, has.ruby_record == 0]
      effects: [has.ruby_record = 1, clues += 1]
      reply:
        - { who: narrator, text: "На конверте: «Руби Вэнс. Синий фонарь, 1941». И другой рукой: «Для У., третий столик слева»." }
    - do: Уйти
      free: true
      goto: floor_07

# ── 8. Доктор Сэмюэль Ауэрбах ────────────────────────────────────────────────
# Хочет: спокойно спать. Скрывает: оперировал Вивиан за ворованные деньги и не спросил откуда.

- id: auerbach_shock
  location: tenant_08
  priority: 3
  when: [mem.true.hospital == 1, met.auerbach_shocked == 0]
  background: landing_08
  portrait: auerbach_shock
  title: Приёмная доктора
  lines:
    - { who: narrator, text: "Доктор поднимает глаза от карточки и бледнеет так, что видны вены на висках." }
    - { who: auerbach, text: "Вы стояли в коридоре всю ночь. Сестра приносила стул, а вы не садились." }
  choices:
    - say: Какую ночь?
      effects: [seen.auerbach_shocked = 1, met.auerbach_shocked = 1, debt.auerbach += 1, clues += 1]
      reply:
        - { who: auerbach, text: "Ночь операции. Миссис Хейл." }
        - { who: auerbach, text: "Вы заплатили наличными. Четыре тысячи, мятыми купюрами. Я не спросил, откуда. Я никогда не спрашиваю." }

- id: auerbach_intro
  location: tenant_08
  priority: 2
  when: [visited.floor8.tenant == 1, seen.auerbach_intro == 0]
  background: landing_08
  portrait: auerbach
  title: Приёмная доктора
  lines:
    - { who: narrator, text: "Седой человек в халате моет руки и не оборачивается. Моет долго, как моют то, что не отмывается." }
    - { who: auerbach, text: "Доктор Ауэрбах. Приём до полуночи, и вы успели. Немногие успевают.", when: [turn < 4] }
    - { who: auerbach, text: "Доктор Ауэрбах. Сегодня я до двух. Не спится — ни мне, ни вам.", when: [turn >= 4] }
  choices:
    - do: Сесть на кушетку
      free: true
      effects: [seen.auerbach_intro = 1]

- id: auerbach_office
  location: tenant_08
  background: landing_08
  portrait: auerbach
  title: Приёмная Ауэрбаха
  lines:
    - { who: narrator, text: "Кушетка, шкаф с инструментами, диплом в рамке. По мешкам под глазами доктор давно не спит." }
  choices:
    - say: У вас лечилась Вивиан Хейл?
      when: [seen.auerbach_vivian == 0, met.auerbach_shocked == 0]
      effects: [seen.auerbach_vivian = 1]
      reply:
        - { who: auerbach, text: "Не помню такой пациентки. У меня много пациентов, мистер Кэллоуэй." }
        - { who: gut, text: "Он смотрит на шкаф с карточками." }
    - say: Почему вы не спите?
      when: [seen.auerbach_sleep == 0]
      effects: [seen.auerbach_sleep = 1, debt.auerbach += 1]
      reply:
        - { who: auerbach, text: "Я заложил лицо одной девочки. Она лежала у меня на столе, и я ничего не смог." }
        - { who: auerbach, text: "Теперь не помню её лица, а сплю всё равно плохо. Здесь всё обман, кроме цены." }
    # Поручительство: выслушать и не судить. Осудить можно, но тогда доктор закрывается.
    - do: Промолчать
      when: [seen.auerbach_sleep == 1, seen.auerbach_answered == 0, vouch.auerbach == 0]
      effects: [seen.auerbach_answered = 1, vouch.auerbach = 1, vouches += 1, seen.auerbach_vouched = 1]
      reply:
        - { who: narrator, text: "Ты молчишь. Доктор впервые садится." }
        - { who: auerbach, text: "Спасибо. Все говорят «вы не виноваты». Это хуже." }
        - { who: auerbach, text: "Если наверху спросят — я подпишусь. Я всё подписываю. Это хоть раз будет правдой." }
    - say: Вы продали её, чтобы спать
      when: [seen.auerbach_sleep == 1, seen.auerbach_answered == 0, vouch.auerbach == 0]
      effects: [seen.auerbach_answered = 1, seen.auerbach_judged = 1, suspicion += 1]
      reply:
        - { who: auerbach, text: "Да. И не выспался. Приём окончен, мистер Кэллоуэй." }
    - say: Покажите карточку Вивиан Хейл
      when: [debt.auerbach >= 1, has.medical_file == 0, seen.auerbach_judged == 0]
      effects: [has.medical_file = 1, clues += 1]
      reply:
        - { who: narrator, text: "Доктор достаёт карточку не глядя. «Хейл, Вивиан, 33 г. Операция: 4 000, наличными. Плательщик: У. Хейл»." }
        - { who: auerbach, text: "Забирайте. И не приходите больше до полуночи." }
    - do: Уйти
      free: true
      goto: floor_08
