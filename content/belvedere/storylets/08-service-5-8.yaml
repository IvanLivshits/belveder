# Служебные комнаты 5, 7, 8. (Служебная дверь 6 — окно на пожарную лестницу.)

# ── 5. Фотолаборатория. Фото фасада: тринадцать рядов окон ───────────────────
# Пускают по должку Мэй или по ключу Эдди.

- id: darkroom_locked
  location: service_05
  priority: 1
  when: [debt.mei == 0, has.darkroom_key == 0]
  background: landing_05
  title: Фотолаборатория
  text: |
    Красная лампа над дверью горит: «Не входить, идёт проявка». Дверь заперта изнутри на щеколду, снаружи — на ключ. Мэй не любит, когда к её плёнкам приходят без спроса.
  choices:
    - text: Уйти
      free: true
      goto: floor_05

- id: darkroom
  location: service_05
  background: darkroom
  title: Фотолаборатория
  text: |
    Красный свет, кюветы, верёвка с прищепками. На столе негативы, подписанные мелким почерком: «Порт», «Вокзал», «Фасад Белведера, с крыши депо». Из решётки вентиляции под потолком тихо бормочет радио.
  choices:
    - text: Отпечатать «Фасад Белведера»
      when: [has.facade_photo == 0]
      effects: [has.facade_photo = 1, clues += 1, turn += 1]
      outcome: |
        Изображение проступает в кювете медленно, как воспоминание. Башня под дождём, вывеска на крыше, окна рядами.

        Ты считаешь ряды. Сбиваешься. Считаешь снова, водя пальцем по мокрой бумаге.

        Тринадцать.
    - text: Пересчитать ещё раз
      when: [has.facade_photo == 1, seen.thirteen == 0]
      effects: [seen.thirteen = 1, paths.thirteen = 1]
      outcome: |
        Тринадцать рядов окон. В лифте двенадцать кнопок. Лестница кончается на двенадцатом.

        Где-то в этом доме есть этаж, на который не ведёт ни одна лестница.
    - text: Прислушаться к вентиляции
      when: [seen.vent == 0]
      effects: [seen.vent = 1]
      outcome: |
        Голос диктора, далёкий и ровный: «…для всех, кто не спит в эту ночь. Харроу, девятое небо, радио WHRW». Решётка держится на четырёх винтах. Мэй, похоже, их иногда откручивает.
    - text: Пролезть в вентиляцию
      when: [seen.vent == 1]
      effects: [paths.vent = 1, floor = 9, suspicion += 1]
      outcome: |
        Четыре этажа на локтях в железной кишке, сажа на пальто, голос диктора всё ближе. Решётка над студией поддаётся от плеча.
      goto: service_09
    - text: Проявить негатив без подписи
      when: [memories_returned >= 4, has.signature_photo == 0]
      effects: [has.signature_photo = 1, clues += 1, turn += 1]
      outcome: |
        Среди негативов один без подписи, в отдельном конверте. Мэй сказала бы, что не помнит, откуда он.

        Снято длиннофокусным объективом с крыши депо, через окно двенадцатого этажа. Чёрная стойка, человек в шляпе спиной. Женщина в мокром пальто склонилась над книгой и подписывает. Трость прислонена к стойке. Лица не видно, видно кольцо.

        На обороте карандашом: «15.III, 23:40».
    - text: Уйти
      free: true
      goto: floor_05

# ── 7. Гримёрная Руби ────────────────────────────────────────────────────────

- id: dressing_room
  location: service_07
  background: landing_07
  portrait: ev_ruby_record
  title: Гримёрная
  text: |
    Зеркало в лампочках, половина перегорела. Платья в чехлах, как висельники. На патефоне крутится пластинка, игла давно соскочила с дорожки и шипит в пустоте.
  choices:
    - text: Снять иглу
      when: [seen.dressing_needle == 0]
      effects: [seen.dressing_needle = 1]
      outcome: |
        Тишина. На этикетке: «Руби Вэнс. Синий фонарь, 1941». И карандашом, другой рукой: «Для У., третий столик слева».
    - text: Забрать пластинку
      when: [seen.dressing_needle == 1, has.ruby_record == 0]
      effects: [has.ruby_record = 1, clues += 1, suspicion += 2]
      outcome: |
        Ты прячешь пластинку под пальто. За стеной что-то падает, будто кто-то вскочил. Потом долго ничего.

        Воровать голос у женщины, у которой его нет. Хорошая ночь, Ник.
    - text: Уйти
      free: true
      goto: floor_07

# ── 8. Процедурная. Медкарта Вивиан ──────────────────────────────────────────
# До полуночи там доктор, после — пусто и шкаф с карточками.

- id: procedure_doctor
  location: service_08
  priority: 1
  when: [turn < 4]
  background: landing_08
  portrait: auerbach
  title: Процедурная
  text: |
    Доктор стерилизует инструменты и поднимает глаза поверх очков.

    — Приёмная — соседняя дверь, мистер Кэллоуэй. Сюда входят только лёжа.
  choices:
    - text: Уйти
      free: true
      goto: floor_08

- id: procedure_room
  location: service_08
  background: landing_08
  portrait: ev_medical_file
  title: Процедурная
  text: |
    Пусто. Стол под простынёй, лампа над ним погашена. У стены шкаф с карточками, ключ торчит в замке: здесь некому воровать, кроме самих пациентов.
  choices:
    - text: Найти карточку Вивиан Хейл
      when: [has.medical_file == 0]
      effects: [has.medical_file = 1, clues += 1, suspicion += 1]
      outcome: |
        «Хейл, Вивиан, 33 г. Перелом таза, внутреннее кровотечение. Операция: 4 000, оплачено наличными. Плательщик: У. Хейл».

        Дата операции — март. Тот самый март, когда из кассы «Синего фонаря» пропали четыре тысячи.
    - text: Уйти
      free: true
      goto: floor_08
