# Служебные комнаты 5, 7, 8 (v2, реплики). Служебная дверь 6 — окно на пожарную лестницу.

# ── 5. Фотолаборатория. Фото фасада: тринадцать рядов окон ───────────────────
# Пускают по должку Мэй или по ключу Эдди.

- id: darkroom_locked
  location: service_05
  priority: 1
  when: [debt.mei == 0, has.darkroom_key == 0]
  background: landing_05
  title: Фотолаборатория
  lines:
    - { who: narrator, text: "Красная лампа: «Не входить, идёт проявка». Дверь заперта на ключ." }
    - { who: gut, text: "Мэй не любит, когда к плёнкам приходят без спроса." }
  choices:
    - do: Уйти
      free: true
      goto: floor_05

- id: darkroom
  location: service_05
  background: darkroom
  title: Фотолаборатория
  lines:
    - { who: narrator, text: "Красный свет, кюветы, прищепки. Негативы подписаны: «Порт», «Вокзал», «Фасад Белведера, до дождя»." }
    - { who: narrator, text: "Из решётки вентиляции под потолком бормочет радио." }
  choices:
    - do: Отпечатать «Фасад Белведера»
      when: [has.facade_photo == 0]
      effects: [has.facade_photo = 1, clues += 1, turn += 1]
      reply:
        - { who: narrator, text: "Старый негатив, на конверте год одиннадцатилетней давности. Башня проступает в кювете медленно, как воспоминание." }
        - { who: narrator, text: "Ты считаешь ряды, водя пальцем по мокрой бумаге. Сбиваешься. Считаешь снова." }
        - { who: gut, text: "Тринадцать." }
    - do: Пересчитать ещё раз
      when: [has.facade_photo == 1, seen.thirteen == 0]
      effects: [seen.thirteen = 1, paths.thirteen = 1]
      reply:
        - { who: narrator, text: "Тринадцать рядов окон. В лифте двенадцать кнопок. Лестница кончается на двенадцатом." }
        - { who: gut, text: "В этом доме есть этаж, на который не ведёт ни одна лестница." }
    - do: Прислушаться к вентиляции
      when: [seen.vent == 0]
      effects: [seen.vent = 1]
      reply:
        - { who: narrator, text: "Голос диктора: «…для всех, кто не спит в эту ночь. Радио WHRW»." }
        - { who: gut, text: "Решётка на четырёх винтах. Мэй их иногда откручивает." }
    - do: Пролезть в вентиляцию
      when: [seen.vent == 1]
      effects: [paths.vent = 1, floor = 9, suspicion += 1]
      reply:
        - { who: narrator, text: "Четыре этажа на локтях в железной кишке. Решётка над студией поддаётся от плеча." }
      goto: service_09
    # Негатив «Имени»: открывается при 4 вернувшихся.
    - do: Проявить негатив без подписи
      when: [memories_returned >= 4, has.signature_photo == 0]
      effects: [has.signature_photo = 1, clues += 1, turn += 1]
      reply:
        - { who: narrator, text: "Снято с крыши Белведера: камера на шнуре, в окно двенадцатого. Чёрная стойка, человек в шляпе спиной." }
        - { who: narrator, text: "Женщина в мокром пальто подписывает книгу. Трость у стойки. Лица не видно, видно кольцо." }
        - { who: narrator, text: "На обороте карандашом: «15.III, 23:40»." }
    - do: Уйти
      free: true
      goto: floor_05

# ── 7. Гримёрная Руби ────────────────────────────────────────────────────────

- id: dressing_room
  location: service_07
  background: landing_07
  portrait: ev_ruby_record
  title: Гримёрная
  lines:
    - { who: narrator, text: "Зеркало в лампочках, половина перегорела. Платья в чехлах, как висельники." }
    - { who: narrator, text: "Игла патефона соскочила с дорожки и шипит в пустоте." }
  choices:
    - do: Снять иглу
      when: [seen.dressing_needle == 0]
      effects: [seen.dressing_needle = 1, knows.ruby_u = 1]
      reply:
        - { who: narrator, text: "Тишина. На этикетке: «Руби Вэнс. Синий фонарь, 1941». И другой рукой: «Для У., третий столик слева»." }
    - do: Забрать пластинку
      when: [seen.dressing_needle == 1, has.ruby_record == 0]
      effects: [has.ruby_record = 1, seen.record_stolen = 1, clues += 1, suspicion += 2]
      reply:
        - { who: narrator, text: "Ты прячешь пластинку под пальто. За стеной что-то падает. Потом долго ничего." }
        - { who: gut, text: "Украсть голос у женщины, у которой его нет. Хорошая ночь, Ник." }
    - do: Уйти
      free: true
      goto: floor_07

# ── 8. Процедурная. Медкарта Вивиан ──────────────────────────────────────────
# Пока идёт приём, там доктор. После — пусто и шкаф с карточками.

- id: procedure_doctor
  location: service_08
  priority: 1
  when: [turn < 4]
  background: landing_08
  portrait: auerbach
  title: Процедурная
  lines:
    - { who: narrator, text: "Доктор стерилизует инструменты и смотрит поверх очков." }
    - { who: auerbach, text: "Приёмная — соседняя дверь, мистер Кэллоуэй. Сюда входят только лёжа." }
  choices:
    - do: Уйти
      free: true
      goto: floor_08

- id: procedure_doctor_late
  location: service_08
  priority: 1
  when: [rumor.doctor_late == 1, turn >= 4, turn < 8]
  background: landing_08
  portrait: auerbach
  title: Процедурная
  lines:
    - { who: auerbach, text: "Сегодня я до двух. Не надейтесь, что я засну на посту." }
  choices:
    - do: Уйти
      free: true
      goto: floor_08

- id: procedure_room
  location: service_08
  background: landing_08
  portrait: ev_medical_file
  title: Процедурная
  lines:
    - { who: narrator, text: "Пусто. Стол под простынёй, лампа погашена. В замке шкафа с карточками торчит ключ." }
    - { who: gut, text: "Здесь некому воровать, кроме самих пациентов." }
  choices:
    - do: Найти карточку Вивиан Хейл
      when: [has.medical_file == 0, met.auerbach == 1]
      effects: [has.medical_file = 1, clues += 1, suspicion += 1]
      reply:
        - { who: narrator, text: "«Хейл, Вивиан, 33 г. Перелом таза. Операция: 4 000, оплачено наличными. Плательщик: У. Хейл»." }
        - { who: gut, text: "Март. Тот самый март, когда из кассы «Синего фонаря» пропали четыре тысячи.", when: [knows.shortage == 1] }
    - do: Уйти
      free: true
      goto: floor_08
